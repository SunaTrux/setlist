<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
// iPhone/iPad：文字サイズ16px未満の入力欄をタップすると自動で拡大され、そのまま右側が切れて見えるのを防ぐ
// （iOS ではこの指定があっても指でのピンチ拡大はできる。Android には付けない）
(function(){
  var ua = navigator.userAgent;
  var iOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  if(iOS){ var m = document.querySelector('meta[name=viewport]'); if(m) m.setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover'); }
})();
</script>
<!-- アプリ側でライト／ダークを切り替えるので、ブラウザの強制ダーク（Brave のナイトモード等）をかけない -->
<meta name="color-scheme" content="light dark">
<meta name="darkreader-lock">
<title>プレイヤーズセットリスト</title>
<!-- ホーム画面に追加したとき、Safari のツールバーなしの全画面で開く -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="セットリスト">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="icons/icon-192.png?v=2">
<style>
:root{
  --bg:#EDE8DE; --surface:#F8F5EC; --surface2:#FFFFFF; --text:#211D16; --muted:#6B6355;
  --accent:#C98A2C; --accent-text:#211D16; --border:#D8D0BF; --danger:#A84432; --radius:10px;
  --teal:#3F726C; --teal-dim:#DCEBE8; --teal-text:#3F726C; --pin:#2F7D5B;
  color-scheme:light dark;
}
:root[data-theme="light"]{color-scheme:only light;}
:root[data-theme="dark"]{color-scheme:dark;}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14120F; --surface:#1E1A15; --surface2:#262019; --text:#F2EDE4; --muted:#A79E8C;
    --accent:#E8A33D; --accent-text:#14120F; --border:#332C22; --danger:#C4664A;
    --teal:#4F8C85; --teal-dim:#2F524D; --teal-text:#BFE3DD; --pin:#4FB98A;
  }
}
:root[data-theme="dark"]{
  --bg:#14120F; --surface:#1E1A15; --surface2:#262019; --text:#F2EDE4; --muted:#A79E8C;
  --accent:#E8A33D; --accent-text:#14120F; --border:#332C22; --danger:#C4664A;
  --teal:#4F8C85; --teal-dim:#2F524D; --teal-text:#BFE3DD; --pin:#4FB98A;
}
*{box-sizing:border-box;}
html,body{height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
/* 構成表の下のバーは、iPhoneのホームバー（画面下の横線）の余白を全部はとらず、少しだけ詰めて下に寄せる */
:root{--st-sb:max(0px, calc(env(safe-area-inset-bottom,0px) - 24px));}
html.is-standalone{--st-sb:0px;}   /* ホーム画面のアプリは、ホームバーの分の余白をとらない */
/* iPhoneのホーム画面アプリ（時計・電池の上まで使う表示）では、ページが画面より短いと、iOSが画面の高さを
   上の余白（ステータスバー）ぶん短く扱い、下に固定したバーがその分だけ浮いてしまう。
   ページの高さを上の余白ぶん足して、表の長さにかかわらず一番下に付くようにする */
html.is-standalone{min-height:calc(100% + env(safe-area-inset-top,0px));}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-tap-highlight-color:transparent;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
#app{max-width:520px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; min-width:0;}
/* 画面より横に広がらないように（Safari はプルダウンの一番長い選択肢の幅で広がることがある） */
body{overflow-x:hidden;}
#app > *{min-width:0; max-width:100%;}
.stock-tools > *, .song-toolbar > *, .list-opts > *, .setlist-head > *{min-width:0;}
.sort-chip select{max-width:100%;}

header{position:sticky; top:0; padding-top:calc(14px + env(safe-area-inset-top,0px)); background:var(--bg); z-index:10; border-bottom:1px solid var(--border);}
h1{font-size:20px; margin:0 16px 12px; letter-spacing:.02em;}
.tagline{margin:-8px 16px 10px; font-size:12px; color:var(--muted); line-height:1.5; overflow-wrap:anywhere;}
.tagline:empty{display:none;}
nav button{display:inline-flex; align-items:center; justify-content:center; gap:5px;}
.tab-ic{width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
nav{display:flex; padding:0 16px; gap:4px;}
nav button{flex:1; padding:10px 0; background:none; border:none; color:var(--muted); font-size:14px; font-weight:600; border-bottom:2px solid transparent; cursor:pointer;}
nav button.active{color:var(--text); border-bottom-color:var(--accent);}

main{flex:1; padding:16px; padding-bottom:40px; box-sizing:border-box; width:100%; overflow-x:clip;}
.empty{color:var(--muted); font-size:14px; text-align:center; padding:40px 12px; line-height:1.7;}
.hint{color:var(--muted); font-size:12px; padding:0 2px 14px; line-height:1.6;}

.btn{display:inline-block; padding:10px 16px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:14px; font-weight:600; cursor:pointer;}
.btn-accent{background:var(--accent); color:var(--accent-text); border-color:var(--accent);}
.btn-ghost{background:none; border:none; color:var(--muted); font-weight:500; padding:6px 8px; cursor:pointer;}
.back-btn{display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:8px 18px 8px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-family:inherit; font-size:15px; font-weight:700; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent;}
.back-btn .back-arrow{font-size:18px; line-height:1;}
.btn-danger{color:var(--danger); background:none; border:none; font-weight:500; cursor:pointer;}
.btn-block{width:100%; text-align:center; margin-bottom:14px;}
.btn-with-icon{display:flex; align-items:center; justify-content:center; gap:8px;}
.btn-with-icon svg{flex-shrink:0;}
.btn-tap{flex-shrink:0; padding:0 10px; border-radius:8px; border:1px solid var(--accent); background:none; color:var(--accent); font-size:11px; font-weight:700; letter-spacing:.04em; cursor:pointer;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:10px; overflow:hidden;}
.song-card{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; padding:14px;}
.song-main{min-width:0;}
.song-name{font-size:16px; font-weight:700; margin-bottom:4px; overflow-wrap:anywhere;}
.song-meta{font-size:12px; color:var(--muted); display:flex; gap:8px; flex-wrap:wrap;}
.song-meta span.tag{background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:1px 6px;}
.song-flow{font-size:12px; color:var(--muted); margin-top:6px;}
.row-actions{display:flex; gap:6px; flex-shrink:0;}
.icon-btn{width:40px; height:40px; padding:0; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer;}
.icon-btn.danger{color:var(--danger);}
.song-main.tappable{flex:1; cursor:pointer;}
.ref-link{display:inline-block; margin-top:6px; font-size:13px; font-weight:600; color:var(--accent); text-decoration:none;}

.detail-panel{border-top:1px solid var(--border); padding:12px 14px; background:var(--surface2);}
.detail-line{font-size:13px; color:var(--muted); margin-bottom:6px; line-height:1.6;}
.detail-line a{color:var(--accent); text-decoration:none; font-weight:600;}
.detail-note{font-size:13px; white-space:pre-wrap; line-height:1.7; overflow-wrap:anywhere;}
.detail-se{margin-bottom:4px;}
.muted{color:var(--muted);}

.live-card{display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px; cursor:pointer; color:var(--text);}
.live-date{font-size:12px; color:var(--accent); font-weight:700; letter-spacing:.03em;}
/* 日付の状態（バンドマン持ち物リストと同じ：今日＝オレンジ、これから＝緑、過去＝グレー） */
.st-badge{display:inline-block; font-size:11px; font-weight:700; border-radius:999px; padding:0 8px; line-height:17px; margin-right:6px; vertical-align:1px; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif; letter-spacing:0;}
.st-today{background:var(--accent); color:#fff;}
.st-future{background:var(--teal-dim); color:var(--teal-text); border:1px solid var(--teal); line-height:15px;}
.st-past{background:transparent; color:var(--muted); border:1px solid var(--border); line-height:15px;}
.live-card-wrap.st-card-today .live-card, .fold-card.st-card-today{box-shadow:inset 4px 0 0 var(--accent);}
.live-card-wrap.st-card-future .live-card, .fold-card.st-card-future{box-shadow:inset 4px 0 0 var(--teal);}
.live-card-wrap.st-card-past .live-card, .fold-card.st-card-past{box-shadow:inset 4px 0 0 var(--border);}
.past-toggle{display:flex; align-items:center; gap:8px; font-size:13px; margin:-4px 2px 10px; cursor:pointer; color:var(--muted);}
.past-toggle input{width:18px; height:18px; margin:0; accent-color:var(--accent);}
.live-card-wrap.st-card-past .live-date, .live-card-wrap.st-card-past .live-venue, .live-card-wrap.st-card-past .live-count{opacity:.6;}
.live-venue{font-size:14px; font-weight:700; margin:4px 0 2px;}
.live-artist{font-size:13px; color:var(--muted);}
.live-count{font-size:12px; color:var(--muted); margin-top:6px;}
.live-card-wrap{position:relative; margin-bottom:10px; border-radius:var(--radius); overflow:hidden; background:var(--surface);}
.live-card-wrap .live-card{padding-right:72px; margin-bottom:0; min-height:100px;}   /* 右上の✕と右下のボタンが重ならない高さを確保 */
.live-del-btn{position:absolute; right:12px; top:12px; margin:0;}
.live-card-acts{position:absolute; right:12px; bottom:12px; display:flex; gap:6px;}
.live-card-acts .row-struct{height:34px; padding:0 12px; touch-action:manipulation;}
.live-card-acts .live-setlist-btn{color:var(--text); border-color:var(--border);}
/* イベント一覧の表示切り替え */
.lives-opts{margin:2px 0 10px;}
.lives-lock-note{margin:0 0 10px;}
.live-memo{margin-top:6px; font-size:12px; line-height:1.5; color:var(--text); white-space:pre-wrap; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}
.live-songs{margin-top:6px; font-size:12px; line-height:1.55; color:var(--muted); overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}
.live-songs .mono{color:var(--accent); font-weight:700; margin-right:2px;}
.live-songs-sep{opacity:.5;}
.lv-full .live-card-wrap .live-card{padding-bottom:52px;}   /* 下のボタンに文字がかからないように */
.lv-full .live-count{position:absolute; left:14px; bottom:20px; margin:0;}
.lv-min .live-card-wrap .live-card{min-height:0; padding:10px 12px 10px 14px; padding-right:152px;}
.lv-min .live-card-acts{right:10px; gap:4px;}
.lv-min .live-card-acts .row-struct{height:32px; padding:0 9px; font-size:12px;}
.lv-full .live-title-line{flex-wrap:wrap; row-gap:0;}
.lv-full .live-title-line .live-venue, .lv-full .live-title-line .live-artist{white-space:normal; overflow:visible; text-overflow:clip;}
.lv-min .live-place, .lv-min .live-count, .lv-min .live-del-btn{display:none;}   /* 最小は✕も出さない（削除は左スワイプで） */
.lv-min .live-card-acts{top:50%; bottom:auto; transform:translateY(-50%);}
.lv-min .live-title-line{margin-top:2px;}
.lv-min .lock-mark{margin-left:6px;}
.live-info-ro{padding:0 14px 14px;}
.live-info-ro .info-row{display:flex; gap:10px; padding:6px 0; border-bottom:1px solid var(--border); font-size:13px;}
.live-info-ro .info-k{flex:none; width:6.5em; color:var(--muted); font-size:12px; font-weight:600;}
.live-info-ro .info-v{min-width:0; overflow-wrap:anywhere;}
.live-info-ro .info-memo{white-space:pre-wrap;}
.live-info-ro .hint{margin-top:10px;}

.panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:16px;}
.field{margin-bottom:10px;}
.field label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px;}
.field input,.field select,.field textarea{width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:15px; font-family:inherit;}
.time-wrap{position:relative; border-radius:8px; border:1px solid var(--border); background:var(--surface2); overflow:hidden;}
.time-undecided{display:none; position:absolute; inset:0; align-items:center; justify-content:center; font-size:16px; color:var(--muted); pointer-events:none;}
.time-wrap.is-empty .time-undecided{display:flex;}
.time-wrap.is-empty input[type="time"]{color:transparent;}
.time-wrap.is-empty input[type="time"]::-webkit-datetime-edit{color:transparent;}
.time-clear{position:absolute; right:4px; top:50%; transform:translateY(-50%); width:26px; height:26px; border-radius:50%; border:none; background:none; color:var(--muted); font-size:16px; line-height:1; cursor:pointer;}
.time-wrap.is-empty .time-clear{display:none;}
.time-wrap:not(.is-empty) input[type="time"]{padding-right:30px;}
.time-wrap input[type="time"]{display:block; width:100%; max-width:100%; padding:9px 10px; border:none; border-radius:0; background:transparent; box-sizing:border-box; -webkit-appearance:none; appearance:none;}
.field textarea{resize:vertical; line-height:1.6;}
.field-row{display:flex; gap:8px;}
.field-row .field{flex:1;}
.date-row{display:flex; align-items:center; gap:8px;}
.date-row input{flex:1;}
.dow-badge{font-size:14px; color:var(--muted); min-width:26px; font-weight:600;}
.bpm-row{display:flex; gap:6px;}
.bpm-row input{flex:1;}
.dur-row{display:flex; align-items:center; gap:6px;}
.dur-row select{flex:0 0 auto; padding:9px 8px; width:auto; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:15px;}
.dur-sep{font-size:13px; color:var(--muted);}
.form-actions{display:flex; gap:8px; margin-top:4px;}
.stock-reg-actions{margin:12px 0 28px;}   /* 曲を登録（ネット検索・ライブラリ）のキャンセルと、下の曲一覧の間をあける */

.data-place{background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:14px; font-size:12.5px; line-height:1.65; color:var(--text);}
.data-place p{margin:6px 0 0;}
.data-place ul{margin:4px 0 0; padding-left:1.3em;}
.data-place-now{font-size:13px;}
.data-place-now b{color:var(--accent);}
.data-place-warn{color:var(--muted);}
.set-acc{padding:0; margin-bottom:8px;}
.set-acc > summary{list-style:none; cursor:pointer; display:flex; align-items:baseline; gap:10px; padding:14px; min-height:48px; box-sizing:border-box;}
.set-acc > summary::-webkit-details-marker{display:none;}
.set-acc > summary::after{content:''; margin-left:auto; align-self:center; flex:none; width:8px; height:8px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:rotate(45deg) translateY(-3px); transition:transform .15s;}
.set-acc[open] > summary::after{transform:rotate(-135deg) translateY(-1px);}
.set-acc-t{font-size:15px; font-weight:700; flex:none;}
.set-acc-s{font-size:12px; color:var(--muted); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.set-acc-body{padding:0 14px 14px;}
.set-acc-body > :last-child{margin-bottom:0;}
.set-acc[open] > summary{padding-bottom:10px;}
.set-acc-danger .set-acc-t{color:var(--danger);}
.tagline-tools{display:flex; align-items:center; gap:8px; margin-top:6px;}
.tagline-tools .hint{flex:1; margin:0; padding:0;}
.tagline-reset{flex:none; padding:6px 10px; font-size:12px; white-space:nowrap;}
/* 設定の2カラム（スマホ横・タブレット・PC） */
.set-split{display:grid; grid-template-columns:minmax(170px, 230px) minmax(0, 1fr); gap:16px; align-items:start;}
.set-nav{display:flex; flex-direction:column; gap:2px; padding:6px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);}
.set-nav button{display:flex; flex-direction:column; align-items:flex-start; gap:2px; width:100%; text-align:left; padding:10px 12px; border:none; border-radius:10px; background:none; color:var(--text); font-family:inherit; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent;}
.set-nav button .t{font-size:14px; font-weight:700;}
.set-nav-group{font-size:11px; font-weight:700; color:var(--muted); padding:12px 12px 4px; border-top:1px solid var(--border); margin-top:4px;}
.set-nav button .s{font-size:11px; color:var(--muted); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.set-nav button.set-acc-danger .t{color:var(--danger);}
.set-nav button.on{background:var(--accent); color:var(--accent-text);}
.set-nav button.on .t, .set-nav button.on .s{color:inherit;}
.set-nav button.on .s{opacity:.85;}
.set-sec{display:none; padding:16px; margin:0;}
.set-sec.on{display:block;}
.set-sec-h{font-size:17px; font-weight:700; margin:0 0 14px;}
.set-sec.set-acc-danger .set-sec-h{color:var(--danger);}
.set-sec .set-acc-body{padding:0;}
.set-pane .app-version{margin-top:16px;}
.create-head{display:flex; align-items:center; gap:8px; width:100%; margin:16px 0 8px; padding:10px 12px; border:1px dashed var(--border); border-radius:var(--radius); background:transparent; color:var(--muted); font-family:inherit; cursor:pointer; text-align:left; scroll-margin-top:8px;}
.create-head.open{border-style:solid; margin-bottom:8px;}
.create-title{font-size:13px; font-weight:700; letter-spacing:.03em; color:var(--text);}
.create-sub{font-size:12px; color:var(--muted); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.create-head .fold-toggle{margin-left:auto;}
.section-title{font-size:13px; font-weight:700; color:var(--muted); margin:20px 0 8px; letter-spacing:.03em;}

.totals-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:16px;}
.totals-row{display:flex; justify-content:space-between; align-items:baseline; padding:3px 0;}
.totals-label{font-size:12px; color:var(--muted);}
.totals-value{font-size:15px; font-weight:700;}
.totals-row-main .totals-label{font-weight:700; color:var(--text); font-size:13px;}
.totals-row-main .totals-value{font-size:20px; color:var(--accent);}
.totals-head{display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:30px;}
.totals-head .totals-label{font-weight:700; color:var(--text); font-size:13px;}
.totals-head .totals-value{font-size:20px; font-weight:700; color:var(--accent);}
.totals-mini-timer{display:flex; align-items:center; justify-content:center; gap:8px; padding:0 14px 12px; margin-top:-4px; font-size:12px; color:var(--muted);}
.totals-mini-timer .timer-display{font-size:20px;}
.fold-body > .timer-start-btn:first-child, .fold-body > .timer-row:first-child{margin-top:0;}
.totals-row-sub{margin-top:6px; padding-top:8px; border-top:1px dashed var(--border);}
.totals-compare{font-size:12px; text-align:right; margin-top:2px; font-weight:600;}
.totals-compare.over{color:var(--danger);}
.totals-compare.under{color:var(--accent);}
.totals-compare.even{color:var(--muted);}
.timer-start-btn{display:block; width:100%; margin-top:10px; padding:9px 12px; text-align:center;}
.timer-row{display:flex; flex-direction:column; align-items:center; gap:8px; margin-top:10px; padding:12px 10px; border-radius:8px; background:var(--surface2); border:1px solid var(--border);}
.timer-main{display:flex; flex-direction:column; align-items:center; gap:2px;}
.timer-sub{display:flex; align-items:center; gap:6px; min-height:18px;}
.timer-row .timer-display{font-size:36px; line-height:1.1;}
.timer-display{font-size:22px; font-weight:700; letter-spacing:.02em; color:var(--accent);}
.timer-display.timer-over{color:var(--danger);}
.timer-badge{display:inline-block; padding:1px 7px; border-radius:999px; background:var(--accent); color:var(--accent-text); font-size:10px; font-weight:700;}
.timer-controls{display:flex; gap:6px; justify-content:center;}

.bpm-chip{display:flex; align-items:center; gap:6px; height:34px; padding:0 12px 0 10px; border-radius:999px; border:1px solid var(--border); background:var(--surface2); color:var(--text); cursor:pointer; font-family:inherit;}
.bpm-chip span{font-size:15px; font-weight:700;}
.bpm-chip small{font-size:10px; color:var(--muted); letter-spacing:.05em;}
.bpm-chip.playing{background:var(--accent); border-color:var(--accent); color:var(--accent-text);}
.bpm-chip.playing small{color:var(--accent-text);}
.drag-handle{flex-shrink:0; width:36px; height:36px; margin:-6px -6px -6px 0; display:flex; align-items:center; justify-content:center; color:var(--muted); cursor:grab; touch-action:none; -webkit-user-select:none; user-select:none; border-radius:8px;}
.drag-handle:active{cursor:grabbing;}
.setlist-item.dragging{position:relative; z-index:20; box-shadow:0 10px 24px rgba(0,0,0,.28); border-color:var(--accent); opacity:.97;}
body.is-dragging{-webkit-user-select:none; user-select:none; cursor:grabbing;}
.setlist-row2 .row-del{margin-left:auto;}
.setlist-row2 .row-edit + .row-del{margin-left:0;}
.setlist-row2 .row-struct + .row-del{margin-left:0;}
.rhythm-tag{font-size:12px; line-height:18px; padding:2px 8px; border-radius:999px; background:var(--surface2); border:1px solid var(--border); color:var(--muted); white-space:nowrap;}
.row-edit{flex-shrink:0; width:34px; height:34px; padding:0; margin-left:auto; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer;}
.stock-name{cursor:default;}
.stock-tools{display:flex; gap:8px; align-items:stretch; margin-bottom:14px;}
.stock-tools .select-btn{flex:0 0 auto; min-height:44px; padding:0 14px; font-size:14px; font-weight:700; white-space:nowrap;}
.stock-search-bar{align-items:center;}
.stock-q{flex:1; min-width:0; height:44px; padding:0 12px; border-radius:var(--radius); border:1px solid var(--accent); background:var(--surface2); color:var(--text); font-size:16px; font-family:inherit;}
.stock-search-bar .btn{flex:0 0 auto;}
.stock-sel-tools{display:flex; justify-content:flex-end; margin:-2px 0 6px;}
.stock-sel-tools .btn{padding:7px 12px; font-size:12.5px;}
.select-count{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.sel-clear{margin-left:auto; border:none; background:none; padding:0; color:var(--accent); font-size:12px; font-weight:700; text-decoration:underline; cursor:pointer; font-family:inherit;}
.select-actions + .select-actions{margin-top:8px;}
.select-actions .btn.select-del{color:var(--danger); border-color:var(--danger);}
.stock-tools .sort-chip{flex:1 1 0; max-width:none;}
.bulk-btn{flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:0 14px;}
.bulk-box{max-width:440px; max-height:86vh; max-height:calc(100dvh - 32px); display:flex; flex-direction:column; overflow-y:auto; overscroll-behavior:contain; padding:14px;}
.bulk-box .hint{font-size:12px; line-height:1.5; padding:0 0 6px !important;}
.bulk-box .modal-actions .btn{padding:9px 14px;}
#bulk-overlay{padding:12px;}
.bulk-head{font-size:15px; font-weight:700; margin-bottom:4px;}
.bulk-text{width:100%; padding:8px 10px; margin-bottom:10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:15px; line-height:1.6; font-family:inherit; resize:vertical;}
.ocr-list{overflow-y:auto; flex:1; min-height:0; margin-bottom:12px; border:1px solid var(--border); border-radius:8px;}
.ocr-row{display:flex; align-items:center; gap:8px; padding:8px 10px; border-top:1px solid var(--border);}
.ocr-row:first-child{border-top:none;}
.ocr-row.is-off .ocr-main, .ocr-row.is-off .ocr-dur{opacity:.45;}
.ocr-row > input[type=checkbox]{flex-shrink:0; width:20px; height:20px; accent-color:var(--accent);}
.ocr-main{flex:1; min-width:0;}
.ocr-name{width:100%; padding:6px 8px; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:15px; font-family:inherit;}
.ocr-sub{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:11px; color:var(--muted); margin-top:3px; min-height:14px;}
.ocr-dur{flex-shrink:0; width:62px; padding:6px; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:14px; text-align:center;}
.bulk-box .pos-row{margin-bottom:12px;}
.setlist-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:20px 0 8px;}
.head-toggles{display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:flex-end;}
.list-opts{display:flex; justify-content:flex-start; align-items:center; gap:8px; flex-wrap:wrap; margin:-4px 0 6px;}
.lock-btn{flex:none; height:30px; padding:0 8px; border-radius:999px; border:1px solid var(--border); background:var(--surface2); color:var(--muted); font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; touch-action:manipulation;}
.lock-btn.on{background:var(--text); border-color:var(--text); color:var(--bg);}
.list-opts .lock-btn{margin-left:auto;}   /* 表示切り替えは左、ロックは右 */
.setlist-item.just-added{animation:justAdded 1.6s ease;}
@keyframes justAdded{0%,40%{box-shadow:0 0 0 2px var(--accent);} 100%{box-shadow:0 0 0 2px transparent;}}
@media (prefers-reduced-motion: reduce){ .setlist-item.just-added{animation:none; box-shadow:0 0 0 2px var(--accent);} }
.lock-note{margin:16px 0 8px; padding:10px 12px; border:1px dashed var(--border); border-radius:var(--radius); font-size:12.5px; color:var(--muted); line-height:1.6;}
.lock-note .link-btn{margin-left:6px; border:none; background:none; padding:0; color:var(--accent); font-weight:700; text-decoration:underline; cursor:pointer; font-size:inherit; font-family:inherit;}
.num-toggle.is-locked{cursor:default; opacity:.7;}
.lock-mark{margin-right:4px;}
.live-title-line{display:flex; align-items:baseline; gap:8px; min-width:0;}
.live-title-line .live-venue{flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.live-title-line .live-artist{flex:0 100 auto; min-width:3em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.sl-head-card{margin-top:22px;}
.sl-head-card .totals-head .totals-label{font-size:15px;}
.sl-head-card .totals-label small{font-size:12px; font-weight:600; color:var(--muted); margin-left:2px;}
.sl-head-card + .sl-tools{margin-top:10px;}
.setlist-row1 .c-only{display:none;}
body.cards-min .setlist-row1 .c-only{display:flex;}
.setlist-row1 .row-edit, .setlist-row1 .row-del{width:32px; height:32px; margin:-4px 0; margin-left:0;}
body.cards-min .setlist-row2{display:none;}
.setlist-row3{padding:0 12px 10px; margin-top:-2px; font-size:12px; line-height:1.55; color:var(--text);}
.setlist-row3 .r3-se{overflow-wrap:anywhere; margin-top:3px; font-weight:600; color:var(--muted);}
.setlist-row3 .r3-artist{font-size:12px; font-weight:600; color:var(--muted);}
.setlist-row3 .r3-note{margin-top:2px; color:var(--text); white-space:pre-wrap; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}
body.cards-min .setlist-row3{display:none;}
.name-sub{display:none;}
body.cards-bk .setlist-row3{display:none;}
.sl-tools{margin-top:-2px;}
.sl-view-hint .link-btn{margin-left:6px; border:none; background:none; padding:0; color:var(--accent); font-weight:700; text-decoration:underline; cursor:pointer; font-size:inherit; font-family:inherit;}
.ns-bpm.ov{color:var(--accent);}
.view-seg{display:flex; align-items:center; gap:8px;}
.view-seg-label{font-size:12px; font-weight:600; color:var(--muted);}
.view-seg .pos-seg button{padding:6px 12px;}
.eye-btn{flex-shrink:0; width:42px; height:42px; margin:-6px -4px -6px 4px; display:flex; align-items:center; justify-content:center; border-radius:10px; border:1px solid var(--border); background:var(--surface2); color:var(--text); cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent;}
.eye-btn.off{color:var(--muted); background:none; border-style:dashed;}
.select-row.is-hidden .select-name, .select-row.is-hidden .select-dur{color:var(--muted);}
.export-opts{display:flex; align-items:center; gap:8px; margin:-2px 0 10px;}
.export-opts-label{font-size:12px; font-weight:600; color:var(--muted);}
.opt-chip{padding:6px 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--muted); font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; touch-action:manipulation;}
.opt-chip.on{background:var(--accent); border-color:var(--accent); color:var(--accent-text);}
.hidden-tag{display:inline-block; margin-left:6px; padding:0 6px; border-radius:999px; border:1px solid var(--border); font-size:10px; font-weight:700; color:var(--muted); vertical-align:middle;}
body.cards-min .setlist-row1{padding:8px 12px;}
body.cards-min .setlist-row1 .dur-label{display:none;}   /* 最小表示は曲の分数を隠して曲名を長く（セットリスト・曲マスタ） */
.show-toggle{display:flex; align-items:center; gap:8px; padding:4px 0; border:none; background:none; color:var(--muted); font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;}
.switch{position:relative; width:36px; height:20px; border-radius:999px; background:var(--border); transition:background .15s;}
.switch span{position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--surface2); transition:transform .15s;}
.show-toggle.on .switch{background:var(--accent);}
.show-toggle.on .switch span{transform:translateX(16px);}
@media (prefers-reduced-motion: reduce){ .switch, .switch span{transition:none;} }
.pack-list{display:flex; flex-direction:column; gap:8px; margin-bottom:10px;}
.pack-list .btn{display:flex; justify-content:space-between; align-items:center; text-align:left;}
.pack-count{font-size:12px; color:var(--muted); font-weight:500;}
.pos-row{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;}
.pos-seg{display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
.pos-seg button{padding:6px 14px; border:none; background:var(--surface2); color:var(--muted); font-size:12px; font-weight:600; cursor:pointer;}
.pos-seg button + button{border-left:1px solid var(--border);}
.pos-seg button.on{background:var(--accent); color:var(--accent-text);}
.quick-song-row{display:flex; gap:6px; align-items:stretch;}
.quick-song-row input{flex:1; min-width:0; padding:9px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:15px; font-family:inherit;}
.quick-song-row select{flex-shrink:0; padding:0 6px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:15px;}
.quick-song-row .btn{flex-shrink:0; padding:9px 14px;}
.suggest-list{margin-top:6px; border:1px solid var(--border); border-radius:8px; background:var(--surface2); overflow:hidden;}
.suggest-head{font-size:11px; color:var(--muted); padding:6px 10px 2px;}
.suggest-item{display:flex; align-items:center; gap:8px; width:100%; padding:10px; border:none; border-top:1px solid var(--border); background:none; color:var(--text); font-size:15px; text-align:left; cursor:pointer; font-family:inherit;}
.suggest-head + .suggest-item{border-top:none;}
.suggest-name{flex:1; min-width:0; overflow-wrap:anywhere;}
.suggest-used{font-size:11px; color:var(--muted); border:1px solid var(--border); border-radius:999px; padding:1px 7px; flex-shrink:0;}
.suggest-dur{font-size:13px; color:var(--muted); flex-shrink:0;}
.net-search{display:flex; gap:8px; padding:4px 10px 0;}
.net-btn{flex:1; text-align:center; padding:9px 6px; font-size:13px; text-decoration:none;}
.net-note{font-size:11px; color:var(--muted); padding:8px 10px 10px; line-height:1.6;}
.reg-seg{display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:10px;}
.reg-seg button{flex:1; padding:8px 4px; border:none; background:var(--surface2); color:var(--muted); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;}
.reg-seg button + button{border-left:1px solid var(--border);}
.reg-seg button.on{background:var(--accent); color:var(--accent-text);}
.reg-search{width:100%; box-sizing:border-box; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:15px; font-family:inherit; margin-bottom:8px;}
.reg-count{font-size:12px; color:var(--muted); padding:2px 2px 6px;}
.reg-list{border:1px solid var(--border); border-radius:8px; background:var(--surface2); overflow:hidden;}
.reg-row{display:flex; align-items:center; gap:10px; padding:8px 10px; border-top:1px solid var(--border);}
.reg-list .reg-row:first-child{border-top:none;}
.reg-art{width:48px; height:48px; flex-shrink:0; border-radius:6px; overflow:hidden; background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--muted);}
.reg-art img{width:100%; height:100%; object-fit:cover; display:block;}
.reg-main{flex:1; min-width:0;}
.reg-title{font-size:15px; color:var(--text); overflow-wrap:anywhere; line-height:1.35;}
.reg-sub{font-size:12px; color:var(--muted); overflow-wrap:anywhere; line-height:1.4; margin-top:2px;}
.reg-row .btn{flex-shrink:0; padding:6px 12px; font-size:13px;}
.reg-empty{font-size:13px; color:var(--muted); padding:12px 4px; line-height:1.6;}
.suggest-who{display:block; font-size:11px; color:var(--muted); margin-top:1px;}
.detail-edit-link{margin-top:8px; padding:4px 0; font-size:13px; color:var(--accent); font-weight:600;}
.add-panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px; margin-bottom:12px;}
.add-panel .quick-add-row{margin-bottom:0;}
.add-panel .field{margin-bottom:12px;}
.song-toolbar{display:flex; gap:8px; align-items:stretch; margin-bottom:14px;}
.song-toolbar .btn-accent{flex:1 0 auto; text-align:center; white-space:nowrap; padding-left:12px; padding-right:12px;}
.sort-chip{position:relative; display:flex; align-items:center; flex:0 1 auto; min-width:0; max-width:45%; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface2); color:var(--text);}
.sort-chip svg{position:absolute; left:10px; pointer-events:none; color:var(--muted);}
.sort-chip select{flex:1; min-width:0; width:100%; height:100%; min-height:40px; padding:0 8px 0 30px; border:none; background:transparent; color:var(--text); font-size:12.5px; font-family:inherit; text-overflow:ellipsis;}
.song-picker{max-height:200px; overflow-y:auto; border:1px solid var(--border); border-radius:8px; padding:4px 10px; background:var(--surface2);}
.song-picker-item{display:flex; align-items:center; gap:8px; padding:7px 0; font-size:14px; border-bottom:1px solid var(--border);}
.song-picker-item:last-child{border-bottom:none;}
.song-picker-item input{flex-shrink:0; width:16px; height:16px;}
.quick-add-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
.chip{padding:7px 12px; border-radius:999px; border:1px dashed var(--border); background:none; color:var(--muted); font-size:12px; font-weight:600; cursor:pointer;}
.setlist-item.is-other{background:var(--surface2); border-style:dashed;}
.setlist-item.is-other .setlist-name-btn{color:var(--muted); font-weight:600;}
.setlist-item.is-other .setlist-num{color:var(--muted); font-weight:400; font-size:14px;}
.other-icon{vertical-align:-2px; margin-right:2px;}
/* ---- 構成表（曲カードの「構成」から開く） ---- */
:root{
  --kime:#B8323A; --c-intro:#6E6658; --c-a:#2F64B8; --c-b:#24855A; --c-sabi:#C2452C; --c-bridge:#7350B5; --c-solo:#16808A; --c-big:#AE3478; --c-drop:#A86A00;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --kime:#FF6670; --c-intro:#9A917F; --c-a:#6B9CF0; --c-b:#4FC48B; --c-sabi:#FF7559; --c-bridge:#A688F0; --c-solo:#3DBDC4; --c-big:#EC66AE; --c-drop:#F2B43C;
  }
}
:root[data-theme="dark"]{
  --kime:#FF6670; --c-intro:#9A917F; --c-a:#6B9CF0; --c-b:#4FC48B; --c-sabi:#FF7559; --c-bridge:#A688F0; --c-solo:#3DBDC4; --c-big:#EC66AE; --c-drop:#F2B43C;
}
.row-struct{flex-shrink:0; height:34px; padding:0 8px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--muted); font-family:inherit; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; cursor:pointer; white-space:nowrap;}
.row-struct.has{color:var(--accent); border-color:var(--accent);}
.st-has-mark{display:inline-flex; vertical-align:-1px; margin-left:6px; color:var(--accent); opacity:.85;}
.setlist-row1 .row-struct{height:32px; margin:-4px 0;}
.setlist-row2 .row-struct{margin-left:auto;}
.setlist-row2 .row-struct + .row-edit{margin-left:0;}
body.struct-open main{padding-bottom:96px; padding-top:calc(10px + env(safe-area-inset-top,0px));}
body.struct-open header{display:none;}
.st-head .back-btn{min-height:34px; padding:4px 12px 4px 8px; font-size:13px; border-radius:8px; gap:4px;}
.st-info{display:flex; flex-direction:column; gap:4px; padding:6px 2px 10px;}
.st-info-row{display:flex; align-items:flex-start; gap:8px; margin-bottom:10px;}
.st-info-row .st-info{padding-bottom:0;}
.st-info-end{padding:10px 2px 0;}
.st-info-row .st-info{flex:1; min-width:0;}
.st-min-btn{flex-shrink:0; margin-top:2px; height:30px; padding:0 12px; border-radius:999px; border:1px solid var(--border); background:var(--surface2); color:var(--muted); font-family:inherit; font-size:13px; font-weight:700; cursor:pointer;}
.st-min-btn[aria-pressed="true"]{background:var(--text); border-color:var(--text); color:var(--bg);}
.st-se-min{display:block; font-size:14px; overflow-wrap:anywhere;}
.st-se-min.st-memo{font-weight:500; color:var(--muted); font-size:13px;}
.st-info .st-se{font-weight:600;}
.st-info .st-se .lab{min-width:5.6em; text-align:center; box-sizing:border-box;}
.st-info .st-memo{font-weight:400; color:var(--text); white-space:pre-wrap; overflow-wrap:anywhere;}

.st-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px;}
.st-title-row{display:flex; align-items:center; gap:10px;}
.st-head-r{display:flex; align-items:center; gap:6px; flex:none;}
.st-lock-btn{flex:none; width:34px; height:34px; padding:0; border-radius:999px; border:1px solid var(--border); background:var(--surface2); font-size:14px; line-height:1; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent;}
.st-lock-tag{flex:none; height:34px; display:inline-flex; align-items:center; padding:0 12px; border-radius:999px; border:none; background:var(--text); color:var(--bg); font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent;}
.st-lock-mini{font-size:14px; margin-right:4px;}
.st-tbtn:disabled, .st-tkey:disabled{opacity:.45; cursor:default;}
.st-back-mini{flex:none; width:34px; height:34px; padding:0; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:18px; font-weight:700; line-height:1; cursor:pointer; touch-action:manipulation; display:flex; align-items:center; justify-content:center;}
.st-title-box{flex:1; min-width:0;}
.st-title{font-size:20px; font-weight:700; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.st-no small{font-size:.6em; color:var(--muted); font-weight:700; margin-left:1px;}
.st-no{color:var(--accent); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-variant-numeric:tabular-nums; margin-right:.45em;}
.st-artist{font-size:12px; color:var(--muted); margin-top:1px;}
.st-nav{display:flex; gap:6px; flex:none;}
.st-nav button{width:40px; height:40px; padding:0; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer;}
.st-nav button:disabled{opacity:.35; cursor:default;}
.st-nav svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round;}
.st-meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
.st-chip{display:inline-flex; align-items:center; justify-content:center; line-height:1.3; font-size:12px; border:1px solid var(--border); border-radius:999px; padding:2px 9px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap;}
.st-chip b{color:var(--text); font-weight:700; margin-left:4px;}
.st-chip-plain b{margin-left:0;}
.st-filters{display:flex; gap:4px; margin:10px 0;}
.st-chordbar{display:flex; align-items:center; gap:5px; flex-wrap:wrap; margin:-2px 0 10px;}
.st-chordbar[hidden]{display:none;}
.st-cmode button, .st-capo button{padding:5px 6px; font-size:12px;}
.st-cmode button:disabled{opacity:.4;}
.st-trans{display:flex; align-items:center; gap:3px; margin-left:auto;}
.st-trans-lab{font-size:11px; font-weight:700; color:var(--muted); margin-right:2px;}
.st-tbtn{width:26px; height:30px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:16px; font-weight:700; cursor:pointer; touch-action:manipulation;}
.st-tkey{min-width:4em; height:30px; padding:0 6px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--muted); font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; touch-action:manipulation; white-space:nowrap;}
.st-tkey.on{border-color:var(--accent); color:var(--accent);}
.st-commit{flex-basis:100%; display:flex; align-items:center; gap:6px; justify-content:flex-end; font-size:11px; color:var(--muted);}
.st-commit span{margin-right:auto; min-width:0;}
.st-commit .btn{flex-shrink:0; white-space:nowrap; padding:6px 14px; font-size:13px;}
.st-trans-note{margin-left:auto; font-size:11px; color:var(--muted);}
.st-fbtn{display:inline-flex; align-items:center; justify-content:center; text-align:center; line-height:1; flex:1 1 auto; min-width:0; white-space:nowrap; border:1px solid var(--border); background:transparent; border-radius:999px; height:30px; padding:0 6px; font-family:inherit; font-size:12.5px; color:var(--muted); cursor:pointer; touch-action:manipulation;}
.st-fbtn[aria-pressed="true"]{background:var(--text); border-color:var(--text); color:var(--bg); font-weight:700;}

.st-se{display:flex; gap:6px; align-items:baseline; font-size:13px; font-weight:700; color:var(--text);}
.st-se .lab{flex-shrink:0; font-size:10px; font-weight:700; letter-spacing:.06em; color:var(--bg); background:var(--text); border-radius:3px; padding:2px 6px; white-space:nowrap;}
.st-cue{display:flex; gap:8px; align-items:baseline; font-size:13px; padding:8px 12px;}
.st-cue .lab{font-size:10px; font-weight:700; letter-spacing:.06em; color:var(--bg); background:var(--text); border-radius:3px; padding:2px 6px; white-space:nowrap;}
.st-table{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
.st-thead{display:grid; grid-template-columns:5.2rem 1.9rem minmax(0,1fr); gap:4px; white-space:nowrap; padding:6px 10px; font-size:11px; font-weight:700; color:var(--muted); letter-spacing:0; border-bottom:1px solid var(--border);}
.st-row{position:relative; display:grid; grid-template-columns:5.2rem 1.9rem minmax(0,1fr); gap:2px 4px; padding:5px 10px 5px; align-items:start;}
.st-rhead{display:contents;}
.st-nm{justify-self:start; border:none; font-family:inherit; text-align:left; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent;}
.st-nm.open{box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--c);}
.st-inline-ed{padding:8px 10px 12px; background:var(--surface2); border-top:1px dashed var(--border); border-bottom:1px dashed var(--border);}
.st-inline-ed .st-ed{padding-left:10px;}
.st-close{margin-left:auto;}
.st-tap-hint{font-size:11px; color:var(--muted); margin:6px 2px 0;}
.st-th-len{text-align:center;}
.st-nm{font-size:13px; font-weight:700; color:var(--bg); background:var(--c); padding:2px 7px; border-radius:4px; max-width:100%; overflow-wrap:anywhere; line-height:1.3;}
.st-len{display:flex; flex-direction:column; align-items:center; padding-top:2px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:17px; font-weight:700; line-height:1.05; font-variant-numeric:tabular-nums;}
.st-len small{font-family:inherit; font-size:11px; font-weight:500; color:var(--muted); margin-left:2px;}
.st-len .x{color:var(--muted); font-size:12px; margin-top:2px;}
.st-body{display:flex; flex-direction:column; gap:2px; min-width:0; font-size:14px; line-height:1.4;}
.st-body p{margin:0; white-space:pre-wrap; overflow-wrap:anywhere;}
.st-chord{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:14px; font-weight:700;}
.st-play{color:var(--muted);}
.st-kime{color:var(--kime); font-weight:700;}
.st-empty-memo{color:var(--muted); font-size:13px;}
.st-segs{grid-column:1 / -1; display:flex; gap:3px; margin-top:2px;}

.st-segs i.k{background:var(--kime);}
.st-table.hide-bars .st-len .n, .st-table.hide-bars .st-len small, .st-table.hide-prog .st-segs,
.st-table.hide-chord .st-chord, .st-table.hide-vocal .st-vocal, .st-table.hide-play .st-play, .st-table.hide-kime .st-kime{display:none;}
.st-table.hide-bars .st-len .x{margin-top:0;}
.st-empty{background:var(--surface); border:1px dashed var(--border); border-radius:var(--radius); padding:24px 16px; text-align:center; color:var(--muted); font-size:14px; line-height:1.7;}
.st-empty .btn{margin-top:10px;}
.st-empty-paste{margin-top:18px; padding-top:14px; border-top:1px dashed var(--border); text-align:left;}
.st-empty-or{font-size:12px; color:var(--muted); margin-bottom:6px; text-align:center;}
.st-empty-paste textarea{width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:14px; font-family:inherit; line-height:1.5; resize:vertical;}
.st-empty-paste .btn{margin-top:8px;}
.song-md{margin-bottom:12px;}
.song-md summary{cursor:pointer; font-size:14px; font-weight:700; list-style:none; display:flex; align-items:center; justify-content:space-between; gap:8px;}
.song-md summary::-webkit-details-marker{display:none;}
.song-md summary::after{content:'▸'; color:var(--muted); font-weight:400;}
.song-md[open] summary::after{content:'▾';}
.song-md .field{margin-top:10px;}
.song-md-struct{font-size:13px; color:var(--accent); font-weight:700; margin-top:8px;}

/* 構成の編集 */
.st-ed{border-left:4px solid var(--c); padding-left:10px;}
.st-ed + .st-ed{margin-top:14px;}
.st-ed-top{display:grid; grid-template-columns:minmax(0,1fr) 3.8em 3.8em 4.4em; gap:6px; align-items:end;}
.st-ed-memos{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px 8px; margin-top:6px;}
.st-ed .field{margin:0;}
.st-ed .field label{font-size:11px; font-weight:700;}
.st-ed .field input, .st-ed .field textarea{padding:7px 8px;}
.st-ed-tools{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
.st-mini{height:32px; padding:0 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-family:inherit; font-size:12px; font-weight:600; cursor:pointer;}
.st-mini:disabled{opacity:.4; cursor:default;}
.st-mini.danger{color:var(--danger);}
.st-mini.danger.armed{background:var(--danger); border-color:var(--danger); color:#fff;}
.st-note{font-size:12px; color:var(--muted); line-height:1.6; margin:0 0 8px;}
.st-msg{font-size:13px; color:var(--muted); margin-top:8px;}
#st-md{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; white-space:pre; overflow-x:auto;}
.st-btns{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
@media (max-width:420px){ .st-ed-memos{grid-template-columns:minmax(0,1fr);} }

/* 構成画面のメトロノーム（下に固定） */
.st-mbar{position:fixed; left:0; right:0; bottom:0; z-index:80; background:var(--surface); border-top:1px solid var(--border); padding:8px 12px calc(8px + var(--st-sb));}
.st-mbar, .st-mbar button{touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;}
.st-mbar-in{max-width:520px; margin:0 auto; display:flex; align-items:center; gap:6px;}
/* たたむボタン：バーの右上に出るつまみ */
.st-mbar .st-fold{position:absolute; right:12px; top:-54px; height:44px; min-width:120px; padding:0 12px; gap:4px; border:1px solid var(--border); border-radius:999px; background:var(--surface); color:var(--text); font-size:14px; box-shadow:0 2px 8px rgba(0,0,0,.15);}   /* 開くつまみ（♩ 120 ▲）と同じ大きさ */
.st-mbar .st-fold svg, .st-mbar-tab svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round;}
.st-mbar .st-mbar-tab{display:none;}
/* たたんだ状態：右下の小さなつまみだけ（テンポと再生中の印） */
.st-mbar.folded{left:auto; right:12px; bottom:calc(12px + var(--st-sb)); padding:0; background:none; border:none;}
.st-mbar.folded .st-mbar-in, .st-mbar.folded .st-fold{display:none;}
.st-mbar.folded .st-mbar-tab{display:inline-flex; gap:4px; height:40px; padding:0 12px; border-radius:999px; background:var(--surface); border:1px solid var(--border); box-shadow:0 4px 14px rgba(0,0,0,.18); font-size:15px;}
.st-mbar-tab span{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-variant-numeric:tabular-nums;}
.st-mbar-tab i{width:8px; height:8px; border-radius:50%; background:var(--accent); display:none;}
.st-mbar-tab.run i{display:inline-block;}
body.struct-open main{padding-bottom:150px;}
body.struct-open.st-bar-folded main{padding-bottom:84px;}
/* 左下の「次の曲」：テンポ窓の上（たたんだら画面の下）に大きく */
.st-flash{position:fixed; left:50%; top:42%; transform:translate(-50%,-50%) scale(.96); z-index:120; max-width:84%; padding:14px 22px; border-radius:16px; background:var(--text); color:var(--bg); text-align:center; box-shadow:0 8px 28px rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease;}
.st-flash.show{opacity:1; transform:translate(-50%,-50%) scale(1);}
.st-flash small{display:block; font-size:12px; font-weight:700; opacity:.75; margin-bottom:2px;}
.st-flash b{display:block; font-size:22px; font-weight:800; line-height:1.25; overflow-wrap:anywhere;}
@media (prefers-reduced-motion: reduce){ .st-flash{transition:none;} }
.st-navgrp{position:fixed; left:12px; bottom:calc(66px + var(--st-sb)); z-index:81; display:flex; gap:8px;}
body.st-bar-folded .st-navgrp{bottom:calc(12px + var(--st-sb));}
.st-navgrp[hidden]{display:none;}
/* 前後の曲：小さくシンプルな矢印だけ（曲の切り替えは左右スワイプでもできる） */
.st-navgrp button{width:44px; height:44px; padding:0; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--text); display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,.15); cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent;}
.st-navgrp button svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round;}
.st-navgrp button:disabled{opacity:.35; box-shadow:none; cursor:default;}
/* 縦向き・PC（スマホ横の2列表示以外） */
@media (orientation:portrait), (min-height:601px){
  /* 前後の曲ボタンは横に長く（テンポのつまみの手前まで）。縦向き・PCのとき */
  body.struct-open .st-navgrp{right:144px; max-width:560px;}
  body.struct-open .st-navgrp button{flex:1; width:auto;}
  /* テンポをたたんだとき：前後の曲とテンポを画面の一番下の帯にまとめて固定（下に余白を作らない） */
  body.struct-open.st-bar-folded::after{content:''; position:fixed; left:0; right:0; bottom:0; z-index:79; height:calc(64px + var(--st-sb)); background:var(--bg); border-top:1px solid var(--border);}
  body.struct-open.st-bar-folded .st-navgrp{bottom:calc(10px + var(--st-sb)); right:144px; z-index:81;}
  body.struct-open.st-bar-folded .st-navgrp button{box-shadow:none;}
  body.struct-open.st-bar-folded .st-mbar.folded{bottom:calc(10px + var(--st-sb)); z-index:82;}
  body.struct-open.st-bar-folded .st-mbar.folded .st-mbar-tab{height:44px; min-width:120px; justify-content:center; box-shadow:none;}
  body.struct-open.st-bar-folded main{padding-bottom:calc(76px + var(--st-sb));}
}
.st-ed-foot{display:flex; flex-direction:column; align-items:flex-start; gap:4px; margin-top:8px;}
.st-ed-foot .btn-block{min-height:48px; font-size:16px;}
.st-mbar button{height:40px; min-width:40px; padding:0 8px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-family:inherit; font-size:14px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;}
.st-mbar button svg{width:18px; height:18px; fill:currentColor;}
.st-mbar .st-bpm{border:0; background:transparent; flex-direction:column; line-height:1; min-width:3.4em; padding:0 2px;}
.st-bpm span{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-weight:700; font-size:26px; font-variant-numeric:tabular-nums;}
.st-bpm small{font-size:10px; color:var(--muted); font-weight:700; margin-top:2px; white-space:nowrap;}
.st-bpm.changed span{color:var(--accent);}
.st-dots{display:flex; gap:5px; margin-inline:auto;}
.st-dots i{width:10px; height:10px; border-radius:50%; background:var(--border); transition:transform .06s ease;}
.st-dots i.on{background:var(--accent);}
/* 1拍目は同じ色で大きく光らせて区別する */
.st-dots i.on.acc{background:var(--accent); transform:scale(1.45); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent);}
.st-mbar button[aria-pressed="true"]{background:var(--text); border-color:var(--text); color:var(--bg);}
.st-mbar button[hidden]{display:none;}
.st-mbar .st-go{width:52px; background:var(--accent); border-color:var(--accent); color:var(--accent-text);}
/* ホーム画面のアプリはバーが画面の一番下に付くので、テンポ窓のバー全体を少し高くして、下の角のボタンを押しやすく（縦向き・PC） */
@media (orientation:portrait), (min-height:601px){
  html.is-standalone .st-mbar:not(.folded){padding-bottom:20px;}
  html.is-standalone body.struct-open:not(.st-bar-folded) .st-navgrp{bottom:78px;}
  html.is-standalone body.struct-open:not(.st-bar-folded) main{padding-bottom:162px;}
}
.st-mbar .st-go.run{background:var(--text); border-color:var(--text); color:var(--bg);}

/* ---- スマホ横向きの構成表：左に曲の情報と操作、右に構成表（それぞれスクロール） ---- */
.st-land, .st-side, .st-main{display:contents;}
/* ---- 広い画面（PC・タブレット・スマホ横）のレイアウト ---- */
@media (min-width:640px){

}
@media (min-width:760px){
  #app{max-width:1120px;}

  body[data-view="lives"] .song-toolbar, body[data-view="lives"] .stock-tools, body[data-view="lives"] .lives-opts, body[data-view="lives"] .lives-lock-note{max-width:640px;}
  .metro-inner{border-radius:16px 16px 0 0;}

  .le-grid{display:grid; grid-template-columns:minmax(300px, 380px) minmax(0, 1fr); grid-template-rows:auto 1fr; grid-template-areas:"side main" "acts main"; column-gap:28px; align-items:start;}

/* スマホ横向き：タイトルとタブを1行にして、縦の余白をかせぐ（左右のノッチも避ける） */
@media (orientation:landscape) and (max-height:500px){
  header{display:flex; align-items:center; padding-top:calc(6px + env(safe-area-inset-top,0px)); padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px);}
  header h1{font-size:16px; margin:0 16px; white-space:nowrap;}
  header .tagline{display:none;}   /* 横向きは1行にまとめるのでヒント文は出さない */
  nav{flex:1; padding:0 12px 0 0; max-width:none;}
  nav button{padding:8px 0;}
  main{padding-left:calc(16px + env(safe-area-inset-left,0px)); padding-right:calc(16px + env(safe-area-inset-right,0px));}
}
@media (orientation:landscape) and (max-height:600px){
  body.st-viewing{--side-w:clamp(290px, 38vw, 400px); overflow:hidden;}

  body.st-viewing .st-land{display:grid; grid-template-columns:var(--side-w) minmax(0,1fr); height:100vh; height:100dvh;}
  body.st-viewing .st-side{display:block; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:calc(8px + env(safe-area-inset-top,0px)) 12px 104px calc(12px + env(safe-area-inset-left,0px)); border-right:1px solid var(--border); background:var(--bg);}
  body.st-viewing.st-bar-folded .st-side{padding-bottom:72px;}
  body.st-viewing .st-main{display:block; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:calc(8px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 24px 12px;}
  /* 左の列は詰めて表示 */
  body.st-viewing .st-head{margin-bottom:8px;}
  body.st-viewing .st-head .back-btn{min-height:36px; padding:4px 12px 4px 8px; font-size:13px;}
  body.st-viewing .st-head .pos-seg button{padding:5px 10px;}
  body.st-viewing .st-title{font-size:18px;}
  body.st-viewing .st-nav button{width:36px; height:36px;}
  body.st-viewing .st-meta{gap:4px; margin-top:4px;}
  body.st-viewing .st-chip{font-size:11px; padding:2px 7px; line-height:1.3;}
  body.st-viewing .st-filters{gap:4px; margin:8px 0;}
  body.st-viewing .st-fbtn{height:28px; padding:0 8px; font-size:12px; line-height:1;}
  body.st-viewing .st-info-row{margin-bottom:6px;}
  body.st-viewing .st-se{font-size:12px;}
  /* テンポ窓は左の列の下に2段で収める。前後の曲ボタンは左の列の＜＞を使う */
  body.st-viewing .st-mbar:not(.folded){right:auto; width:var(--side-w); border-right:1px solid var(--border); padding-left:calc(12px + env(safe-area-inset-left,0px));}
  body.st-viewing .st-mbar:not(.folded){padding-top:6px; padding-bottom:calc(6px + var(--st-sb));}
  body.st-viewing .st-mbar:not(.folded) .st-mbar-in{flex-wrap:wrap; justify-content:space-between; row-gap:5px; gap:5px;}
  body.st-viewing .st-mbar:not(.folded) button{height:36px; min-width:36px; padding:0 6px; font-size:13px;}
  body.st-viewing .st-mbar:not(.folded) .st-bpm{min-width:3em;}
  body.st-viewing .st-mbar:not(.folded) .st-bpm span{font-size:22px;}
  body.st-viewing .st-mbar:not(.folded) .st-go{width:44px;}
  body.st-viewing .st-mbar:not(.folded) .st-dots{order:9; width:100%; justify-content:center; margin:0; gap:6px;}
  body.st-viewing .st-mbar:not(.folded) .st-dots i{width:8px; height:8px;}
  /* 前後の曲ボタンは左の列の下（テンポ窓の上）に、押しやすい大きさで。たたむ／開くつまみはその右 */
  body.st-viewing .st-mbar.folded{left:calc(var(--side-w) - 132px); right:auto; bottom:calc(12px + var(--st-sb));}
  body.st-viewing .st-mbar.folded .st-mbar-tab{height:44px; min-width:120px; justify-content:center;}
  body.st-viewing .st-navgrp{left:calc(12px + env(safe-area-inset-left,0px)); right:auto; width:calc(var(--side-w) - 152px - env(safe-area-inset-left,0px)); bottom:calc(var(--st-mbar-h, 96px) + 10px);}
  body.st-viewing .st-navgrp button{flex:1; width:auto; height:44px;}
  body.st-viewing.st-bar-folded .st-navgrp{bottom:calc(12px + var(--st-sb));}
  body.st-viewing .st-side{padding-bottom:calc(var(--st-mbar-h, 96px) + 72px);}

const store = {
  get(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } },
  set(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
};
function applyTheme(val){
  if(val==='light') document.documentElement.setAttribute('data-theme','light');
  else if(val==='dark') document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.removeAttribute('data-theme');
}
applyTheme(store.get('setlist_theme','auto'));

let hadSavedData = false;
try{ hadSavedData = !!localStorage.getItem('setlist_songs') || !!localStorage.getItem('setlist_lives'); }catch(e){}
let songs = store.get('setlist_songs', []);
let lives = store.get('setlist_lives', []);

// migrate old format (songIds array) to setlist array with per-live bpm/key
let migrated = false;
lives.forEach(l=>{
  if(!l.setlist){
    l.setlist = (l.songIds||[]).map(id=>{
      const s = songs.find(x=>x.id===id);
      return {type:'song', songId:id, bpm: s?s.bpm:'', key: s?s.key:''};
    });
    delete l.songIds;
    migrated = true;
  }
  l.setlist.forEach(e => { if(!e.type){ e.type='song'; migrated=true; } });
});

// ---- 安全対策：取り込んだデータに、画面を壊したり勝手に動いたりする値が混ざらないようにする ----
// ID は英数字・-・_ だけ（画面のボタンの中に埋め込むため）。合わないIDは作り直し、イベントからの参照もつなぎ替える
const SAFE_ID = /^[A-Za-z0-9_-]{1,64}$/;
// URL は http(s) だけ（「javascript:」などは捨てる）
function safeUrl(u){ u = String(u || '').trim(); return /^https?:\/\/[^\s"'<>]+$/i.test(u) ? u : ''; }
function sanitizeData(){
  let changed = false;
  if(!Array.isArray(songs)){ songs = []; changed = true; }
  if(!Array.isArray(lives)){ lives = []; changed = true; }
  const remap = new Map(), seen = new Set();
  songs = songs.filter(x => x && typeof x==='object');
  songs.forEach(x => {
    const old = x.id;
    if(!SAFE_ID.test(String(old || '')) || seen.has(old)){ x.id = uid(); if(old!=null) remap.set(String(old), x.id); changed = true; }
    seen.add(x.id);
    if(typeof x.name!=='string'){ x.name = String(x.name ?? ''); changed = true; }
    if(x.url && x.url!==safeUrl(x.url)){ x.url = safeUrl(x.url); changed = true; }
  });
  const lseen = new Set();
  lives = lives.filter(l => l && typeof l==='object');
  lives.forEach(l => {
    if(!SAFE_ID.test(String(l.id || '')) || lseen.has(l.id)){ l.id = uid(); changed = true; }
    lseen.add(l.id);
    if(!Array.isArray(l.setlist)){ l.setlist = []; changed = true; }
    l.setlist = l.setlist.filter(e => e && typeof e==='object');
    l.setlist.forEach(e => {
      if(e.type==='other'){ if(e.id!=null && !SAFE_ID.test(String(e.id))){ e.id = uid(); changed = true; } return; }
      if(remap.has(String(e.songId))){ e.songId = remap.get(String(e.songId)); changed = true; }
      else if(e.songId!=null && !SAFE_ID.test(String(e.songId))){ e.songId = ''; changed = true; }
    });
  });
  return changed;
}
function saveSongs(){ if(sanitizeData()) store.set('setlist_lives', lives); store.set('setlist_songs', songs); }
function saveLives(){ if(sanitizeData()) store.set('setlist_songs', songs); store.set('setlist_lives', lives); }

try{ if(sanitizeData()){ store.set('setlist_songs', songs); store.set('setlist_lives', lives); } }catch(e){ console.error(e); }
if(migrated) saveLives();

let songsMigrated = false;
songs.forEach((s,i) => { if(s.updatedAt===undefined){ s.updatedAt = i; songsMigrated = true; } });
if(songsMigrated) saveSongs();

let livesMigrated = false;
lives.forEach((l,i) => { if(l.updatedAt===undefined){ l.updatedAt = i; livesMigrated = true; } });

const SEEN_VERSION_KEY = 'setlist_seen_version';
let seenVersion = store.get(SEEN_VERSION_KEY, null);
if(!hadSavedData){ seenVersion = APP_VERSION; store.set(SEEN_VERSION_KEY, APP_VERSION); }  // 初めて使う人にはお知らせを出さない
function markVersionSeen(){ seenVersion = APP_VERSION; store.set(SEEN_VERSION_KEY, APP_VERSION); render(); }
// 保存データの形式番号（形式1：v1.0〜。将来、形式を変えるときはここで古いデータを変換する）
if(!store.get('setlist_schema_version', 0)) store.set('setlist_schema_version', SCHEMA_VERSION);

// ---- オフライン対応と新バージョン検知（GitHub Pages 上でのみ動作） ----
const IS_HOSTED = location.protocol==='https:' && /github\.io$/.test(location.hostname);
if(IS_HOSTED && 'serviceWorker' in navigator){
  try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
}
let newVersion = null;
function cmpVersion(a, b){
  const x = String(a).split('.'), y = String(b).split('.');
  for(let i=0;i<3;i++){ const d = (parseInt(x[i],10)||0) - (parseInt(y[i],10)||0); if(d) return d; }
  return 0;
}
let lastUpdateCheck = 0;
function checkForUpdate(){
  if(!IS_HOSTED || !window.fetch) return;
  if(Date.now() - lastUpdateCheck < 60*1000) return;
  lastUpdateCheck = Date.now();
  fetch('index.html?check=' + Date.now(), {cache:'no-store'}).then(r => r.ok ? r.text() : '').then(t => {
    const m = /const APP_VERSION = '([0-9.]+)'/.exec(t||'');
    if(m && cmpVersion(m[1], APP_VERSION) > 0 && newVersion!==m[1]){ newVersion = m[1]; render(); }
  }).catch(()=>{});
}
// 最新版を確実に読み込む（ブラウザのキャッシュを避けるため、一時的に ?u= を付けて開き直す）
function hardReload(){
  const go = () => location.replace(location.pathname + '?u=' + Date.now());
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistration){
      navigator.serviceWorker.getRegistration().then(reg => { if(reg && reg.update) reg.update().then(go, go); else go(); }, go);
      return;
    }
  }catch(e){}
  go();
}
try{ if(/[?&]u=\d+/.test(location.search) && history.replaceState) history.replaceState(null, '', location.pathname + location.hash); }catch(e){}
// 設定の「更新を確認」ボタン用
let updateCheck = {};
window.hardReload = hardReload;
window.manualUpdateCheck = () => {
  if(!IS_HOSTED || !window.fetch){ updateCheck = {state:'unsupported'}; render(); return; }
  updateCheck = {state:'checking'}; render();
  fetch('index.html?check=' + Date.now(), {cache:'no-store'}).then(r => r.ok ? r.text() : '').then(t => {
    const m = /const APP_VERSION = '([0-9.]+)'/.exec(t||'');
    if(!m) updateCheck = {state:'error'};
    else if(cmpVersion(m[1], APP_VERSION) > 0){ updateCheck = {state:'new', version:m[1]}; newVersion = m[1]; }
    else updateCheck = {state:'latest'};
    render();
  }).catch(() => { updateCheck = {state:'error'}; render(); });
};
function updateBoxHtml(){
  const uc = updateCheck || {};
  return `<div class="panel update-box">
    <div class="update-title">アプリの更新</div>
    <div class="hint" style="margin:6px 0 12px; line-height:1.7;">ホーム画面のアプリは、閉じても裏で止まっているだけで、自動では新しくなりません。開いたときに最新版を確認しますが、すぐ知りたいときはここで確認できます。</div>
    ${uc.state==='new'
      ? `<div class="update-msg new">新しいバージョン v${esc(uc.version)} があります（今は v${esc(APP_VERSION)}）</div><button type="button" class="btn btn-accent btn-block" onclick="hardReload()">今すぐ更新する</button>`
      : `<button type="button" class="btn btn-block update-btn" onclick="manualUpdateCheck()" ${uc.state==='checking' ? 'disabled' : ''}>${uc.state==='checking' ? '確認中…' : '更新を確認'}</button>
        ${uc.state==='latest' ? `<div class="update-msg ok">✓ 最新版です（v${esc(APP_VERSION)}）</div>` : ''}
        ${uc.state==='error' ? `<div class="update-msg ng">確認できませんでした。ネットにつながっているか確かめて、もう一度お試しください。</div>` : ''}
        ${uc.state==='unsupported' ? `<div class="update-msg">この画面（プレビューなど）では確認できません。公開版のアプリで確認してください。</div>` : ''}`}
  </div>`;
}
// アプリが裏に回ったら（画面オフ・別のアプリへ切り替え）メトロノームを止める。戻ったときにひと言知らせる
let metroStoppedInBg = false;
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState==='hidden'){
    let stopped = false;
    try{ if(typeof stM!=='undefined' && stM.on){ stMetroStop(); stopped = true; } }catch(e){}
    try{ if(typeof metro!=='undefined' && metro.playing){ stopPlayback(); const b = document.getElementById('metro-play'); if(b) b.textContent = '▶ 再生'; stopped = true; } }catch(e){}
    if(stopped) metroStoppedInBg = true;
    return;
  }
  checkForUpdate();
  if(metroStoppedInBg){ metroStoppedInBg = false; try{ render(); }catch(e){} showToast('画面を離れたので、メトロノームを止めました'); }
});
setTimeout(checkForUpdate, 3000);
function newVersionBarHtml(){
  if(!newVersion) return '';
  return `<div class="newver-bar"><span>新しいバージョン v${esc(newVersion)} があります</span><button type="button" class="btn" onclick="hardReload()">再読み込み</button></div>`;
}
function updateNoticeHtml(){
  if(seenVersion===APP_VERSION) return '';
  const notes = RELEASE_NOTES[APP_VERSION];
  if(!notes || !notes.length) return '';
  return `<div class="update-notice">
    <button type="button" class="update-close" onclick="markVersionSeen()" aria-label="閉じる">×</button>

  const m = String(str).match(/^(\d+):([0-5]?\d)$/);
  if(m) return (+m[1])*60 + (+m[2]);
  const n = parseFloat(str);
  return isNaN(n) ? 0 : Math.round(n*60);
}

// 日付の状態：今日／これから（明日・あと○日）／過去（終了）。バンドマン持ち物リストと同じ見せ方
function liveDateStatus(date){
  if(!date) return {kind:'none'};
  const t = todayYmd();
  if(date===t) return {kind:'today', label:'今日'};
  const diff = Math.round((new Date(date+'T00:00:00') - new Date(t+'T00:00:00')) / 86400000);
  if(isNaN(diff)) return {kind:'none'};
  if(diff > 0) return {kind:'future', label: diff===1 ? '明日' : `あと${diff}日`};

  if(!start || !end) return null;
  const [sh,sm] = start.split(':').map(Number);
  const [eh,em] = end.split(':').map(Number);

// キーの表示名。保存は C# などの♯表記のまま、表示だけ曲ごとの表記（自動／♯／♭）にする
const KD_FLAT = ['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const KD_SHARP = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
function keyDisp(k, s){
  const m = /^([A-G])([#♯b♭]?)(m?)$/.exec(String(k || '').trim()); if(!m) return k || '';
  const pc = ({C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]] + (/[#♯]/.test(m[2]) ? 1 : /[b♭]/.test(m[2]) ? -1 : 0) + 12) % 12;
  const minor = !!m[3], acc = s && s.acc;
  let flat;
  if(acc==='b') flat = true; else if(acc==='#') flat = false;
  else flat = minor ? [2,7,0,5,10,3].includes(pc) : [5,10,3,8,1].includes(pc);
  return (flat ? KD_FLAT : KD_SHARP)[pc] + (minor ? 'm' : '');
}

  const a = [...arr];
  if(mode==='order') return a;
  if(mode==='title_asc') return a.sort((x,y)=>x.name.localeCompare(y.name,'ja'));
  if(mode==='title_desc') return a.sort((x,y)=>y.name.localeCompare(x.name,'ja'));

  if(mode==='duration_desc') return a.sort((x,y)=>parseDur(y.duration)-parseDur(x.duration));
  if(mode==='updated_asc') return a.sort((x,y)=>(x.updatedAt||0)-(y.updatedAt||0));
  return a.sort((x,y)=>(y.updatedAt||0)-(x.updatedAt||0)); // updated_desc (default)

function sortLives(arr, mode){
  const a = [...arr];
  // 日付順（バンドマン持ち物リストと同じ）：今日 → これから（近い順）→ 日付未設定 → 過去（新しい順）
  if(mode==='status'){
    const rank = {today:0, future:1, none:2, past:3};
    return a.sort((x, y) => {
      const sx = liveDateStatus(x.date).kind, sy = liveDateStatus(y.date).kind;
      if(rank[sx]!==rank[sy]) return rank[sx]-rank[sy];
      if(sx==='none') return (y.updatedAt||0)-(x.updatedAt||0);
      const kx = (x.date||'')+' '+(x.startTime||'99:99'), ky = (y.date||'')+' '+(y.startTime||'99:99');
      if(kx===ky) return (y.updatedAt||0)-(x.updatedAt||0);
      const asc = kx < ky ? -1 : 1;
      return sx==='past' ? -asc : asc;
    });
  }
  if(mode==='title_asc') return a.sort((x,y)=>(x.venue||'').localeCompare(y.venue||'','ja'));
  if(mode==='title_desc') return a.sort((x,y)=>(y.venue||'').localeCompare(x.venue||'','ja'));
  if(mode==='updated_asc') return a.sort((x,y)=>(x.updatedAt||0)-(y.updatedAt||0));
  if(mode==='updated_desc') return a.sort((x,y)=>(y.updatedAt||0)-(x.updatedAt||0));
  if(mode==='date_asc') return a.sort((x,y)=>(x.date||'').localeCompare(y.date||''));
  return a.sort((x,y)=>(y.date||'').localeCompare(x.date||'')); // date_desc (default)
}

// tap tempo
let tapTimes = [], tapTarget = null;
window.onTap = (inputId) => {
  const now = Date.now();
  if(tapTarget !== inputId || (tapTimes.length && now - tapTimes[tapTimes.length-1] > 2000)){ tapTimes=[]; tapTarget=inputId; }
  tapTimes.push(now);
  if(tapTimes.length>8) tapTimes.shift();
  if(tapTimes.length>=2){
    const intervals=[]; for(let i=1;i<tapTimes.length;i++) intervals.push(tapTimes[i]-tapTimes[i-1]);
    const avg = intervals.reduce((a,b)=>a+b,0)/intervals.length;
    const bpm = Math.round(60000/avg);
    const el = document.getElementById(inputId);
    if(el){ el.value = bpm; el.dispatchEvent(new Event('change')); }
  }
};

// ---- ハンドルでのドラッグ並べ替え（タッチ・マウス共通のポインター操作）----
let drag = null;
window.startDrag = (e, list) => {
  if(drag) return;
  const row = e.target.closest('.setlist-item');
  if(!row) return;
  e.preventDefault();
  const handle = e.currentTarget || e.target;
  try{ handle.setPointerCapture(e.pointerId); }catch(_){}
  drag = {list, row, handle, pointerId:e.pointerId, startPageY:e.clientY + window.scrollY, lastClientY:e.clientY, raf:0};
  row.classList.add('dragging');
  document.body.classList.add('is-dragging');
  document.addEventListener('pointermove', onDragMove, {passive:false});
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
  drag.raf = requestAnimationFrame(dragAutoScroll);
};
function dragRows(){ return [...document.querySelectorAll(`.setlist-item[data-drag-list="${drag.list}"]`)]; }
function onDragMove(e){
  if(!drag || e.pointerId!==drag.pointerId) return;
  if(e.cancelable) e.preventDefault();
  drag.lastClientY = e.clientY;
  updateDragPosition();
}
function updateDragPosition(){
  const row = drag.row;
  const dy = drag.lastClientY + window.scrollY - drag.startPageY;
  row.style.transform = `translateY(${dy}px)`;
  const rect = row.getBoundingClientRect();
  const center = rect.top + rect.height/2;
  const rows = dragRows();
  const idx = rows.indexOf(row);
  const prev = rows[idx-1], next = rows[idx+1];
  let moved = false;
  const before = row.offsetTop;
  if(prev){ const r = prev.getBoundingClientRect(); if(center < r.top + r.height/2){ row.parentNode.insertBefore(prev, row.nextSibling); moved = true; } }
  if(!moved && next){ const r = next.getBoundingClientRect(); if(center > r.top + r.height/2){ row.parentNode.insertBefore(next, row); moved = true; } }
  if(moved){
    // 並びが変わった分だけ起点をずらし、指の下にカードが残るようにする
    drag.startPageY += row.offsetTop - before;
    row.style.transform = `translateY(${drag.lastClientY + window.scrollY - drag.startPageY}px)`;
  }
}
// 画面の上下の端に近づいたら自動でスクロール
function dragAutoScroll(){
  if(!drag) return;
  const edge = 70, y = drag.lastClientY, h = window.innerHeight;
  let v = 0;
  if(y < edge) v = -Math.ceil((edge - y)/6);
  else if(y > h - edge) v = Math.ceil((y - (h - edge))/6);
  if(v){ window.scrollBy(0, v); updateDragPosition(); }
  drag.raf = requestAnimationFrame(dragAutoScroll);
}
function endDrag(e){
  if(!drag || (e && e.pointerId!==drag.pointerId)) return;
  const {list, row, handle} = drag;
  cancelAnimationFrame(drag.raf);
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', endDrag);
  document.removeEventListener('pointercancel', endDrag);
  row.style.transform = '';
  row.classList.remove('dragging');
  document.body.classList.remove('is-dragging');
  const keys = dragRows().map(r => r.dataset.key);
  drag = null;
  applyDragOrder(list, keys);
}
// 画面に見えている並びを保存する。見えていない項目（隠した曲以外）は元の位置のまま
function applyDragOrder(list, keys){
  if(list==='stock' && stockLocked) return;
  if(list==='stock'){
    // 見えている曲だけを、元いた位置（スロット）に並べ直して入れる。非表示の曲は動かさない
    const byId = new Map(songs.map((s,i) => [s.id, i]));
    const idxs = keys.map(k => byId.get(k)).filter(i => i!==undefined);
    const slots = [...idxs].sort((a,b)=>a-b);
    const next = songs.slice();
    slots.forEach((slot, k) => { next[slot] = songs[idxs[k]]; });
    if(next.some((s,k)=>s!==songs[k])){ songs = next; saveSongs(); }
  } else {
    const live = lives.find(l=>l.id===liveEditId);
    if(!live || live.locked){ render(); return; }
    const idxs = keys.map(Number);
    const slots = [...idxs].sort((a,b)=>a-b);
    const moved = idxs.map(k => live.setlist[k]);
    const next = live.setlist.slice();
    slots.forEach((slot, k) => { next[slot] = moved[k]; });
    if(next.some((e,k)=>e!==live.setlist[k])){
      live.setlist = next;
      live.updatedAt = Date.now();
      entryExpandedIdx = null;
      saveLives();
    }
  }
  render();
}

// ---- 拍子：曲ごとに「自動（リズムパターンから判断）・4/4・3/4・6/8」 ----
const METERS = ['4/4','3/4','6/8'];
function meterFromRhythm(r){
  const t = String(r || '');
  if(/6\s*\/\s*8/.test(t)) return '6/8';
  if(/3\s*拍子|ワルツ|waltz|3\s*\/\s*4/i.test(t)) return '3/4';
  return '4/4';
}
function songMeter(s){ return s && METERS.includes(s.meter) ? s.meter : meterFromRhythm(s && s.rhythm); }
// 6/8 は BPM を付点4分音符（大きな2拍）で数える。細かい8分音符を鳴らすかは設定で切り替え
let metroSub68 = !!store.get('setlist_metro_sub68', false);
function meterPlan(m){
  if(m==='3/4') return {beats:3, subs:1};
  if(m==='6/8') return {beats:2, subs: metroSub68 ? 3 : 1};
  return {beats:4, subs:1};
}
// level 2：1拍目　1：拍の頭　0：細かい8分音符（小さく）
function scheduleLevelClick(time, level){
  const ctx = getCtx();
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.frequency.value = level===2 ? 1600 : level===1 ? 1000 : 1300;
  gain.gain.setValueAtTime(0.0001, time);
  gain.gain.exponentialRampToValueAtTime(level===2 ? 0.6 : level===1 ? 0.4 : 0.12, time+0.002);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + (level===0 ? 0.03 : 0.05));
  osc.connect(gain).connect(ctx.destination);
  osc.start(time); osc.stop(time+0.06);
}
function meterOptionsHtml(cur, rhythm){
  const auto = meterFromRhythm(rhythm);
  return `<option value="" ${!METERS.includes(cur)?'selected':''}>自動（リズムパターンから：${auto}）</option>` +
    METERS.map(m => `<option value="${m}" ${cur===m?'selected':''}>${m}${m==='6/8'?'（付点4分で2拍）':''}</option>`).join('');
}
function scheduleClick(time, accent){
  const ctx = getCtx();
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.frequency.value = accent ? 1600 : 1000;
  gain.gain.setValueAtTime(0.0001, time);
  gain.gain.exponentialRampToValueAtTime(accent ? 0.6 : 0.4, time+0.002);
  gain.gain.exponentialRampToValueAtTime(0.0001, time+0.05);
  osc.connect(gain).connect(ctx.destination);
  osc.start(time); osc.stop(time+0.06);
}
function metroPanelSong(){
  const p = metroPanel; if(!p) return null;

}
function metroPanelPlan(){ return meterPlan(songMeter(metroPanelSong())); }
function syncPanelDots(){
  const bd = document.querySelector('#metro-sheet .metro-beats'); if(!bd) return;
  const n = metroPanelPlan().beats;
  if(bd.children.length !== n) bd.innerHTML = '<span></span>'.repeat(n);
}
function flashBeat(n, delaySec){
  setTimeout(() => {
    const dots = document.querySelectorAll('#metro-sheet .metro-beats span');
    dots.forEach((d,k) => d.classList.toggle('on', k===n));
  }, Math.max(0, delaySec*1000));
}
function metroTick(){
  if(!metro.playing || !metroPanel) return;
  const ctx = getCtx();
  const pl = metroPanelPlan();
  { // 処理が遅れて拍に間に合わなかった分は鳴らさず、次の拍から鳴らし直す（まとめて鳴るのを防ぐ）
    const step = 60 / metroPanel.bpm / pl.subs, late = ctx.currentTime - metro.nextTime;
    if(late > 0.05){ const n = Math.ceil(late / step); metro.nextTime += n * step; metro.beat += n; }
  }
  while(metro.nextTime < ctx.currentTime + 0.12){
    // metro.beat は細かい刻みも含めた通し番号
    const onBeat = metro.beat % pl.subs === 0, bi = Math.floor(metro.beat / pl.subs) % pl.beats;
    scheduleLevelClick(metro.nextTime, onBeat ? (bi===0 ? 2 : 1) : 0);
    if(onBeat) flashBeat(bi, metro.nextTime - ctx.currentTime);
    metro.nextTime += 60 / metroPanel.bpm / pl.subs;
    metro.beat++;
  }
}
function startPlayback(){
  const ctx = getCtx();

}

function clampBpm(v){ v = Math.round(Number(v)||120); return Math.min(300, Math.max(30, v)); }
// 曲マスタの曲（songId）またはイベントの曲（liveId + entry）のメトロノームを開く
window.openMetro = (source, key) => {

  } else {
    const live = lives.find(l=>l.id===liveEditId); if(!live) return;

  }

// パネルは開いた時だけ組み立てる。以後は変わった部分だけ書き換える（ボタンを作り直さないので連打できる）

    const iv = []; for(let k=1;k<metroTaps.length;k++) iv.push(metroTaps[k]-metroTaps[k-1]);

function stSampleFor(name){
  const hit = ST_SAMPLES.find(x => x.re.test(name || ''));
  return hit ? {sections: hit.sections.map(s => ({...s}))} : null;
}
// 構成の入っていない曲に、曲名が合うサンプルの構成を一度だけ入れる
function seedStructSamples(list){
  let n = 0;
  list.forEach(s => { if(!s.struct || !(s.struct.sections||[]).length){ const t = stSampleFor(s.name); if(t){ s.struct = t; n++; } } });
  return n;
}
