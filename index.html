function stColor(name){
  // 「Chorus / Outro」「サビ3〜Ending」のように並んでいるときは、先に書いた方で決める
  const first = String(name || '').split(/\s*(?:\/|／|→|〜|~|、|,|＆|&|\+|＋)\s*/).find(t => t.trim()) || '';
  const n = first.toLowerCase().trim();
  if(/ドロップ|drop/.test(n)) return 'var(--c-drop)';   // 「Drop」「ドロップ」「[drop]」「［drop］」
  if(/大サビ|last/.test(n)) return 'var(--c-big)';
  if(/イントロ|intro|アウトロ|outro|エンディング|ending|coda|コーダ/.test(n)) return 'var(--c-intro)';
  if(/プレ|pre|bメロ/.test(n)) return 'var(--c-b)';
  if(/^b(\s*(section|セクション|パート|part))?\s*['’′]?\s*\d*$/.test(n)) return 'var(--c-b)';   // 「B」「B Section」はBメロと同じ緑
  if(/サビ|chorus|コーラス/.test(n)) return 'var(--c-sabi)';
  if(/ブリッジ|bridge|cメロ|間奏|interlude/.test(n)) return 'var(--c-bridge)';
  if(/ソロ|solo/.test(n)) return 'var(--c-solo)';
  return 'var(--c-a)';
}
const stInt = v => parseInt(v, 10) || 0;
const stTimes = s => Math.max(1, stInt(s.times));
function hasStruct(s){ return !!(s && s.struct && (s.struct.sections||[]).length); }
function stFromStock(){ return !!(structOpen && structOpen.songId); }
function stLive(){ return structOpen && structOpen.liveId ? lives.find(l => l.id===structOpen.liveId) : null; }
function stEntry(){ const l = stLive(); return l ? l.setlist[structOpen.idx] : null; }
function stSong(){
  if(stFromStock()) return songs.find(x => x.id===structOpen.songId) || null;
  const e = stEntry(); return e && e.type!=='other' ? songs.find(x => x.id===e.songId) || null : null;
}
// ＜＞で回る順番。イベントはセットリスト順（曲だけ）、曲マスタは画面の並び順（絞り込み・非表示を反映）
function stSeq(){
  if(stFromStock()){ const ids = stockOrderIds(); return ids.includes(structOpen.songId) ? ids : [structOpen.songId]; }
  const l = stLive(); return l ? l.setlist.map((e,i) => e.type==='other' ? null : i).filter(i => i!==null) : [];
}
function stCur(){ return stFromStock() ? structOpen.songId : structOpen.idx; }
function stView(s){ return {...ST_VIEW_ALL, ...structBaseView, ...((s.struct && s.struct.view) || {})}; }
function stEnsure(s){ if(!s.struct) s.struct = {sections:[]}; if(!s.struct.sections) s.struct.sections = []; return s.struct; }
function stTouch(s){ s.updatedAt = Date.now(); saveSongs(); }

window.closeStruct = () => {
  const fromStock = stFromStock();
  const fromList = !!(structOpen && structOpen.fromList), listId = fromList ? structOpen.liveId : null;
  const idx = structOpen ? stCur() : null;
  stMetroStop(); structOpen = null; structEdit = false; stOpenSec = null; stTrans = 0;

    const card = document.querySelector(`.live-card-wrap[data-live-id="${listId}"]`);

  if(row && row.scrollIntoView){ try{ row.scrollIntoView({block:'center'}); }catch(e){ row.scrollIntoView(); } }
};
// 曲送りは一周する：最後の曲の次は先頭の曲、先頭の曲の前は最後の曲
window.structNav = d => {
  const seq = stSeq(); const pos = seq.indexOf(stCur());
  if(seq.length < 2 || pos < 0) return false;
  const np = (pos + d + seq.length) % seq.length;
  const wrapped = (pos + d) !== np;
  const k = seq[np];
  if(stFromStock()) structOpen.songId = k; else structOpen.idx = k;
  stOpenSec = null; stTrans = 0;
  // 編集中なら編集のまま次の曲へ（構成表を見ていたら構成表のまま）
  stSetBpm(stSongBpm());   // 曲が変わったらその曲のテンポに（鳴っていればそのまま新しいテンポで）
  render(); scrollToTop();
  if(wrapped){ const s = stSong(); stFlash(s ? s.name : '', d > 0 ? `先頭の曲に戻りました　1/${seq.length}` : `最後の曲へ　${seq.length}/${seq.length}`); }
  return {wrapped, pos: np, len: seq.length};
};

// ---- コードの移調・ディグリー表記（表示だけ。保存されたコードは書き換えない） ----
const NOTE_PC = {C:0, D:2, E:4, F:5, G:7, A:9, B:11};
const SHARP_N = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT_N  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const ROMAN   = ['I','♭II','II','♭III','III','IV','♭V','V','♭VI','VI','♭VII','VII'];
function accOf(a){ return /[#♯]/.test(a) ? 1 : /[b♭]/.test(a) ? -1 : 0; }
function parseKey(k){
  const m = /^([A-G])([#♯b♭]?)(m?)$/.exec(String(k || '').trim()); if(!m) return null;
  return {pc: (NOTE_PC[m[1]] + accOf(m[2]) + 12) % 12, minor: !!m[3]};
}
function keyName(pc, minor){ return SHARP_N[((pc % 12) + 12) % 12] + (minor ? 'm' : ''); }
function keyPrefersFlat(k){ if(!k) return null; return k.minor ? [2,7,0,5,10,3].includes(k.pc) : [5,10,3,8,1].includes(k.pc); }
function normShift(n){ n = ((n % 12) + 12) % 12; return n > 6 ? n - 12 : n; }
// コードらしい書き方だけを対象にする（C9, Fsus4, G/A, B♭, F♯5, Am7(♭5) など）。「Aメロ」「N.C.」「Dr.」などは触らない
const CHORD_RE = /(^|[^A-Za-z0-9#♯♭.])([A-G])([#♯b♭]?)((?:maj|min|dim|aug|sus|add|omit|alt|M|m|ø|°|\+|[0-9]|[#♯b♭](?=[0-9])|\((?=[^)]*\))|\))*)(?:\/([A-G])([#♯b♭]?))?(?![A-Za-z0-9])/g;
function stChordDisp(text){
  const c = stCC; if(!c || !text) return text || '';
  if(c.mode!=='degree' && !c.shift && !c.respell) return text;  // 曲の表記（♯／♭）を指定していれば、移調なしでも書き直して表示
  const uni = /[♭♯]/.test(text);
  const spell = (pc, origAcc) => {
    const flat = c.flat!==null ? c.flat : (origAcc < 0);
    let n = (flat ? FLAT_N : SHARP_N)[((pc % 12) + 12) % 12];
    if(uni) n = n.replace('b', '♭').replace('#', '♯');
    return n;
  };
  return text.replace(CHORD_RE, (all, pre, root, acc, qual, broot, bacc, off, str) => {
    const after = str.charAt(off + all.length);
    if(!qual && !broot && /[぀-ヿ一-鿿]/.test(after)) return all;  // 「Aメロ」など
    const pc = (NOTE_PC[root] + accOf(acc) + 12) % 12;
    const bpc = broot ? (NOTE_PC[broot] + accOf(bacc) + 12) % 12 : null;
    if(c.mode==='degree'){
      const d = p => ROMAN[((p - c.tonic) % 12 + 12) % 12];
      return pre + d(pc) + qual + (broot ? '/' + d(bpc) : '');
    }
    return pre + spell(pc + c.shift, accOf(acc)) + qual + (broot ? '/' + spell(bpc + c.shift, accOf(bacc)) : '');
  });
}
// 今の曲・イベントから、コード表示の設定を決める
function stChordCtx(s, e){
  const mk = parseKey(songVal(s, 'key'));
  const ek = parseKey(e ? effVal(e, s, 'key') : songVal(s, 'key'));
  let shift = stTrans, target = mk;
  if(e && mk && ek){ shift = normShift(ek.pc - mk.pc + stTrans); target = ek; }
  if(mk && stTrans && !(e && ek)) target = {pc: (mk.pc + stTrans + 12) % 12, minor: mk.minor};
  if(e && mk && ek && stTrans) target = {pc: (ek.pc + stTrans + 12) % 12, minor: ek.minor};
  const canDegree = !!mk;
  const mode = stChordMode==='degree' && canDegree ? 'degree' : 'chord';
  const tonic = mk ? (mk.minor && stDegreeMinor==='relative' ? (mk.pc + 3) % 12 : mk.pc) : 0;

  const capo = songCapo(s), capoOn = !!capo && stCapoView && mode==='chord';

  if(capoOn) shift = shift - capo;
  const flat = s.acc==='b' ? true : s.acc==='#' ? false : keyPrefersFlat(capoOn ? shapeKey : target);
  return {mode, shift: normShift(shift), keyShift, flat, respell: !!s.acc, mk, ek, target, tonic, canDegree, capo, capoOn, shapeKey};
}

// 保存されたコードを書き換える（曲マスタでキーを確定するとき）
function stTransposeText(text, shift, targetKey, acc){

window.stTranspose = d => {
  if(stLockedNow()){ stLockToast(); return; }

  const mk = parseKey(songVal(s, 'key'));
  if(e && mk){
    const live = stLive();
    if(d===0){ delete e.key; }
    else {
      const ek = parseKey(effVal(e, s, 'key')) || mk;
      const nk = keyName(ek.pc + d, ek.minor);
      if(nk===songVal(s, 'key')) delete e.key; else e.key = nk;
    }

// 構成表の取り込み（見出し行があれば列を自動で振り分け）
const ST_COLS = [['kimeBar',/キメ小節/],['kime',/キメ|ブレイク|kime/i],['times',/回数|times/i],['chord',/コード|chord/i],['vocal',/歌|vocal|lyric/i],['bars',/小節|バー|bars?|長さ/i],['name',/区間|セクション|section|パート|構成/i],['play',/演奏|play|note/i],['auto',/内容|メモ|備考|content/i]];
function stSplitRow(line){
  if(line.includes('|')) return line.split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, '|')).filter((c, i, a) => !(c==='' && (i===0 || i===a.length-1)));
  if(line.includes('\t')) return line.split('\t').map(c => c.trim());
  return (line.match(/^(.+?)\s+(\d+)\s*(?:小節|bars?)?\s*(.*)$/i) || []).slice(1);
}
const stCell = c => { const t = (c || '').replace(/<br\s*\/?>/gi, '\n').replace(/\*\*/g, '').trim(); return /^[—–\-ー−]+$/.test(t) ? '' : t; };
// 表の見出し行かどうか：列名に当てはまるセルが2つ以上で数字を含まない、または3つ以上（「コード（Capo3）」のように見出しに数字が入っていてもよい）
function stHeaderMap(cells){
  const m = cells.map(c => (ST_COLS.find(([, re]) => re.test(c)) || [null])[0]);
  const n = m.filter(Boolean).length;
  const noDigit = !cells.some(c => /\d/.test(c));
  return (n >= 3 || (n >= 2 && noDigit)) ? m : null;
}
function stParseTable(text){
  const out = []; let map = null;
  for(const raw of String(text).split(/\r?\n/)){
    const line = raw.trim();
    if(!line || /^[|\s:\-–—]+$/.test(line)) continue;
    if(!line.includes('|') && !line.includes('\t') && (/^#{1,3}\s/.test(line) || /^[-*・]\s*[^:：]+[:：]/.test(line))) continue;  // 曲名・曲情報の行は読み飛ばす
    const cells = stSplitRow(line).map(stCell);
    if(cells.length < 2) continue;
    { const hm = stHeaderMap(cells); if(hm){
      if(!hm.includes('name')) hm[0] = 'name'; map = hm;
      // 「コード（Capo3・G表記）」のように、コードの見出しにカポがあれば覚えておく（取り込み時に実音へ直す）
      const ci = hm.indexOf('chord'), cm = ci >= 0 && String(cells[ci]).match(/(?:capo|カポ)\s*[:：]?\s*(\d{1,2})/i);
      if(cm && +cm[1] > 0 && +cm[1] < 12){
        out.capo = +cm[1];
        const km = String(cells[ci]).match(/([A-G][#♯b♭]?m?)\s*(?:表記|shape|フォーム)/i);
        if(km) out.capoShape = km[1].replace('♯','#').replace('♭','b');
      }
      continue; } }
    let name, barsCell, timesCell = '', kbCell = '';
    const f = {chord:'', vocal:'', play:'', kime:'', auto:''};
    if(map){
      const g = k => { const i = map.indexOf(k); return i>=0 ? cells[i] || '' : ''; };
      name = g('name'); barsCell = g('bars'); timesCell = g('times'); kbCell = g('kimeBar');
      for(const k in f) f[k] = map.map((m, i) => m===k ? cells[i] : '').filter(Boolean).join('\n');
    } else {
      const ni = cells.findIndex((c, i) => i>0 && /\d/.test(c));
      if(ni < 0) continue;
      name = cells[0]; barsCell = cells[ni];
      f.auto = cells.filter((_, i) => i!==0 && i!==ni).filter(Boolean).join(' / ');
    }
    if(!name) continue;
    const isRep = /[（(]\s*(繰り返し|repeat)\s*[）)]/i.test(name);
    const base = name.replace(/\s*[（(]\s*(繰り返し|repeat)\s*[）)]\s*/i, '').trim();
    const prev = out[out.length-1];
    if(isRep && prev && prev.name===base){ prev.times = stTimes(prev) + 1; continue; }
    const dm = (barsCell||'').match(/\d+/), tm = (timesCell||'').match(/\d+/), km = (kbCell||'').match(/\d+/);
    const sec = ST_SEC(base || name, dm ? +dm[0] : '', {times: tm ? +tm[0] : 1, kimeBar: km ? +km[0] : ''});
    sec.chord = f.chord; sec.vocal = f.vocal; sec.play = f.play; sec.kime = f.kime;
    if(f.auto){ if(/^[「『"“]/.test(f.auto)) sec.vocal = [sec.vocal, f.auto].filter(Boolean).join('\n'); else sec.play = [sec.play, f.auto].filter(Boolean).join('\n'); }
    // 「同上」は、同じ種類のセクション（Verse 1 → Verse 2 など）の直前の内容を写す。なければ1つ前の行
    const kind = n => String(n||'').toLowerCase().replace(/[\s#＃]*\d+$/, '').replace(/\s+/g, ' ').trim();
    const same = /^(同上|〃|同じ|same(\s+as\s+above)?|ditto)$/i;
    ['chord','vocal','play','kime'].forEach(k => {
      if(!same.test(String(sec[k]).trim())) return;
      const src = [...out].reverse().find(x => kind(x.name)===kind(sec.name)) || out[out.length-1];
      sec[k] = src ? src[k] : '';

    if(barsCell && !/^\d+\s*(小節)?$/.test(barsCell)) sec.play = [sec.play, `小節数：${barsCell}`].filter(Boolean).join('\n');

  }

}
// ---- Markdownの「曲情報」表（項目｜内容）と「構成表」を分けて読む ----
// 見出し（### 曲情報 / ### 構成表）や、表の見出し「項目｜内容」で、曲情報の部分を見分ける
function stSplitMd(text){
  const info = [], struct = []; let mode = 'struct', title = '';
  for(const raw of String(text).split(/\r?\n/)){
    const line = raw.trim();
    if(/^>/.test(line) || /^<!--.*-->$/.test(line)) continue;   // テンプレの書き方メモ（引用・コメント）は読まない
    const h = line.match(/^(#{1,6})\s*(.+)$/);
    if(h){
      const t = h[2].replace(/\*\*/g, '').trim();
      if(/曲情報|曲の情報|song\s*info|基本情報|情報/i.test(t)) mode = 'info';
      else if(/構成|structure|form/i.test(t)) mode = 'struct';
      else if(h[1].length===1 && !title) title = t;   // 「# 曲名」
      continue;
    }
    if(line.includes('|')){
      const c = stSplitRow(line).map(stCell);
      if(c.length===2 && /^(項目|item|field)$/i.test(c[0]) && /^(内容|value|値)$/i.test(c[1])){ mode = 'info'; continue; }
      // 見出しなしで構成表の表が始まったら（「区間｜小節数…」のような見出し行）、構成表として読む
      // ただし「| メモ | 歌とコードの確認 |」のような曲情報の行（2列で、1列目が曲情報の項目名）は曲情報のまま
      const infoRow = c.length===2 && ST_INFO_KEYS.some(([, re]) => re.test(c[0]));
      if(mode==='info' && !infoRow && stHeaderMap(c)) mode = 'struct';
    }
    if(/^[-*・]\s*[^:：|]+[:：]/.test(line)){ info.push(line); continue; }   // 「- キー: A」
    (mode==='info' ? info : struct).push(line);
  }
  return {info, struct, title};
}
const ST_INFO_KEYS = [['capo',/^(カポ|capo)$/i],['meter',/^(拍子|time\s*signature|meter)$/i],['name',/^(曲名|タイトル|title|song)$/i],['orig',/アーティスト|原曲|artist/i],['key',/^(キー|調|key)$/i],['bpm',/bpm|テンポ|tempo/i],
  ['duration',/曲時間|演奏時間|長さ|duration|length/i],['genre',/ジャンル|genre/i],['rhythm',/リズム|rhythm/i],['start',/はじめかた|始め方/],['end',/おわりかた|終わり方/],
  ['url',/url|リファレンス/i],['notes',/^(メモ|備考|全体のメモ|notes?)$/i]];
const ST_FLAT2SHARP = {Db:'C#', Eb:'D#', Gb:'F#', Ab:'G#', Bb:'A#', Cb:'B', Fb:'E', 'E#':'F', 'B#':'C'};
function stNormKey(v){
  const m = String(v).match(/([A-G])\s*([#♯b♭]?)/); if(!m) return '';
  let root = m[1] + (m[2]==='♯' ? '#' : m[2]==='♭' ? 'b' : m[2]);
  root = ST_FLAT2SHARP[root] || root;
  const rest = String(v).slice(m.index + m[0].length).trim();
  const minor = /^m(?!aj)/.test(rest) || /minor|マイナー|短調/i.test(v);
  return root + (minor ? 'm' : '');
}
function stNormGenre(v){
  const t = String(v).toLowerCase();
  if(/funk|ファンク/.test(t)) return 'funk';
  if(/soul|ソウル/.test(t)) return 'soul';
  if(/r&b|r＆b|rhythm\s*(&|and)\s*blues/.test(t)) return 'rnb';
  if(/blues|ブルース/.test(t)) return 'blues';
  if(/classic|クラシック/.test(t)) return 'classic';
  if(/latin|ラテン|bossa|salsa/.test(t)) return 'latin';
  if(/歌謡/.test(t)) return 'kayo';
  if(/j\s*-?\s*pop/.test(t)) return 'jpop';
  if(/k\s*-?\s*pop/.test(t)) return 'kpop';
  if(/pop|ポップ/.test(t)) return 'pops';
  if(/rock|ロック/.test(t)) return 'rock';
  return String(v).trim();
}
// 戻り値：{fields:{name, orig, key, ...}, extra:[メモに足す行]}
function stParseInfo(lines, title){
  const fields = {}, extra = [];
  if(title) fields.name = title;
  for(const line of lines){
    let k, v;
    if(line.includes('|')){ const c = stSplitRow(line).map(stCell); if(c.length < 2) continue; k = c[0]; v = c.slice(1).filter(Boolean).join(' / '); }
    else { const m = line.match(/^[-*・]?\s*([^:：]+?)\s*[:：]\s*(.*)$/); if(!m) continue; k = m[1].replace(/\*\*/g, '').trim(); v = m[2].trim(); }
    if(!k || !v) continue;
    const hit = ST_INFO_KEYS.find(([, re]) => re.test(k));
    if(!hit){ extra.push(`${k}：${v}`); continue; }
    const f = hit[0];
    if(f==='capo'){ const n = parseInt(String(v).replace(/[^0-9]/g, ''), 10); if(n > 0 && n < 12) fields.capo = String(n); else if(!/なし|0|none/i.test(v)) extra.push(`${k}：${v}`); continue; }
    if(f==='meter'){ const mm = v.match(/(\d+)\s*\/\s*(\d+)/); const n = mm ? mm[1]+'/'+mm[2] : ''; if(METERS.includes(n)) fields.meter = n; else extra.push(`${k}：${v}`); continue; }
    if(f==='key'){ const n = stNormKey(v); if(n) fields.key = n; else extra.push(`${k}：${v}`); }
    else if(f==='bpm'){ const n = v.match(/\d+(\.\d+)?/); if(n) fields.bpm = String(Math.round(+n[0])); if(!n || !/^\d+(\.\d+)?$/.test(v)) extra.push(`${k}：${v}`); }
    else if(f==='duration'){ const n = v.match(/\d+:[0-5]\d/); if(n) fields.duration = n[0]; if(!n || n[0]!==v) extra.push(`${k}：${v}`); }
    else if(f==='genre') fields.genre = stNormGenre(v);
    else if(f==='notes') extra.unshift(v);
    else fields[f] = v;
  }
  return {fields, extra};
}
// Markdown全体を読む：{secs, info:{fields, extra}}
function stParseMd(text){
  const parts = stSplitMd(text);
  const secs = stParseTable(parts.struct.join('\n')), info = stParseInfo(parts.info, parts.title);
  // コードの見出しにカポがあれば、押さえ方の表記なので実音（＋カポ）に直す
  const hc = secs.capo || 0;
  if(hc){
    // ♯／♭の書き方は実音のキーに合わせる（「G表記」があればそこから、なければ最初のコードから推測）
    let shape = parseKey(secs.capoShape || '');
    if(!shape){ const fc = (secs.find(x => x.chord) || {}).chord || ''; const m = fc.match(/([A-G][#♯b♭]?)(m(?!aj))?/); if(m) shape = parseKey(m[1].replace('♯','#').replace('♭','b') + (m[2] ? 'm' : '')); }
    const real = shape ? {pc: (shape.pc + hc) % 12, minor: shape.minor} : null;
    secs.forEach(x => { if(x.chord) x.chord = stTransposeText(x.chord, hc, real, ''); });
    info.fields.capo = String(hc);
  }
  return {secs: [...secs], info, capoFixed: hc};
}
// 曲の空いている項目にだけ曲情報を入れる（すでにある値は上書きしない）。入れた項目名を返す
const ST_INFO_LABEL = {capo:'カポ', meter:'拍子', name:'曲名', orig:'原曲', key:'キー', bpm:'BPM', duration:'曲時間', genre:'ジャンル', rhythm:'リズム', start:'はじめかた', end:'おわりかた', url:'URL'};
function stFillEmptyInfo(s, info){
  const done = [];
  Object.keys(info.fields).forEach(f => {
    if(f==='name') return;
    const cur = String(s[f] || '').trim();
    if(!cur || cur==='-'){ s[f] = info.fields[f]; done.push(ST_INFO_LABEL[f] || f); }
  });
  if(info.extra.length && !String(s.notes || '').trim()){ s.notes = info.extra.join('\n'); done.push('メモ'); }
  return done;
}

// ---- Markdownのテンプレ（書き出し・取り込み欄のお手本・AIに渡す用で同じ形） ----
const ST_MD_INFO_ROWS = ['曲名','アーティスト','キー','BPM','拍子','カポ','曲時間','ジャンル','リズム','はじめかた','おわりかた','URL','メモ'];

const stMdCell = v => { const t = String(v ?? '').trim(); return t ? t.replace(/\|/g, '\\|').replace(/\r?\n/g, '<br>') : '—'; };
function stMdTables(infoMap, secs){
  const L = ['### 曲情報', '| 項目 | 内容 |', '|------|------|'];
  infoMap.forEach(([k, v]) => L.push(`| ${k} | ${stMdCell(v)} |`));

  secs.forEach(x => L.push(`| ${[x.name, x.bars, stTimes(x) > 1 ? stTimes(x) : '', x.chord, x.vocal, x.play, x.kime, x.kimeBar].map(stMdCell).join(' | ')} |`));

// ---- 構成画面のメトロノーム（曲のテンポで待機。−＋・TAPは一時的な変更で、曲には保存しない） ----
const stM = {bpm:120, on:false, sound:true, next:0, beat:0, timer:null, taps:[]};
function stSongBpm(){ const s = stSong(), e = stEntry(); const v = parseInt(s ? effVal(e, s, 'bpm') : '', 10); return v > 0 ? v : 120; }
function stSetBpm(v){
  stM.bpm = clampBpm(v);
  const box = document.getElementById('st-bpm'); if(!box) return;
  const sv = parseInt(stSong() ? effVal(stEntry(), stSong(), 'bpm') : '', 10);
  const changed = sv > 0 && sv !== stM.bpm;
  box.classList.toggle('changed', changed);
  box.querySelector('span').textContent = stM.bpm;
  box.querySelector('small').textContent = changed ? `↺ ${sv}` : (sv > 0 ? 'BPM' : 'BPM（仮）');
  box.setAttribute('aria-label', changed ? `曲のテンポ ${sv} に戻す` : 'テンポ');
  const tb = document.getElementById('st-tab-bpm'); if(tb) tb.textContent = stM.bpm;
}
function stTick(){
  if(!stM.on) return;
  const ctx = getCtx();
  const pl = meterPlan(songMeter(stSong()));
  { // 処理が遅れて拍に間に合わなかった分は鳴らさず、次の拍から鳴らし直す（まとめて鳴るのを防ぐ）
    const step = 60 / stM.bpm / pl.subs, late = ctx.currentTime - stM.next;
    if(late > 0.05){ const n = Math.ceil(late / step); stM.next += n * step; stM.beat += n; }
  }
  while(stM.next < ctx.currentTime + 0.12){
    // stM.beat は細かい刻み（6/8 の8分音符）も含めた通し番号
    const onBeat = stM.beat % pl.subs === 0, b = Math.floor(stM.beat / pl.subs) % pl.beats;
    if(stM.sound) scheduleLevelClick(stM.next, onBeat ? (b===0 ? 2 : 1) : 0);
    if(onBeat){
      const delay = Math.max(0, (stM.next - ctx.currentTime) * 1000);
      setTimeout(() => { document.querySelectorAll('#st-dots i').forEach((d, k) => d.classList.toggle('on', stM.on && k===b)); }, delay);   // 今の拍だけ光らせる
    }
    stM.next += 60 / stM.bpm / pl.subs; stM.beat++;
  }
}
function stMetroStart(){
  const ctx = getCtx();
  // iPhone などは、タップの中で無音を一度鳴らしておくと音が出るようになる
  try{ const b = ctx.createBuffer(1, 1, 22050), src = ctx.createBufferSource(); src.buffer = b; src.connect(ctx.destination); src.start(0); }catch(e){}
  stM.on = true; stM.beat = 0;
  const go = () => {
    if(!stM.on) return;
    stM.next = ctx.currentTime + 0.06;
    clearInterval(stM.timer); stM.timer = setInterval(stTick, 25); stTick();
  };
  if(ctx.state!=='running' && ctx.resume){ ctx.resume().then(go, go); } else go();
  stGoBtn();
}
// −＋：1回押すと1ずつ、長押しで連続して変わる（押し続けると速く）
function stBindSteps(el){
  el.querySelectorAll('[data-step]').forEach(btn => {
    const d = +btn.dataset.step;
    let t1 = null, t2 = null, n = 0, fromPointer = false;
    const stop = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = null; };
    btn.addEventListener('pointerdown', ev => {
      ev.preventDefault(); fromPointer = true; stop(); n = 0;
      stSetBpm(stM.bpm + d);
      t1 = setTimeout(() => { t2 = setInterval(() => { n++; stSetBpm(stM.bpm + d * (n > 15 ? 5 : 1)); }, 90); }, 400);
    });
    ['pointerup','pointerleave','pointercancel'].forEach(k => btn.addEventListener(k, stop));
    btn.addEventListener('contextmenu', ev => ev.preventDefault());
    // キーボード操作用（タップでは pointerdown 側で処理済み）
    btn.addEventListener('click', () => { if(fromPointer){ fromPointer = false; return; } stSetBpm(stM.bpm + d); });
  });
}
function stMetroStop(){
  stM.on = false; clearInterval(stM.timer); stM.timer = null;

function stNextBtn(show){
  let g = document.getElementById('st-navgrp');

  if(!g){
    g = document.createElement('div');
    g.id = 'st-navgrp'; g.className = 'st-navgrp';

    document.body.appendChild(g);
    g.querySelector('#st-prev').onclick = () => structNav(-1);
    g.querySelector('#st-next').onclick = () => structNav(1);
  }
  const seq = stSeq(), pos = seq.indexOf(stCur());
  const songAt = k => {
    if(k===undefined) return null;
    if(stFromStock()) return songs.find(x => x.id===k) || null;
    const l = stLive(), e = l && l.setlist[k]; return e ? songs.find(x => x.id===e.songId) || null : null;
  };
  const n = seq.length, ring = n > 1 && pos >= 0;
  const prev = ring ? songAt(seq[(pos - 1 + n) % n]) : null, next = ring ? songAt(seq[(pos + 1) % n]) : null;
  const pb = g.querySelector('#st-prev'), nb = g.querySelector('#st-next');
  pb.disabled = !prev;
  pb.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>`;
  pb.setAttribute('aria-label', prev ? `前の曲：${prev.name}` : '前の曲はありません');
  nb.disabled = !next;
  nb.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>`;
  nb.setAttribute('aria-label', next ? `${pos === n - 1 ? '先頭の曲に戻る' : '次の曲'}：${next.name}` : '次の曲はありません');
  g.hidden = false;
}

// ---- 構成表：画面の左右スワイプで曲を変える（左へ＝次の曲、右へ＝前の曲） ----
// 誤操作を防ぐため：画面の端から始めた指（iPhoneの「戻る」と重なる）、入力欄・下のボタン類の上、
// 横の動きが小さい・縦の動きが大きい・ゆっくりした動きでは反応しない。編集中も反応しない
let stSw = null;
document.addEventListener('touchstart', e => {
  stSw = null;
  if(!structOpen || structEdit || e.touches.length !== 1) return;
  const t = e.touches[0], w = window.innerWidth, edge = 28;
  if(t.clientX < edge || t.clientX > w - edge) return;
  if(e.target.closest && e.target.closest('input, textarea, select, .st-mbar, #st-navgrp, .st-inline-ed, .modal-overlay')) return;
  stSw = {x: t.clientX, y: t.clientY, t: Date.now()};
}, {passive: true});
document.addEventListener('touchend', e => {
  const sw = stSw; stSw = null;
  if(!sw || !structOpen || structEdit) return;
  const t = e.changedTouches[0]; if(!t) return;
  const dx = t.clientX - sw.x, dy = t.clientY - sw.y;
  const need = Math.max(80, window.innerWidth * 0.25);
  if(Math.abs(dx) < need || Math.abs(dy) > Math.abs(dx) * 0.5 || Date.now() - sw.t > 700) return;
  const d = dx < 0 ? 1 : -1;
  const r = structNav(d);
  if(!r || r.wrapped) return;   // 一周したときは structNav 側でお知らせを出す
  const s = stSong();
  stFlash(s ? s.name : '', `${d > 0 ? '次の曲' : '前の曲'}　${r.pos + 1}/${r.len}`);
}, {passive: true});
document.addEventListener('touchcancel', () => { stSw = null; }, {passive: true});
// 切り替わった曲名を画面の真ん中に一瞬大きく出す
function stFlash(title, sub){
  let el = document.getElementById('st-flash');

  el.innerHTML = `${sub ? `<small>${esc(sub)}</small>` : ''}<b>${esc(title)}</b>`;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  clearTimeout(stFlash.tm); stFlash.tm = setTimeout(() => el.classList.remove('show'), 900);
}

  // 入力途中の内容を残してから、取り込んだ値で上書き

  f.genre = g('song-genre'); f.orig = g('song-orig'); f.url = g('song-url'); f.notes = g('song-notes');

function tplDuration(v){
  v = String(v||'').normalize('NFKC').trim();
  if(!v) return DEFAULT_SONG_DUR;
  const m3 = v.match(/^(\d{1,2}):(\d{2}):(\d{2})$/);
  if(m3) v = (+m3[1]===0) ? `${+m3[2]}:${m3[3]}` : `${+m3[1]}:${m3[2]}`;
  const sec = parseDur(v);
  return sec>0 ? fmtDur(sec) : DEFAULT_SONG_DUR;
}

function importTemplateRows(rows){
  {
    const heads = Object.keys(rows[0]);
    const col = {};
    Object.entries(TPL_ALIASES).forEach(([f, al]) => { col[f] = heads.find(h => al.some(a => normName(a)===normName(h))); });
    if(!col.name){ showToast('「曲名」の列が見つかりません。フォーマットの見出しはそのままにしてください。'); return; }
    const val = (row, f) => col[f] ? String(row[col[f]]||'').trim() : '';
    const dupKey = (name, orig) => normName(name) + '|' + normName(orig);
    const have = new Set(songs.map(s => dupKey(s.name, s.orig)));
    const added = []; let skipped = 0;
    const now = Date.now();
    rows.forEach((row, k) => {
      const name = val(row, 'name');
      if(!name || /^例[:：]/.test(name)) return;
      const orig = val(row, 'orig');
      const key = dupKey(name, orig);
      if(have.has(key)){ skipped++; return; }
      have.add(key);
      added.push({id:uid(), name, bpm: val(row,'bpm') || '-', key: val(row,'key') || '-', duration: tplDuration(val(row,'duration')),
        start: val(row,'start'), end: val(row,'end'), url: val(row,'url'), notes: val(row,'notes'),
        genre: tplGenre(val(row,'genre')), rhythm: val(row,'rhythm'), orig, updatedAt: now + k});
    });
    if(added.length){
      if(stockAddPos==='start') songs = [...added, ...songs]; else songs.push(...added);
      saveSongs();
    }
    closeBulk(); render();
    if(!added.length && !skipped) showToast('登録できる行がありませんでした。曲名を記入してください。');
    else if(!added.length) showToast(`新しく登録する曲はありませんでした（${skipped}曲はすべて登録済み）。`);
    else showToast(`${added.length}曲を登録しました${skipped ? `（${skipped}曲は登録済みのため飛ばしました）` : ''}。`);
  }
}
// 1行ずつ読み取る。番号・記号を外し、時間とアーティストを切り分ける
// ミュージックアプリの検索結果のように「曲名」の次の行が「曲・アーティスト」になっている形も読む
const DUR_RE = /[（(]?[0-9０-９]{1,2}[:：][0-5０-５][0-9０-９][)）]?/g;
const META_SEP = '\\s*[・·•･‧∙]\\s*';
const SONG_META_RE = new RegExp('^(?:曲|シングル|song|single)' + META_SEP + '(.*)$', 'i');
const OTHER_META_RE = new RegExp('^(?:アルバム|ミュージックビデオ|ビデオ|プレイリスト|ステーション|ラジオ|アーティスト|album|music video|playlist|station|artist)(?:' + META_SEP + '.*)?$', 'i');
function cleanTitle(t){
  let cut = false;
  // 末尾の「...」「…」は画面で切れた印。切れて閉じていない括弧も落とす
  if(/(\.{2,}|…+)\s*$/.test(t)){
    cut = true;
    t = t.replace(/[\s.…]+$/,'');
    const open = Math.max(t.lastIndexOf('('), t.lastIndexOf('（'));
    const close = Math.max(t.lastIndexOf(')'), t.lastIndexOf('）'));
    if(open > close) t = t.slice(0, open);
  }
  // リマスター表記は外す（セットリストでは不要なため）
  t = t.replace(/\s*[（(\[［][^)）\]］]*remaster[^)）\]］]*[)）\]］]/ig,'').replace(/\s+-\s+[^-]*remaster.*$/i,'');
  return {title: t.trim(), cut};
}
function parseBulkText(text){
  const lines = String(text||'').split(/\r?\n/).map(l => l.replace(/\s+/g,' ').trim())
    .filter(l => /[\p{L}\p{N}]/u.test(l));   // 記号だけの行（●・••など）は捨てる
  const out = [];
  let appFormat = false;
  lines.forEach(line => {
    const norm = line.normalize('NFKC');
    const songMeta = norm.match(SONG_META_RE);
    if(songMeta){
      appFormat = true;
      const prev = out[out.length-1];
      if(prev && !prev.meta){ prev.meta = 'song'; if(!prev.artist) prev.artist = songMeta[1].trim(); }
      return;
    }
    if(OTHER_META_RE.test(norm)){
      appFormat = true;
      const prev = out[out.length-1];
      if(prev && !prev.meta) prev.meta = 'other';
      return;
    }
    let t = line, dur = '';
    const ds = norm.match(/[0-9]{1,2}:[0-5][0-9]/g);
    if(ds){ dur = ds[ds.length-1]; t = t.replace(DUR_RE,' ').replace(/\s+/g,' ').trim(); }
    // 時間だけの行は、直前の曲の時間として使う
    if(!t || !/[\p{L}\p{N}]/u.test(t)){ if(dur && out.length && !out[out.length-1].duration) out[out.length-1].duration = dur; return; }
    t = t.replace(/^(?:[0-9０-９]{1,3}[.)．、:：]?\s+|[0-9０-９]{1,3}[.)．、]|[①-⑳]\s*|[-・•*●◯○▶►✓✔]\s*)/,'').trim();
    let artist = '';
    const sp = t.split(/\s+[-–—\/／]\s+/);
    if(sp.length >= 2){ t = sp[0].trim(); artist = sp.slice(1).join(' - ').trim(); }
    const c = cleanTitle(t);
    if(!c.title) return;
    out.push({name:c.title, artist, duration:dur, cut:c.cut, meta:'', junk: BULK_JUNK.test(c.title.normalize('NFKC')) || /^\d+$/.test(c.title) || [...c.title].length===1});
  });
  // アルバムやプレイリストなど曲でない項目は外す。アプリの画面の形なら「曲・」の付かない行は曲ではなさそうとして扱う
  return out.filter(x => x.meta !== 'other').map(x => ({...x, junk: x.junk || (appFormat && x.meta !== 'song' && !x.duration)}));
}
window.parseBulk = () => {
  const ta = document.getElementById('bulk-text');
  bulk.text = ta ? ta.value : bulk.text;
  const have = new Set(songs.map(x=>normName(x.name)));
  const seen = new Set();
  bulk.items = parseBulkText(bulk.text).filter(x => { const n = normName(x.name); if(seen.has(n)) return false; seen.add(n); return true; }).map(x => {
    const pk = PACK_INDEX.find(p => normName(p.name)===normName(x.name));
    const exists = have.has(normName(x.name));
    return {...x, pk, ph: pk ? pk.dur : DEFAULT_SONG_DUR, artist: x.artist || (pk ? pk.who : ''), exists, on: !exists && !x.junk};
  });
  renderBulkReview();
};

function addSelectedToEvent(liveId){
  const live = lives.find(l=>l.id===liveId);
  if(!live) return;
  if(liveLockedGuard(live)) return;
  const have = new Set(live.setlist.filter(e=>e.type!=='other').map(e=>e.songId));
  const all = selectedStockEntries();
  const add = all.filter(e => !have.has(e.songId));
  live.setlist.push(...add);
  live.updatedAt = Date.now(); saveLives();
  stockSelectMode = false; stockSelected = new Set();
  openLive(liveId);
  const skipped = all.length - add.length;
  showToast(`${add.length}曲を「${live.venue || 'イベント'}」の最後に追加しました${skipped?`（${skipped}曲は追加済みのため除外）`:''}。`);

  const s = songs.find(x=>x.id===id); if(!s) return;
  if(s.hidden) delete s.hidden; else s.hidden = true;
  s.updatedAt = Date.now(); saveSongs(); if(stockSelectMode) refreshStockBody(); else render();
  showToast(`「${s.name}」を${s.hidden?'非表示に':'表示に'}しました。`);
};
window.setSelectedHidden = (hide) => {
  if(stockLockedGuard()) return;
  const ids = new Set(stockSelected); if(!ids.size) return;
  let n = 0;
  songs.forEach(s => { if(ids.has(s.id) && !!s.hidden !== hide){ if(hide) s.hidden = true; else delete s.hidden; s.updatedAt = Date.now(); n++; } });
  saveSongs();
  stockSelected = new Set(); render();
  showToast(n ? `${n}曲を${hide?'非表示に':'表示に'}しました。` : `選んだ曲はすでに${hide?'非表示':'表示'}です。`);
};
window.deleteSelectedStock = () => {
  if(stockLockedGuard()) return;
  const ids = new Set(stockSelected); const n = ids.size;
  if(!n) return;
  const usedSongs = [...ids].filter(id => songUsage(id).length).length;
  const usedLives = lives.filter(l => (l.setlist||[]).some(e => e.type!=='other' && ids.has(e.songId))).length;
  confirmAction(`選んだ${n}曲を削除しますか？${usedSongs ? `\nうち${usedSongs}曲は ${usedLives}件のイベントで使われていて、そのセットリストからも消えます。（どのイベントかは、1曲ずつ削除すると確認できます）` : ''}`, () => {
    songs = songs.filter(s => !ids.has(s.id));
    lives.forEach(l => l.setlist = l.setlist.filter(e => e.type==='other' || !ids.has(e.songId)));
    saveSongs(); saveLives();
    stockSelectMode = false; stockSelected = new Set();
    render();
    showToast(`${n}曲を削除しました。`);
  }, '削除する');
};
window.copyStockText = () => {
  const list = sortSongs(songs, songSort).filter(s => !s.hidden).filter(s => matchesSongFilter(s));
  if(!list.length){ showToast('曲がありません。'); return; }
  const num = stockVisibleNumbers();
  openTextExport('曲マスタの曲順', (n, o) => list.map(s => (n ? `${num.get(s.id)}. ` : '') + s.name + songSuffix(s, null, o)).join('\n'));
};

window.copySelectedSongOpen = () => {
  if(stockLockedGuard()) return;
  if(stockSelected.size!==1){ showToast('コピーする曲を1曲だけ選んでください。'); return; }
  const id = [...stockSelected][0], i = songs.findIndex(x => x.id===id); if(i<0) return;
  const src = songs[i];
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = uid(); copy.name = `${src.name}（コピー）`; copy.updatedAt = Date.now(); delete copy.hidden;
  songs.splice(i + 1, 0, copy); saveSongs();
  stockSelectMode = false; stockSelected = new Set();

// この曲を使っているイベント（日付の新しい順）
function songUsage(id){
  return sortLives(lives.filter(l => (l.setlist||[]).some(e => e.type!=='other' && e.songId===id)), 'date_desc');
}
function liveLabelHtml(l){
  return `<span class="use-date mono">${esc(l.date || '日付未設定')}</span><span class="use-name">${esc(l.venue || 'イベント名未設定')}</span>${l.artist ? `<span class="use-artist">${esc(l.artist)}</span>` : ''}`;
}
window.deleteSong = id => {
  if(stockLockedGuard()) return;
  const target = songs.find(s=>s.id===id); if(!target) return;
  const used = songUsage(id);
  const doDelete = () => {
    if(metroPanel && (metroPanel.songId===id || (metroPanel.entry && metroPanel.entry.songId===id))) stopMetro();
    songs = songs.filter(s=>s.id!==id);
    lives.forEach(l => l.setlist = l.setlist.filter(e=>e.songId!==id));
    saveSongs(); saveLives(); render();
    showToast(`「${target.name}」を削除しました。`);
  };
  closeSwipes();
  if(!used.length){ confirmAction(`「${target.name}」を削除しますか？`, doDelete, '削除する'); return; }
  // 使われているイベントを表示。多いときは最初の5件と「すべて表示」
  const LIMIT = 5;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  let showAll = used.length <= LIMIT;
  const draw = () => {
    const list = showAll ? used : used.slice(0, LIMIT);
    overlay.innerHTML = `<div class="modal-box use-box">
      <div class="modal-message">「${esc(target.name)}」は <b>${used.length}件</b> のイベントで使われています。削除すると、これらのセットリストからも消えます。</div>
      <div class="use-list ${showAll && used.length > LIMIT ? 'scroll' : ''}">${list.map(l => `<button type="button" class="use-item" data-live="${l.id}">${liveLabelHtml(l)}<span class="use-go">開く ›</span></button>`).join('')}</div>
      ${!showAll ? `<button type="button" class="use-more">ほか ${used.length - LIMIT}件をすべて表示</button>` : ''}
      <p class="use-hint">イベントを押すと、削除せずにそのイベントを開きます。</p>
      <div class="modal-actions">
        <button type="button" class="btn" data-act="cancel">キャンセル</button>
        <button type="button" class="btn btn-danger-fill" data-act="del">削除する</button>
      </div>
    </div>`;
  };
  draw();
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.addEventListener('click', ev => {
    if(ev.target===overlay){ close(); return; }
    const more = ev.target.closest('.use-more'); if(more){ showAll = true; draw(); return; }
    const it = ev.target.closest('.use-item');
    if(it){ close(); structOpen = null; structEdit = false; stOpenSec = null; stTrans = 0; stopMetro(); tab = 'lives'; openLive(it.dataset.live); return; }
    const a = ev.target.closest('[data-act]'); if(!a) return;
    close(); if(a.dataset.act==='del') doDelete();
  });
};

  ${(lives.length>1 || showFilter) ? `<div class="stock-tools">

    </select></label>` : ''}
    ${lives.length>1 ? `<label class="sort-chip" title="並び替え">${SORT_ICON_SVG}<select id="live-sort-quick" aria-label="並び替え">${liveSortOptionsHtml(liveSort)}</select></label>` : ''}
  </div>` : ''}`;
  const filtered0 = sortLives(lives, liveSort).filter(l => matchesLiveFilter(l));
  const pastCount = filtered0.filter(l => !l.pinned && liveDateStatus(l.date).kind==='past').length;
  if(pastCount) html += `<label class="past-toggle"><input type="checkbox" ${hidePast?'checked':''} onchange="setHidePast(this.checked)"> 過去のイベントを隠す（${pastCount}件）</label>`;
  if(lives.length) html += `<div class="list-opts lives-opts">${viewSegHtml(livesMode, 'setLivesMode')}<button type="button" class="lock-btn${livesLocked ? ' on' : ''}" onclick="toggleLivesLock()" aria-pressed="${livesLocked}" title="${livesLocked ? 'ロックを解除' : 'イベント一覧をロック'}">${livesLocked ? '🔒 ロック中' : '🔓 ロック'}</button></div>`;
  if(livesLocked && lives.length) html += `<div class="lock-note lives-lock-note">🔒 ロック中のため、イベントの作成・コピー・削除・イベント情報の編集はできません。<button type="button" class="link-btn" onclick="toggleLivesLock()">ロックを解除</button></div>`;
  const sorted0 = hidePast ? filtered0.filter(l => l.pinned || liveDateStatus(l.date).kind!=='past') : filtered0;
  const sorted = [...sorted0.filter(l => l.pinned), ...sorted0.filter(l => !l.pinned)];
  const nPinL = sorted.filter(l => l.pinned).length;
  if(lives.length===0){
    html += `<div class="empty">まだイベントが登録されていません。<br>「新しいイベント」から作成しましょう。</div>`;
  } else if(sorted.length===0){
    html += `<div class="empty">${filtered0.length && hidePast ? 'これからのイベントはありません（過去のイベントは隠しています）' : '絞り込みに合うイベントがありません。'}</div>`;
  } else {
    html += `<div class="live-grid lv-${livesMode}">`;   // 広い画面では2〜3列に並べる。lv-full／lv-bk／lv-min で表示の量を変える
    sorted.forEach((l, li) => {

    });
    html += `</div>`;
  }
  main.innerHTML = html;
  const addLiveBtn = document.getElementById('btn-add-live');
  if(addLiveBtn) addLiveBtn.onclick = () => {
    if(livesLockedGuard()) return;
    // アーティストで絞り込み中なら、そのアーティスト名を入れておく

function renderLiveEdit(){
  const live = lives.find(l=>l.id===liveEditId);
  if(!live){ liveEditId=null; render(); return; }
  if(entryEditIdx!==null){
    const h = entryEditHtml(live, entryEditIdx);
    if(h!==null){ main.innerHTML = h; return; }
    entryEditIdx = null;
  }
  const total = live.setlist.reduce((sum,e)=>sum+entryDuration(e),0);
  const songOnlyTotal = live.setlist.filter(e=>e.type!=='other').reduce((sum,e)=>sum+entryDuration(e),0);
  const songCount = live.setlist.filter(e=>e.type!=='other').length;
  const otherCount = live.setlist.length - songCount;
  const usedIds = live.setlist.filter(e=>e.type!=='other').map(e=>e.songId);

  if(timer.liveId !== liveEditId){
    stopTimerInterval();
    timer = {remaining: total, running:false, touched:false, endAt:0, intervalId:null, liveId: liveEditId};
  }
  // まだスタートしていなければ、曲の追加・削除・時間変更に合わせて最新の合計にそろえる
  if(!timer.running && !timer.touched) timer.remaining = total;
  const displayRemaining = timer.running ? Math.round((timer.endAt-Date.now())/1000) : timer.remaining;

  const summaryTime = timeRangeText(live.startTime, live.endTime) ? ' '+esc(timeRangeText(live.startTime, live.endTime)) : '';
  let html = `
  <div class="topbar">
    <button type="button" class="back-btn" onclick="backToLives()"><span class="back-arrow">←</span>イベント一覧</button>
  </div>`;
  if(justCopiedId===live.id){
    html += `<div class="new-copy-note">コピーから作った新しいイベントです。イベント名や日付を変更してください。</div>`;
  }
  // 広い画面（PC・タブレット・スマホ横）では、左にイベント情報・セットリスト作成・操作、右にセットリスト
  html += `<div class="le-grid"><div class="le-side">`;
  const liveSt = liveDateStatus(live.date);
  html += `<div class="fold-card st-card-${liveSt.kind}"><button type="button" class="fold-head" onclick="toggleLiveInfo()">
    <div class="fold-head-main">${liveInfoOpen

// 曲名の予測：曲マスタから、入力した文字を含む曲を候補に出す（全角・半角や大文字・小文字の違いは無視）
function normName(t){ return String(t||'').normalize('NFKC').toLowerCase().replace(/\s+/g,' ').trim(); }
window.updateQuickSuggest = (q) => {
  const box = document.getElementById('quick-song-suggest');
  if(!box) return;
  const nq = normName(q);
  if(!nq){ cancelNetSearch(); box.hidden = true; box.innerHTML = ''; return; }
  const live = lives.find(l=>l.id===liveEditId);
  const used = live ? live.setlist.filter(e=>e.type!=='other').map(e=>e.songId) : [];
  const stockHits = songs
    .filter(s => !s.hidden)
    .map(s => ({s, n:normName(s.name)}))
    .filter(x => x.n.includes(nq))
    .sort((a,b) => (b.n.startsWith(nq)-a.n.startsWith(nq)) || a.n.localeCompare(b.n,'ja'))
    .slice(0,5);
  const packHits = packSuggestions(nq, 5);
  if(!stockHits.length && !packHits.length){
    cancelNetSearch(); box.hidden = true; box.innerHTML = '';
    return;
  }
  cancelNetSearch();
  let html = '';
  if(stockHits.length) html += `<div class="suggest-head">曲マスタ</div>` + stockHits.map(({s}) =>
    `<button type="button" class="suggest-item" onclick="pickSuggestion('${s.id}')">
      <span class="suggest-name">${esc(s.name)}</span>
      ${used.includes(s.id) ? '<span class="suggest-used">追加済み</span>' : ''}
      <span class="suggest-dur mono">${esc(s.duration||'')}</span>
    </button>`).join('');
  if(packHits.length) html += `<div class="suggest-head">定番曲</div>` + packHits.map(x => packItemHtml(x, 'pickPackSuggestion')).join('');
  box.innerHTML = html;
  box.hidden = false;
};
let quickPackPick = null;  // 「曲を登録」で選んだ定番曲（ジャンルとアーティストを引き継ぐ）
window.pickPackSuggestion = (idx) => {
  const p = PACK_INDEX[idx];
  const nameEl = document.getElementById('quick-song-name');
  const durEl = document.getElementById('quick-song-dur');
  const box = document.getElementById('quick-song-suggest');
  if(!p || !nameEl) return;
  nameEl.value = p.name;
  if(durEl){
    const v = fmtDur(parseDur(p.dur));
    if(![...durEl.options].some(o=>o.value===v)){ const o=document.createElement('option'); o.value=v; o.textContent=v; durEl.insertBefore(o, durEl.firstChild); }
    durEl.value = v;
  }
  quickPackPick = idx;
  if(box){ box.hidden = true; box.innerHTML = ''; }
  nameEl.focus();
};
window.pickSuggestion = (songId) => {
  const s = songs.find(x=>x.id===songId);
  const nameEl = document.getElementById('quick-song-name');
  const durEl = document.getElementById('quick-song-dur');
  const box = document.getElementById('quick-song-suggest');
  if(!s || !nameEl) return;
  nameEl.value = s.name;
  if(durEl){
    const v = fmtDur(parseDur(s.duration || DEFAULT_SONG_DUR));
    if(![...durEl.options].some(o=>o.value===v)){ const o=document.createElement('option'); o.value=v; o.textContent=v; durEl.insertBefore(o, durEl.firstChild); }
    durEl.value = v;

  nameEl.focus();

const SWIPE_W = 88;

function closeSwipes(except){

    if(el===except) return;

  if(e.target.closest('.drag-handle, input, select, textarea, .swipe-bg')) return;
  closeSwipes(item);
  const face = item.querySelector('.swipe-face');
  if(!face) return;
  swipeState = {item, face, id:e.pointerId, x0:e.clientX, y0:e.clientY, locked:null, dx:0, canPin: !!item.querySelector('.swipe-bg-pin'), canDel: !!item.querySelector('.swipe-bg:not(.swipe-bg-pin)'),

    if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    st.locked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  }

// スマホは共有シート（ファイルに保存・LINE・AirDrop など）、PC はダウンロードで保存する
function browserDownloads(){
  return { save: async ({filename, data, raw, type: forcedType}) => {
    const type = forcedType || (raw ? 'application/json' : 'text/csv');
    const blob = new Blob([raw ? data : '\ufeff' + data], {type: type + ';charset=utf-8'});  // CSVは先頭のBOMで Excel でも文字化けしない
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
    if(isMobile && typeof File==='function' && navigator.canShare){
      const file = new File([blob], filename, {type});
      if(navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file], title:filename}); showToast('書き出しました。'); return; }
        catch(e){ if(e && e.name==='AbortError'){ const err = new Error('cancel'); err.code = 'declined'; throw err; } }
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    showToast(`「${filename}」をダウンロードしました。`);
  }};
}
async function getDownloads(){
  if(window.claude && window.claude.use){
    try{ const d = await window.claude.use('downloads'); return { save: ({raw, type, ...o}) => d.save({...o, data: raw ? o.data : '\ufeff' + o.data}) }; }catch(e){}
  }
  return browserDownloads();
}

// ---- 簡易CSV ----
function csvEscape(val){
  let s = (val===null||val===undefined) ? '' : String(val);
  // 表計算アプリで数式として動かないように、= + @ や「-文字」で始まる値の頭に ' を付ける（読み込み時に外す）
  if(/^[=+@\t\r]/.test(s) || /^-[^\d.\s]/.test(s)) s = "'" + s;
  if(/[",\r\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function toCSV(headers, rows){
  const lines = [headers.map(csvEscape).join(',')];
  rows.forEach(r => lines.push(headers.map(h => csvEscape(r[h])).join(',')));
  return lines.join('\r\n');
}
// CSVの文字コード：UTF-8 で読めなければ Shift_JIS（Windows の Excel の「CSV（コンマ区切り）」）として読む
function decodeCsvBuffer(buf){
  try{ return new TextDecoder('utf-8', {fatal:true}).decode(buf); }
  catch(e){ try{ return new TextDecoder('shift_jis').decode(buf); }catch(e2){ return new TextDecoder('utf-8').decode(buf); } }
}
function parseCSV(text){
  text = String(text||'').replace(/^\ufeff/, '');  // 先頭のBOMを外す（Excel・書き出しファイル）
  const rows = [];
  let i=0, field='', row=[], inQuotes=false;
  const pushField = () => { row.push(field); field=''; };
  const pushRow = () => { pushField(); rows.push(row); row=[]; };
  while(i<text.length){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i+=2; continue; } inQuotes=false; i++; continue; }
      field += c; i++; continue;
    } else {
      if(c==='"'){ inQuotes=true; i++; continue; }
      if(c===','){ pushField(); i++; continue; }
      if(c==='\r'){ i++; continue; }
      if(c==='\n'){ pushRow(); i++; continue; }
      field += c; i++; continue;
    }
  }
  if(field.length || row.length) pushRow();
  if(rows.length===0) return [];
  const headers = rows[0];
  return rows.slice(1).filter(r => r.length>1 || r[0]!=='').map(r => {
    const obj = {};
    headers.forEach((h,idx) => { obj[h] = r[idx]!==undefined ? String(r[idx]).replace(/^'(?=[=+@\t\r-])/, '') : ''; });
    return obj;
  });
}

      rows.push({...base, entry_type:'', entry_song_id:'', entry_label:'', entry_bpm:'', entry_key:'', entry_duration:'', entry_notes:'', entry_numbered:''});
    } else {
      l.setlist.forEach(e => {
        if(e.type==='other'){
          rows.push({...base, entry_type:'other', entry_song_id:'', entry_label:e.label||'', entry_bpm:'', entry_key:'', entry_duration:e.duration||'', entry_notes:e.notes||'', entry_numbered:e.numbered?'true':'false'});
        } else {
          const s = songs.find(x=>x.id===e.songId);
          rows.push({...base, entry_type:'song', entry_song_id:e.songId||'', entry_label:'', entry_bpm:e.bpm||'', entry_key:e.key||'', entry_duration:e.duration||'', entry_notes:e.notes||'', entry_numbered:'',
            entry_song_name: s?s.name:'', entry_song_duration: s?s.duration:'', entry_song_start: s?s.start:'', entry_song_end: s?s.end:'', entry_song_url: s?s.url:'', entry_song_notes: s?s.notes:'', entry_song_genre: s?s.genre:'', entry_song_rhythm: s?(s.rhythm||''):'', entry_song_orig: s?(s.orig||''):'', entry_start: e.start||'', entry_end: e.end||''});
        }
      });
    }
  });
  return rows;
}

// ---- CSV入力：ファイルの種類を見分けてから読み込む（曲とイベントの取り違えを防ぐ）----
function readCsvFile(file, done){
  const reader = new FileReader();
  reader.onload = () => {
    let rows;
    try{ rows = parseCSV(decodeCsvBuffer(reader.result)); }catch(e){ showToast('CSVの読み込みに失敗しました。ファイル形式を確認してください。'); return; }
    if(!Array.isArray(rows)){ showToast('CSVの形式が正しくありません。'); return; }
    done(rows, file && file.name);
  };
  reader.readAsArrayBuffer(file);
}
// 1行目の見出しから種類を判定：event=イベント一覧 / song=曲マスタのCSV出力 / template=一括登録のフォーマット / unknown
function csvKind(rows){
  if(!rows.length) return 'empty';
  const h = new Set(Object.keys(rows[0]).map(k => normName(k)));
  if(['event_id','event_date','event_venue','entry_type'].some(k => h.has(k))) return 'event';
  if(h.has('name')) return 'song';
  if(TPL_ALIASES.name.some(a => h.has(normName(a)))) return 'template';
  return 'unknown';
}
const CSV_WRONG_FILE = '曲マスタ・イベント一覧のCSVではないようです。1行目の見出しを確認してください。';
// 読み込む前の確認：ファイル名・作成場所・日時と、上書き／新規の件数
function confirmSongCsv(rows, fname){
  const named = rows.filter(r => String(r.name||'').trim());
  const over = named.filter(r => r.id && songs.some(x => x.id===r.id)).length;
  confirmAction(`この曲マスタのCSVを読み込みますか？\nファイル：${fname || '-'}\n${fileOriginText(fname)}内容：曲${named.length}件（上書き${over}件・新規${named.length - over}件）\n\n同じIDの曲は、CSVの内容で上書きされます。`, () => importSongRows(rows), '読み込む');
}
function confirmLiveCsv(rows, fname){
  const ids = new Set(), over = new Set();
  rows.forEach(r => { const id = r.event_id || ('csv:' + normName(r.event_date) + '|' + normName(r.event_venue)); if(!r.event_id && !String(r.event_venue||r.event_date||'').trim() && !r.entry_type) return; ids.add(id); if(r.event_id && lives.some(l => l.id===r.event_id)) over.add(id); });
  confirmAction(`このイベント一覧のCSVを読み込みますか？\nファイル：${fname || '-'}\n${fileOriginText(fname)}内容：イベント${ids.size}件（上書き${over.size}件・新規${ids.size - over.size}件）\n\n同じIDのイベントは、CSVの内容で上書きされます（セットリストも置き換わります）。曲マスタにない曲は自動で追加します。`, () => importLiveRows(rows), '読み込む');
}
window.handleSongImport = (file) => readCsvFile(file, (rows, fname) => {
  const kind = csvKind(rows);
  if(kind==='song') return confirmSongCsv(rows, fname);
  if(kind==='template') return importTemplateRows(rows);
  if(kind==='event') return confirmAction('このファイルはイベント一覧のCSVのようです。\nイベント一覧として読み込みますか？', () => importLiveRows(rows), 'イベントとして読み込む');
  showToast(kind==='empty' ? '読み込める行がありません。' : CSV_WRONG_FILE);
});
window.handleLiveImport = (file) => readCsvFile(file, (rows, fname) => {
  const kind = csvKind(rows);
  if(kind==='event') return confirmLiveCsv(rows, fname);
  if(kind==='song' || kind==='template') return confirmAction('このファイルは曲のCSVのようです（イベントの情報がありません）。\n曲マスタに読み込みますか？', () => kind==='song' ? importSongRows(rows) : importTemplateRows(rows), '曲マスタに読み込む');
  showToast(kind==='empty' ? '読み込める行がありません。' : CSV_WRONG_FILE);
});
function importSongRows(rows){
  let count = 0;
  rows.forEach(row => {
    if(!String(row.name||'').trim()) return;
    const item = {
      id: row.id || uid(),
      name: row.name.trim(), bpm: row.bpm||'', key: row.key||'', duration: row.duration||'',
      start: row.start||'', end: row.end||'', url: row.url||'', notes: row.notes||'', genre: row.genre||'', rhythm: row.rhythm||'', orig: row.orig||'',
      updatedAt: Number(row.updatedAt) || Date.now()
    };
    if(row.hidden==='1' || row.hidden==='true') item.hidden = true;
    if(row.pinned==='1' || row.pinned==='true') item.pinned = true;
    const idx = songs.findIndex(s=>s.id===item.id);
    if(row.meter!==undefined){ if(METERS.includes(String(row.meter).trim())) item.meter = String(row.meter).trim(); }
    if(row.capo!==undefined){ const n = parseInt(row.capo, 10); if(n > 0 && n < 12) item.capo = String(n); }
    if(idx>=0){
      const old = songs[idx];
      // CSVにない項目（構成・キーの表記・拍子の列がない古いCSV）は、今の曲の値を残す
      if(old.struct) item.struct = old.struct;
      if(old.acc) item.acc = old.acc;
      if(row.meter===undefined && old.meter) item.meter = old.meter;
      if(row.capo===undefined && old.capo) item.capo = old.capo;
      if(row.pinned===undefined && old.pinned) item.pinned = true;
      songs[idx] = item;
    } else songs.push(item);
    count++;
  });
  if(!count){ showToast('曲名のある行がありませんでした。'); return; }
  saveSongs(); render();
  showToast(`${count}件の曲データを読み込みました。`);
}
function importLiveRows(rows){
  const order = [];
  const groups = {};
  let addedSongs = 0;
  rows.forEach(row => {
    const hasEvent = ['event_date','event_venue','event_place','event_artist','event_start_time','event_end_time','event_memo'].some(k => String(row[k]||'').trim());
    const hasEntry = row.entry_type==='song' || row.entry_type==='other';
    if(!row.event_id && !hasEvent && !hasEntry) return;  // 何も入っていない行は読まない
    // IDが無い（手で作った）行は、日付＋イベント名が同じものを1つのイベントにまとめる
    const id = row.event_id || ('csv:' + normName(row.event_date) + '|' + normName(row.event_venue));
    if(!groups[id]){ groups[id] = {row, entries: []}; order.push(id); }
    if(row.entry_type==='song'){
      let songId = row.entry_song_id;
      if(!songId && row.entry_song_name){ const hit = songs.find(s => normName(s.name)===normName(row.entry_song_name)); songId = hit ? hit.id : uid(); }
      // 参照先の曲が手元にない場合は、埋め込まれたデータから自動で曲を追加する（他の人が共有したイベントを読み込むケース用）
      if(songId && !songs.find(s=>s.id===songId) && row.entry_song_name){
        songs.push({id: songId, name: row.entry_song_name, bpm: row.entry_bpm||'', key: row.entry_key||'', duration: row.entry_song_duration||'', start: row.entry_song_start||'', end: row.entry_song_end||'', url: row.entry_song_url||'', notes: row.entry_song_notes||'', genre: row.entry_song_genre||'', rhythm: row.entry_song_rhythm||'', orig: row.entry_song_orig||'', updatedAt: Date.now()});
        addedSongs++;
      }
      if(!songId || !songs.find(s=>s.id===songId)) return;  // 曲が特定できない行は入れない
      const en = {type:'song', songId, bpm: row.entry_bpm||'', key: row.entry_key||'', duration: row.entry_duration||''};
      ['start','end','notes'].forEach(f => { const v = row['entry_'+f]; if(v) en[f] = v; });
      groups[id].entries.push(en);
    } else if(row.entry_type==='other'){
      groups[id].entries.push({type:'other', id: uid(), label: row.entry_label||'', duration: row.entry_duration||'', notes: row.entry_notes||'', numbered: row.entry_numbered==='true'});
    }
  });
  let count = 0;
  order.forEach(id => {
    const g = groups[id];
    if(!String(g.row.event_venue||'').trim() && !String(g.row.event_date||'').trim() && !g.entries.length) return;  // 空のイベントは作らない
    const realId = id.startsWith('csv:') ? uid() : id;
    const item = {
      id: realId,
      date: g.row.event_date||'', venue: g.row.event_venue||'', place: g.row.event_place||'', artist: g.row.event_artist||'',
      startTime: g.row.event_start_time||'', endTime: g.row.event_end_time||'', memo: g.row.event_memo||'',
      updatedAt: Number(g.row.event_updated_at) || Date.now(),
      setlist: g.entries
    };
    const idx = lives.findIndex(l=>l.id===realId);
    if(idx>=0) lives[idx] = item; else lives.push(item);
    count++;
  });
  if(addedSongs>0) saveSongs();
  if(!count){ showToast('イベントとして読み込める行がありませんでした。'); return; }
  saveLives(); render();
  showToast(`${count}件のイベントを読み込みました${addedSongs>0?`（曲を${addedSongs}件自動追加）`:''}。`);
}

const PACK_INDEX = Object.values(SONG_PACKS).flatMap(pk => pk.songs.map(([name, who, dur]) => ({name, who, dur, genre:pk.genre, credit:pk.credit, pack:pk.label})));
function packSuggestions(nq, limit){
  const have = new Set(songs.map(x=>normName(x.name)));
  return PACK_INDEX
    .map((p,idx) => ({p, idx, n:normName(p.name), w:normName(p.who)}))
    .filter(x => !have.has(x.n) && (x.n.includes(nq) || x.w.includes(nq)))
    .sort((a,b) => (b.n.startsWith(nq)-a.n.startsWith(nq)) || a.n.localeCompare(b.n,'ja'))
    .slice(0, limit);
}
// ---- Apple Music（iTunes）のカタログ検索 ----
// 通信が許される環境（GitHub Pages や Safari で直接開いた場合など）で動く。
// Claude の公開ページのように通信が止められている環境では、検索ページへのリンクに切り替える
const itunesCache = new Map();
let netBlocked = false;
let netResults = [];      // 最後に表示したカタログの検索結果
let netSeq = 0;           // 入力が変わったら古い結果を捨てるための番号
let netTimer = null;

function mapItunesGenre(g){
  const t = String(g||'').toLowerCase();
  if(t.includes('歌謡')) return 'kayo';
  if(t.includes('rock') || t.includes('ロック')) return 'rock';
  if(t.includes('blues') || t.includes('ブルース')) return 'blues';
  if(t.includes('classical') || t.includes('クラシック')) return 'classic';
  if(t.includes('latin') || t.includes('ラテン')) return 'latin';
  if(t.includes('pop') || t.includes('ポップ')) return 'pops';
  return '';
}
function itunesSearch(term){
  const key = normName(term);
  if(itunesCache.has(key)) return Promise.resolve(itunesCache.get(key));
  const url = `https://itunes.apple.com/search?term=${encodeURIComponent(term)}&country=JP&lang=ja_jp&media=music&entity=song&limit=8`;
  const viaFetch = () => {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 6000);
    return fetch(url, {signal:ctl.signal}).then(r => { clearTimeout(t); if(!r.ok) throw new Error('http'); return r.json(); });
  };
  const viaJsonp = () => new Promise((resolve, reject) => {
    const cb = '__itunes_' + Math.random().toString(36).slice(2);
    const sc = document.createElement('script');
    const done = (ok, v) => { clearTimeout(t); try{ delete window[cb]; }catch(e){ window[cb] = undefined; } sc.remove(); ok ? resolve(v) : reject(new Error('jsonp')); };
    const t = setTimeout(() => done(false), 6000);
    window[cb] = d => done(true, d);
    sc.onerror = () => done(false);
    sc.src = url + '&callback=' + cb;
    document.head.appendChild(sc);
  });
  return viaFetch().catch(viaJsonp).then(d => {
    const seen = new Set();
    const list = ((d && d.results) || []).filter(r => r && r.trackName).map(r => ({
      name: r.trackName, artist: r.artistName || '', album: r.collectionName || '',
      art: (r.artworkUrl100 || '').replace('100x100bb', '200x200bb'),
      dur: r.trackTimeMillis ? fmtDur(Math.round(r.trackTimeMillis/1000)) : '',
      url: r.trackViewUrl || '', genre: mapItunesGenre(r.primaryGenreName)
    })).filter(x => { const k = normName(x.name)+'|'+normName(x.artist); if(seen.has(k)) return false; seen.add(k); return true; });
    itunesCache.set(key, list);
    return list;
  });
}
// 定番曲にないとき：カタログを検索して候補を出す（入力が止まってから少し待って検索）
function showNetSearch(box, q, ctx){
  if(netBlocked){ box.innerHTML = netSearchHtml(q); box.hidden = false; return; }
  const my = ++netSeq;
  box.innerHTML = `<div class="suggest-head">Apple Musicのカタログを検索中…</div>`;
  box.hidden = false;
  clearTimeout(netTimer);
  netTimer = setTimeout(() => {
    itunesSearch(q).then(list => {
      if(my !== netSeq || !document.body.contains(box)) return;
      if(!list.length){ box.innerHTML = netSearchHtml(q, 'Apple Musicのカタログにも見つかりませんでした'); return; }
      netResults = list;
      box.innerHTML = `<div class="suggest-head">Apple Musicのカタログ</div>` + list.map((x,k) =>
        `<button type="button" class="suggest-item" onclick="pickNet('${ctx}',${k})">
          <span class="suggest-name">${esc(x.name)}<span class="suggest-who">${esc(x.artist)}</span></span>
          <span class="suggest-dur mono">${esc(x.dur)}</span>
        </button>`).join('');
    }).catch(() => {
      netBlocked = true;
      if(my !== netSeq || !document.body.contains(box)) return;
      box.innerHTML = netSearchHtml(q);
    });
  }, 450);
}
function cancelNetSearch(){ netSeq++; clearTimeout(netTimer); }
window.pickNet = (ctx, k) => {
  const x = netResults[k];
  if(!x) return;
  if(ctx==='stock'){
    const set = (id, v) => { const el = document.getElementById(id); if(el) el.value = v; };
    set('song-name-input', x.name);
    if(x.dur){ const dp = durParts(x.dur); set('song-dur-min', String(dp.min)); set('song-dur-sec', String(dp.sec)); }
    if(x.genre) set('song-genre', x.genre);
    const orig = document.getElementById('song-orig'); if(orig && !orig.value.trim() && x.artist) orig.value = x.artist;
    const url = document.getElementById('song-url'); if(url && !url.value.trim() && x.url) url.value = x.url;
    const box = document.getElementById('stock-song-suggest'); if(box){ box.hidden = true; box.innerHTML = ''; }
  } else {
    const nameEl = document.getElementById('quick-song-name');
    const durEl = document.getElementById('quick-song-dur');
    if(!nameEl) return;
    nameEl.value = x.name;
    if(durEl && x.dur){
      const v = fmtDur(parseDur(x.dur));
      if(![...durEl.options].some(o=>o.value===v)){ const o=document.createElement('option'); o.value=v; o.textContent=v; durEl.insertBefore(o, durEl.firstChild); }
      durEl.value = v;
    }
    quickNetPick = x; quickPackPick = null;
    const box = document.getElementById('quick-song-suggest'); if(box){ box.hidden = true; box.innerHTML = ''; }
    nameEl.focus();
  }
  cancelNetSearch();
};

window.onRegQuery = (q, ctx='live') => {
  netQ = q;
  clearTimeout(regTimer);
  const nq = normName(q);
  if(regCurrentTab(ctx) !== 'net'){ updateRegResults(ctx); return; }
  if([...nq].length < 2){
    netSeq++; netLoading = false; netResults = []; netResultsQ = '';
    updateRegResults(ctx); return;
  }
  // 入力のたびに、公開の音楽カタログ（Apple Music・Deezer）へすぐ問い合わせる。古い応答は捨てる
  const my = ++netSeq;
  netLoading = true; updateRegResults(ctx);
  catalogSearch(q.trim()).then(res => {
    if(my !== netSeq) return;
    netBlocked = res.allFailed;
    netResults = res.list; netResultsQ = q.trim(); netSource = res.status; netLoading = false;
    updateRegResults(ctx);
  });
};

}
// Deezer（公開の検索API・JSONP）。アートワーク・アルバム・時間が返る
function deezerSearch(term){
  return new Promise((resolve, reject) => {
    const cb = '__deezer_' + Math.random().toString(36).slice(2);
    const sc = document.createElement('script');
    const done = (ok, v) => { clearTimeout(t); try{ delete window[cb]; }catch(e){ window[cb] = undefined; } sc.remove(); ok ? resolve(v) : reject(new Error('deezer')); };
    const t = setTimeout(() => done(false), 8000);
    window[cb] = d => done(true, d);
    sc.onerror = () => done(false);
    sc.src = `https://api.deezer.com/search?q=${encodeURIComponent(term)}&limit=10&output=jsonp&callback=${cb}`;
    document.head.appendChild(sc);
  }).then(d => ((d && d.data) || []).filter(r => r && r.title).map(r => ({
    name: r.title, artist: (r.artist && r.artist.name) || '', album: (r.album && r.album.title) || '',
    art: (r.album && (r.album.cover_medium || r.album.cover_small)) || '',
    dur: r.duration ? fmtDur(r.duration) : '', url: r.link || '', genre: ''
  })));
}
// 2つの検索元をまとめて検索する（片方が失敗しても、もう片方の結果を出す）
function catalogSearch(term){
  const key = normName(term);
  if(catalogCache.has(key)) return Promise.resolve(catalogCache.get(key));
  return Promise.allSettled([itunesSearch(term), deezerSearch(term)]).then(([a, b]) => {
    const srcs = [['Apple Music', a], ['Deezer', b]];
    const status = srcs.map(([n, r]) => r.status === 'fulfilled' ? `${n} ${r.value.length}件` : `${n} 接続できず`).join(' / ');
    const allFailed = a.status === 'rejected' && b.status === 'rejected';
    const seen = new Set(); const list = [];
    for(const [, r] of srcs){
      if(r.status !== 'fulfilled') continue;
      for(const x of r.value){
        const k = normName(x.name) + '|' + normName(x.artist);
        if(!seen.has(k)){ seen.add(k); list.push(x); }
      }
    }
    const out = {list, status, allFailed};
    if(!allFailed) catalogCache.set(key, out);
    return out;
  });
}

function regResultsHtml(ctx){
  const tab = regCurrentTab(ctx);
  const isStock = ctx === 'stock';
  const live = isStock ? null : lives.find(l=>l.id===liveEditId);
  const q = netQ.trim();
  const nq = normName(q);
  const row = (art, title, sub, btn) => `<div class="reg-row">
      <div class="reg-art">${art ? `<img src="${esc(art)}" alt="" loading="lazy">` : '<span>♪</span>'}</div>
      <div class="reg-main"><div class="reg-title">${esc(title)}</div><div class="reg-sub">${esc(sub)}</div></div>
      ${btn}
    </div>`;
  const addBtn = (fn) => `<button type="button" class="btn btn-accent" onclick="${fn}">追加</button>`;
  const doneTag = '<span class="suggest-used">登録済み</span>';
  const inStock = (name) => songs.some(s => normName(s.name) === normName(name));
  const inSetlist = (name) => !!live && live.setlist.some(e => { if(e.type==='other') return false; const s = songs.find(z=>z.id===e.songId); return !!s && normName(s.name)===normName(name); });

  if(tab === 'lib'){
    const packHits = packHitsFor(nq);
    if(isStock){
      if(!packHits.length) return `<div class="reg-empty">該当する定番曲がありません。「ネット検索」か「手入力」から登録できます。</div>`;
      return `<div class="reg-count">定番曲から曲マスタに登録します。</div><div class="reg-list">` +
        packHits.map(x => row('', x.p.name, `${x.p.who} · ${x.p.dur}`, inStock(x.p.name) ? doneTag : addBtn(`addPackToStock(${x.idx})`))).join('') + `</div>`;
    }
    const stockHits = songs
      .filter(s => !s.hidden && (!nq || normName(s.name).includes(nq) || normName(s.notes||'').includes(nq)))
      .sort((a,b) => nq ? ((normName(b.name).startsWith(nq)) - (normName(a.name).startsWith(nq))) : 0);
    if(!stockHits.length && !packHits.length){
      return `<div class="reg-empty">${songs.length ? '該当する曲がありません。' : '曲マスタはまだ空です。'}「ネット検索」か「手入力」から登録できます。</div>`;
    }
    let html = '';
    if(stockHits.length){
      html += `<div class="reg-list">` + stockHits.map(s => row('', s.name, s.duration || '',
        inSetlist(s.name) ? '<span class="suggest-used">追加済み</span>' : addBtn(`addStockSongToLive('${s.id}')`)
      )).join('') + `</div>`;
    }
    if(packHits.length){
      html += `<div class="reg-count">定番曲</div><div class="reg-list">` + packHits.map(x => row('', x.p.name, `${x.p.who} · ${x.p.dur}`, addBtn(`addPackToLive(${x.idx})`))).join('') + `</div>`;
    }
    return html;
  }

  // ネット検索（Apple Musicのカタログ）
  if([...nq].length < 2) return `<div class="reg-empty">曲名の頭か、アーティスト名を2文字以上入力すると、公開の音楽カタログから候補が出ます。</div>`;
  if(netLoading || netResultsQ !== q) return `<div class="reg-empty">検索中…</div>`;
  if(netBlocked) return netSearchHtml(q, 'この画面ではカタログ検索に接続できません');
  if(!netResults.length) return `<div class="reg-empty">見つかりませんでした。<div class="reg-note">検索元：${esc(netSource)}</div>別の書き方（曲名だけ、アーティスト名だけ）か、「手入力」で登録できます。</div>`;
  return `<div class="reg-count">${netResults.length}件（${esc(netSource)}）。「追加」で${isStock ? '曲マスタに登録されます' : 'セットリストに入り、曲マスタにも登録されます'}。</div>
    <div class="reg-list">${netResults.map((x,k) => {
      const done = isStock ? inStock(x.name) : inSetlist(x.name);
      const fn = isStock ? `addNetResultToStock(${k})` : `addNetResult(${k})`;
      return row(x.art, x.name, [x.artist, x.album, x.dur].filter(Boolean).join(' · '), done ? (isStock ? doneTag : '<span class="suggest-used">追加済み</span>') : addBtn(fn));
    }).join('')}</div>`;
}
// 曲名・時間・出典から、曲マスタに登録する（同じ名前の曲があればそれを使う）
function songFromInfo(info){
  const name = String(info.name||'').trim();
  const dur = info.dur ? fmtDur(parseDur(info.dur)) : DEFAULT_SONG_DUR;
  return {id:uid(), name, bpm:'-', key:'-', duration: dur, start:SE_START_DEFAULT, end:'', url: info.url||'', notes: info.notes||'', genre: info.genre||'', rhythm:'', orig: info.orig||'', updatedAt:Date.now()};
}
function registerSongToStock(info){
  const name = String(info.name||'').trim();
  if(!name) return;
  if(songs.some(x => normName(x.name) === normName(name))){ showToast(`「${name}」は曲マスタにすでにあります。`); return; }
  const f = songFromInfo(info);
  if(stockAddPos==='start') songs.unshift(f); else songs.push(f);
  saveSongs();
  showToast(`「${name}」を曲マスタに登録しました。`);
  finishSongEdit();
}
// 曲名・時間・出典から、曲マスタとセットリストに追加する（同じ名前の曲があればそれを使う）
function addSongInfoToLive(info){
  const live = lives.find(l=>l.id===liveEditId);
  const name = String(info.name||'').trim();
  if(!live || !name) return;
  let song = songs.find(x=>normName(x.name)===normName(name));
  if(!song){
    song = songFromInfo(info);
    songs.push(song); saveSongs();
  }
  insertEntries(live, [{type:'song', songId:song.id}], registerAddPos);
  live.updatedAt = Date.now();
  saveLives(); render();
  showToast(`「${song.name}」を${posLabel(registerAddPos)}に追加しました。`);
}

};

function backupKeys(){
  const keys = [];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf('setlist_')===0 && k!==SEEN_VERSION_KEY) keys.push(k);
    }
  }catch(e){}
  return keys.sort();
}

function fileTag(){ return `${placeSlug()}_${backupStamp()}_v${APP_VERSION}`; }
// ファイル名から「どこで・いつ・どの版で」書き出したかを読み取る（読み込み前の確認用）
function fileOriginText(name){
  const m = /_([A-Za-z]+-[A-Za-z]+)_(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})_v([\d.]+)\.\w+$/.exec(String(name || ''));
  if(!m) return '';
  return `作成場所：${m[1]}\n作成日時：${+m[2]}/${+m[3]}/${+m[4]} ${m[5]}:${m[6]}（v${m[7]}）\n`;
}
function backupStamp(){
  const d = new Date(), z = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}`;
}
window.exportBackup = async () => {
  const data = {};
  backupKeys().forEach(k => { try{ data[k] = JSON.parse(localStorage.getItem(k)); }catch(e){} });
  data.setlist_songs = songs; data.setlist_lives = lives;  // 画面上の最新の内容
  const obj = {app:'players-setlist', schemaVersion: SCHEMA_VERSION, appVersion: APP_VERSION, createdAt: new Date().toISOString(), place: currentPlaceLabel(), data};
  const dl = await getDownloads();
  if(!dl){ showToast('この環境ではファイル書き出しができません。'); return; }
  try{ await dl.save({filename:`setlist-backup_${placeSlug()}_${backupStamp()}_v${APP_VERSION}.json`, data: JSON.stringify(obj, null, 1), raw:true}); }
  catch(err){ if(!err || err.code!=='declined') showToast('書き出しに失敗しました: '+((err&&err.message)||'不明なエラー')); }
};
function parseBackup(text){
  let obj;
  try{ obj = JSON.parse(String(text).replace(/^\ufeff/, '')); }catch(e){ return {error:'バックアップファイルとして読み込めませんでした。「バックアップ」で保存した .json ファイルを選んでください。'}; }
  if(!obj || obj.app!=='players-setlist' || !obj.data || typeof obj.data!=='object'){
    return {error:'このアプリのバックアップファイルではありません。「バックアップ」で保存した setlist-backup_〜.json を選んでください。（CSVは「曲マスタ」「イベント一覧」のCSV入力から読み込めます）'};
  }
  if((obj.schemaVersion||1) > SCHEMA_VERSION) return {error:'新しいバージョンのアプリで作られたバックアップです。アプリを最新にしてから復元してください。'};
  const d = obj.data;
  if(!Array.isArray(d.setlist_songs) || !Array.isArray(d.setlist_lives)) return {error:'バックアップの中身が壊れているようです（曲マスタまたはイベント一覧がありません）。'};
  return {obj, songs: d.setlist_songs.length, lives: d.setlist_lives.length};
}
function handleBackupFile(file){
  if(/\.csv$/i.test(file.name||'')){ showToast('CSVは「曲マスタ」「イベント一覧」のCSV入力から読み込んでください。'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const plan = parseBackup(reader.result);
    if(plan.error){ showToast(plan.error); return; }
    const o = plan.obj;
    let when = '';
    try{ const t = new Date(o.createdAt); if(!isNaN(t)) when = `${t.getFullYear()}/${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`; }catch(e){}
    const msg = `このバックアップを復元しますか？\n作成日時：${when||'不明'}${o.appVersion?'（v'+o.appVersion+'）':''}\n${o.place?'作成場所：'+o.place+'\n':''}内容：曲${plan.songs}曲・イベント${plan.lives}件\n\n今の曲マスタ（${songs.length}曲）とイベント一覧（${lives.length}件）、表示などの設定は、すべてこの内容に置き換わります。`;
    confirmAction(msg, () => applyBackup(o), '復元する');
  };
  reader.onerror = () => showToast('ファイルを読み込めませんでした。');
  reader.readAsText(file);
}
function applyBackup(obj){
  try{
    backupKeys().forEach(k => localStorage.removeItem(k));
    Object.keys(obj.data).forEach(k => { if(k.indexOf('setlist_')===0 && k!==SEEN_VERSION_KEY) localStorage.setItem(k, JSON.stringify(obj.data[k])); });
    localStorage.setItem(SEEN_VERSION_KEY, JSON.stringify(APP_VERSION));
    sessionStorage.setItem('setlist_restored', '1');
  }catch(e){ showToast('復元に失敗しました: ' + (e && e.message || '不明なエラー')); return; }
  location.reload();
}
try{ if(sessionStorage.getItem('setlist_restored')){ sessionStorage.removeItem('setlist_restored'); setTimeout(() => showToast('バックアップから復元しました。'), 300); } }catch(e){}

window.resetAllData = () => {
  confirmAction('曲マスタとイベント一覧のすべてのデータを削除します。よろしいですか？\nこの操作は取り消せません。', () => {
    songs = []; lives = [];
    saveSongs(); saveLives();
    stopMetro(); resetTimerState();
    liveEditId = null; songForm = null; songExpandedId = null; entryExpandedIdx = null;
    tab = 'songs';
    render();
    showToast('全データを初期化しました。');
  }, '初期化する');
};

render();
</script>
