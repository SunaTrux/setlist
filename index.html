<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
// iPhone/iPad：文字サイズ16px未満の入力欄をタップすると自動で拡大され、そのまま右側が切れて見えるのを防ぐ
// （iOS ではこの指定があっても指でのピンチ拡大はできる。Android には付けない）
(function(){
  var ua = navigator.userAgent;
  var iOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  if(iOS){ var m = document.querySelector('meta[name=viewport]'); if(m) m.setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover'); }
})();
</script>
<!-- アプリ側でライト／ダークを切り替えるので、ブラウザの強制ダーク（Brave のナイトモード等）をかけない -->
<meta name="color-scheme" content="light dark">
<meta name="darkreader-lock">
<title>プレイヤーズセットリスト</title>
<!-- ホーム画面に追加したとき、Safari のツールバーなしの全画面で開く -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="セットリスト">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#EDE8DE; --surface:#F8F5EC; --surface2:#FFFFFF; --text:#211D16; --muted:#6B6355;
  --accent:#C98A2C; --accent-text:#211D16; --border:#D8D0BF; --danger:#A84432; --radius:10px;
  color-scheme:light dark;
}
:root[data-theme="light"]{color-scheme:only light;}
:root[data-theme="dark"]{color-scheme:dark;}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14120F; --surface:#1E1A15; --surface2:#262019; --text:#F2EDE4; --muted:#A79E8C;
    --accent:#E8A33D; --accent-text:#14120F; --border:#332C22; --danger:#C4664A;
  }
}
:root[data-theme="dark"]{
  --bg:#14120F; --surface:#1E1A15; --surface2:#262019; --text:#F2EDE4; --muted:#A79E8C;
  --accent:#E8A33D; --accent-text:#14120F; --border:#332C22; --danger:#C4664A;
}
*{box-sizing:border-box;}
html,body{height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-tap-highlight-color:transparent;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
#app{max-width:520px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; min-width:0;}
/* 画面より横に広がらないように（Safari はプルダウンの一番長い選択肢の幅で広がることがある） */
body{overflow-x:hidden;}
#app > *{min-width:0; max-width:100%;}
.stock-tools > *, .song-toolbar > *, .list-opts > *, .setlist-head > *{min-width:0;}
.sort-chip select{max-width:100%;}

header{position:sticky; top:0; padding-top:calc(14px + env(safe-area-inset-top,0px)); background:var(--bg); z-index:10; border-bottom:1px solid var(--border);}
h1{font-size:20px; margin:0 16px 12px; letter-spacing:.02em;}
nav{display:flex; padding:0 16px; gap:4px;}
nav button{flex:1; padding:10px 0; background:none; border:none; color:var(--muted); font-size:14px; font-weight:600; border-bottom:2px solid transparent; cursor:pointer;}
nav button.active{color:var(--text); border-bottom-color:var(--accent);}

main{flex:1; padding:16px; padding-bottom:40px; box-sizing:border-box; width:100%; overflow-x:clip;}
.empty{color:var(--muted); font-size:14px; text-align:center; padding:40px 12px; line-height:1.7;}
.hint{color:var(--muted); font-size:12px; padding:0 2px 14px; line-height:1.6;}

.btn{display:inline-block; padding:10px 16px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:14px; font-weight:600; cursor:pointer;}
.btn-accent{background:var(--accent); color:var(--accent-text); border-color:var(--accent);}
.btn-ghost{background:none; border:none; color:var(--muted); font-weight:500; padding:6px 8px; cursor:pointer;}
.back-btn{display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:8px 18px 8px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-family:inherit; font-size:15px; font-weight:700; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent;}
.back-btn .back-arrow{font-size:18px; line-height:1;}
.btn-danger{color:var(--danger); background:none; border:none; font-weight:500; cursor:pointer;}
.btn-block{width:100%; text-align:center; margin-bottom:14px;}
.btn-with-icon{display:flex; align-items:center; justify-content:center; gap:8px;}
.btn-with-icon svg{flex-shrink:0;}
.btn-tap{flex-shrink:0; padding:0 10px; border-radius:8px; border:1px solid var(--accent); background:none; color:var(--accent); font-size:11px; font-weight:700; letter-spacing:.04em; cursor:pointer;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:10px; overflow:hidden;}
.song-card{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; padding:14px;}
.song-main{min-width:0;}
.song-name{font-size:16px; font-weight:700; margin-bottom:4px; overflow-wrap:anywhere;}
.song-meta{font-size:12px; color:var(--muted); display:flex; gap:8px; flex-wrap:wrap;}
.song-meta span.tag{background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:1px 6px;}
.song-flow{font-size:12px; color:var(--muted); margin-top:6px;}
.row-actions{display:flex; gap:6px; flex-shrink:0;}
.icon-btn{width:40px; height:40px; padding:0; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer;}
.icon-btn.danger{color:var(--danger);}
.song-main.tappable{flex:1; cursor:pointer;}
.ref-link{display:inline-block; margin-top:6px; font-size:13px; font-weight:600; color:var(--accent); text-decoration:none;}

.detail-panel{border-top:1px solid var(--border); padding:12px 14px; background:var(--surface2);}
.detail-line{font-size:13px; color:var(--muted); margin-bottom:6px; line-height:1.6;}
.detail-line a{color:var(--accent); text-decoration:none; font-weight:600;}
.detail-note{font-size:13px; white-space:pre-wrap; line-height:1.7; overflow-wrap:anywhere;}
.detail-se{margin-bottom:4px;}
.muted{color:var(--muted);}

.live-card{display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px; cursor:pointer; color:var(--text);}
.live-date{font-size:12px; color:var(--accent); font-weight:700; letter-spacing:.03em;}
.live-venue{font-size:14px; font-weight:700; margin:4px 0 2px;}
.live-artist{font-size:13px; color:var(--muted);}
.live-count{font-size:12px; color:var(--muted); margin-top:6px;}
.live-card-wrap{position:relative; margin-bottom:10px; border-radius:var(--radius); overflow:hidden; background:var(--surface);}
.live-card-wrap .live-card{padding-right:72px; margin-bottom:0;}
.live-del-btn{position:absolute; right:12px; top:12px; margin:0;}
.live-struct-btn{position:absolute; right:12px; bottom:12px; height:34px; padding:0 12px; touch-action:manipulation;}

.panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:16px;}
.field{margin-bottom:10px;}
.field label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px;}
.field input,.field select,.field textarea{width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:15px; font-family:inherit;}
.time-wrap{position:relative; border-radius:8px; border:1px solid var(--border); background:var(--surface2); overflow:hidden;}
.time-undecided{display:none; position:absolute; inset:0; align-items:center; justify-content:center; font-size:16px; color:var(--muted); pointer-events:none;}
.time-wrap.is-empty .time-undecided{display:flex;}
.time-wrap.is-empty input[type="time"]{color:transparent;}
.time-wrap.is-empty input[type="time"]::-webkit-datetime-edit{color:transparent;}
.time-clear{position:absolute; right:4px; top:50%; transform:translateY(-50%); width:26px; height:26px; border-radius:50%; border:none; background:none; color:var(--muted); font-size:16px; line-height:1; cursor:pointer;}
.time-wrap.is-empty .time-clear{display:none;}
.time-wrap:not(.is-empty) input[type="time"]{padding-right:30px;}
.time-wrap input[type="time"]{display:block; width:100%; max-width:100%; padding:9px 10px; border:none; border-radius:0; background:transparent; box-sizing:border-box; -webkit-appearance:none; appearance:none;}
.field textarea{resize:vertical; line-height:1.6;}
.field-row{display:flex; gap:8px;}
.field-row .field{flex:1;}
.date-row{display:flex; align-items:center; gap:8px;}
.date-row input{flex:1;}
.dow-badge{font-size:14px; color:var(--muted); min-width:26px; font-weight:600;}
.bpm-row{display:flex; gap:6px;}
.bpm-row input{flex:1;}
.dur-row{display:flex; align-items:center; gap:6px;}
.dur-row select{flex:0 0 auto; padding:9px 8px; width:auto; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:15px;}
.dur-sep{font-size:13px; color:var(--muted);}
.form-actions{display:flex; gap:8px; margin-top:4px;}

.section-title{font-size:13px; font-weight:700; color:var(--muted); margin:20px 0 8px; letter-spacing:.03em;}

.totals-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:16px;}
.totals-row{display:flex; justify-content:space-between; align-items:baseline; padding:3px 0;}
.totals-label{font-size:12px; color:var(--muted);}
.totals-value{font-size:15px; font-weight:700;}
.totals-row-main .totals-label{font-weight:700; color:var(--text); font-size:13px;}
.totals-row-main .totals-value{font-size:20px; color:var(--accent);}
.totals-head{display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:30px;}
.totals-head .totals-label{font-weight:700; color:var(--text); font-size:13px;}
.totals-head .totals-value{font-size:20px; font-weight:700; color:var(--accent);}
.totals-mini-timer{display:flex; align-items:center; justify-content:center; gap:8px; padding:0 14px 12px; margin-top:-4px; font-size:12px; color:var(--muted);}
.totals-mini-timer .timer-display{font-size:20px;}
.fold-body > .timer-start-btn:first-child, .fold-body > .timer-row:first-child{margin-top:0;}
.totals-row-sub{margin-top:6px; padding-top:8px; border-top:1px dashed var(--border);}
.totals-compare{font-size:12px; text-align:right; margin-top:2px; font-weight:600;}
.totals-compare.over{color:var(--danger);}
.totals-compare.under{color:var(--accent);}
.totals-compare.even{color:var(--muted);}
.timer-start-btn{display:block; width:100%; margin-top:10px; padding:9px 12px; text-align:center;}
.timer-row{display:flex; flex-direction:column; align-items:center; gap:8px; margin-top:10px; padding:12px 10px; border-radius:8px; background:var(--surface2); border:1px solid var(--border);}
.timer-main{display:flex; flex-direction:column; align-items:center; gap:2px;}
.timer-sub{display:flex; align-items:center; gap:6px; min-height:18px;}
.timer-row .timer-display{font-size:36px; line-height:1.1;}
.timer-display{font-size:22px; font-weight:700; letter-spacing:.02em; color:var(--accent);}
.timer-display.timer-over{color:var(--danger);}
.timer-badge{display:inline-block; padding:1px 7px; border-radius:999px; background:var(--accent); color:var(--accent-text); font-size:10px; font-weight:700;}
.timer-controls{display:flex; gap:6px; justify-content:center;}
.timer-controls .btn{padding:7px 12px; font-size:13px;}

.setlist-item{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:8px; overflow:hidden;}
.setlist-row1{display:flex; align-items:center; gap:8px; padding:10px 12px 6px;}
.setlist-num{font-size:16px; color:var(--accent); font-weight:700; min-width:20px; flex-shrink:0;}
.setlist-name-btn{flex:1; text-align:left; background:none; border:none; color:var(--text); font-size:16px; font-weight:700; padding:0; overflow-wrap:anywhere; cursor:pointer;}
.setlist-name-btn .chev{color:var(--muted); font-weight:400; margin-left:2px;}
.metro-btn{flex-shrink:0; width:30px; height:30px; border-radius:50%; border:1px solid var(--border); background:var(--surface2); font-size:14px; cursor:pointer; color:var(--text); display:flex; align-items:center; justify-content:center;}
.metro-btn.playing{background:var(--accent); border-color:var(--accent); color:var(--accent-text);}
.setlist-row2{display:flex; align-items:center; gap:5px; padding:0 12px 10px; flex-wrap:nowrap; min-width:0;}
.setlist-row2 > *{flex-shrink:0;}
.setlist-row2 .rhythm-tag{flex-shrink:1; min-width:2.4em; overflow:hidden; text-overflow:ellipsis;}
.setlist-row2{gap:4px;}
.setlist-row2 .bpm-chip{height:auto; padding:2px 8px; gap:4px; line-height:18px;}
.setlist-row2 .bpm-chip span{font-size:12px;}
.setlist-row2 .bpm-chip small{font-size:9px; font-weight:600;}
.setlist-row2 .bpm-chip svg{width:12px; height:12px;}
.setlist-row2 .ov-master{margin-left:0;}
@media (max-width:374px){ .setlist-row2 .bpm-chip small{display:none;} }
.mini-label{font-size:10px; color:var(--muted);}
.mini-input{width:46px; padding:5px 4px; text-align:center; border-radius:6px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:13px;}
select.mini-input{width:64px; padding:5px 2px;}
.setlist-dur{font-size:12px; color:var(--muted);}
.dur-select{flex-shrink:0; font-size:16px; font-weight:700; color:var(--text); background:transparent; border:none; border-bottom:1px dashed var(--border); border-radius:0; padding:0 2px; -webkit-appearance:none; appearance:none; text-align:right; cursor:pointer;}
.setlist-item.is-other .dur-select{color:var(--muted); font-size:14px;}
.setlist-item{position:relative;}
.swipe-bg{position:absolute; top:0; right:0; bottom:0; width:88px; display:flex; background:var(--danger);}
.swipe-del{flex:1; border:none; background:none; color:#fff; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;}
.swipe-face{position:relative; background:inherit; transition:transform .18s ease; touch-action:pan-y;}
.ov{color:var(--accent);}
.ov-master{font-size:11px; color:var(--muted); font-weight:400; margin-left:4px; white-space:nowrap;}
.ov-hint{font-size:12px; color:var(--muted); margin-bottom:8px;}
.st-save-note{margin-left:8px; font-size:11px; font-weight:700; color:var(--accent);}
.se-opt-list{display:flex; flex-direction:column; gap:4px;}
.se-opt-row{display:flex; align-items:center; gap:4px; padding:4px 4px 4px 10px; border:1px solid var(--border); border-radius:8px; background:var(--surface2);}
.se-opt-name{flex:1; min-width:0; font-size:14px; overflow-wrap:anywhere;}
.se-opt-btn{flex-shrink:0; width:34px; height:34px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:15px; cursor:pointer; touch-action:manipulation;}
.se-opt-btn:disabled{opacity:.35;}
.se-opt-btn.del{color:var(--danger);}
.se-opt-add{display:flex; gap:6px; margin-top:6px;}
.se-opt-add input{flex:1; min-width:0;}
.se-opt-add .btn{flex-shrink:0;}
.se-opt-reset{margin-top:6px; border:none; background:none; color:var(--muted); font-size:12px; text-decoration:underline; cursor:pointer; padding:4px 0;}
.field-row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
.ov-field{display:flex; gap:4px; align-items:center;}
.ov-field > :first-child{flex:1; min-width:0;}
.ov-reset{flex-shrink:0; width:30px; height:34px; padding:0; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--muted); font-size:14px; cursor:pointer;}
.ee-actions{display:flex; gap:10px; margin-top:14px;}
.ee-actions .btn{flex:1; padding:13px 10px; font-size:15px; text-align:center;}
.live-stage-min{display:inline-block; margin-left:8px; padding:0 8px; line-height:18px; vertical-align:middle; border-radius:999px; background:var(--surface2); border:1px solid var(--border); font-size:12px; font-weight:700; color:var(--accent);}
.ov-foot{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px;}
.ov-foot .btn{padding:6px 12px; font-size:13px;}
.ov-master-line{font-size:12px; color:var(--muted);}
.dur-label{flex-shrink:0; font-size:16px; font-weight:700; color:var(--text); padding:0 2px;}
.setlist-item.is-other .dur-label{color:var(--muted); font-size:14px;}
.key-chip{display:inline-flex; align-items:center; gap:3px; padding:2px 8px; border-radius:999px; border:1px solid var(--border); background:var(--surface2); font-size:12px; line-height:18px; white-space:nowrap;}
.key-chip small{line-height:1; font-size:9px; font-weight:600; color:var(--muted); letter-spacing:.02em;}
.key-chip b{font-weight:700;}
.key-chip.ov b{color:var(--accent);}
.key-chip .ov-master{margin-left:2px;}
.key-label{font-size:14px; font-weight:600; color:var(--text); min-width:28px; text-align:center;}
.detail-edit .field:last-child{margin-bottom:0;}
.setlist-item.is-other .setlist-name-btn{font-size:14px;}
.num-toggle{padding:6px 10px; border-radius:999px; border:1px solid var(--border); background:none; color:var(--muted); font-size:12px; font-weight:600; cursor:pointer;}
.num-toggle.on{background:var(--accent); border-color:var(--accent); color:var(--accent-text);}
.reorder{display:flex; gap:6px; margin-left:auto;}
.reorder button{width:34px; height:34px; padding:0; font-size:16px; line-height:1; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center;}
.reorder button:disabled{opacity:.35; cursor:default;}
.row-del{flex-shrink:0; width:34px; height:34px; padding:0; margin-left:auto; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--danger); font-size:15px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
.reorder + .row-del{margin-left:0;}
.stock-total{display:flex; justify-content:space-between; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:10px 14px; margin-bottom:10px;}
.stock-total .totals-label{font-weight:700; color:var(--text); font-size:13px;}
.stock-total .totals-value{font-size:20px; font-weight:700; color:var(--accent);}

.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}

.theme-row{display:flex; gap:6px;}
.theme-btn{flex:1; padding:9px 0; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:13px; font-weight:600; cursor:pointer;}
.theme-btn.active{background:var(--accent); border-color:var(--accent); color:var(--accent-text);}
.settings-btn-row{display:flex; gap:8px;}
.settings-btn-row .btn{flex:1; text-align:center;}
.btn-danger-block{width:100%; text-align:center; border:1px solid var(--danger); color:var(--danger); background:none; padding:11px; border-radius:var(--radius); font-weight:700; font-size:14px; cursor:pointer;}

.modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:24px;}
.modal-box{background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius); padding:18px; max-width:360px; width:100%;}
.modal-message{font-size:14px; line-height:1.7; white-space:pre-wrap; margin-bottom:16px; color:var(--text);}
.modal-actions{display:flex; gap:8px; justify-content:flex-end;}
.bulk-ex{display:inline-block; margin:2px 6px 0 0; padding:0 6px; border-radius:6px; background:var(--surface); border:1px solid var(--border); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11.5px; color:var(--text);}
.bulk-tips{margin:0 0 8px;}
.bulk-tips summary{font-size:12px; font-weight:700; color:var(--accent); cursor:pointer; padding:2px 0; width:max-content;}
.bulk-tips .hint{margin-top:4px;}
.bulk-excel{margin-top:12px; padding-top:10px; border-top:1px dashed var(--border);}
.bulk-excel .settings-btn-row .btn{padding:9px 8px; font-size:13px; white-space:nowrap;}
.bulk-sub{font-size:14px; font-weight:700; margin-bottom:4px;}
.app-version{margin:20px 0 8px; text-align:center; font-size:12px; line-height:1.7; color:var(--muted);}
.app-version a{color:var(--muted);}
.newver-bar{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--accent); border-radius:var(--radius); padding:10px 10px 10px 14px; margin-bottom:12px; font-size:13px; font-weight:700;}

<div id="app">
  <header>
    <h1>プレイヤーズセットリスト</h1>
    <nav>
      <button id="tab-songs" class="active">曲マスタ</button>
      <button id="tab-lives">イベント</button>
      <button id="tab-settings">設定</button>
    </nav>
  </header>
  <main id="main"></main>

<script>
const store = {
  get(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } },
  set(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
};
function applyTheme(val){
  if(val==='light') document.documentElement.setAttribute('data-theme','light');
  else if(val==='dark') document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.removeAttribute('data-theme');
}
applyTheme(store.get('setlist_theme','auto'));

let hadSavedData = false;
try{ hadSavedData = !!localStorage.getItem('setlist_songs') || !!localStorage.getItem('setlist_lives'); }catch(e){}
let songs = store.get('setlist_songs', []);
let lives = store.get('setlist_lives', []);

// migrate old format (songIds array) to setlist array with per-live bpm/key
let migrated = false;
lives.forEach(l=>{
  if(!l.setlist){
    l.setlist = (l.songIds||[]).map(id=>{
      const s = songs.find(x=>x.id===id);
      return {type:'song', songId:id, bpm: s?s.bpm:'', key: s?s.key:''};
    });
    delete l.songIds;
    migrated = true;
  }
  l.setlist.forEach(e => { if(!e.type){ e.type='song'; migrated=true; } });
});

function saveSongs(){ store.set('setlist_songs', songs); }
function saveLives(){ store.set('setlist_lives', lives); }
if(migrated) saveLives();

let songsMigrated = false;
songs.forEach((s,i) => { if(s.updatedAt===undefined){ s.updatedAt = i; songsMigrated = true; } });
if(songsMigrated) saveSongs();

let livesMigrated = false;
lives.forEach((l,i) => { if(l.updatedAt===undefined){ l.updatedAt = i; livesMigrated = true; } });
if(livesMigrated) saveLives();

function parseDur(str){
  if(!str) return 0;
  const m = String(str).match(/^(\d+):([0-5]?\d)$/);
  if(m) return (+m[1])*60 + (+m[2]);
  const n = parseFloat(str);
  return isNaN(n) ? 0 : Math.round(n*60);
}
function fmtDur(sec){ sec = Math.max(0, Math.round(sec)); return Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0'); }

  if(!start || !end) return null;
  const [sh,sm] = start.split(':').map(Number);

  return ((eh*60+em) - (sh*60+sm) + 1440) % 1440;
}

let tapTimes = [], tapTarget = null;
window.onTap = (inputId) => {
  const now = Date.now();
  if(tapTarget !== inputId || (tapTimes.length && now - tapTimes[tapTimes.length-1] > 2000)){ tapTimes=[]; tapTarget=inputId; }
  tapTimes.push(now);
  if(tapTimes.length>8) tapTimes.shift();
  if(tapTimes.length>=2){
    const intervals=[]; for(let i=1;i<tapTimes.length;i++) intervals.push(tapTimes[i]-tapTimes[i-1]);
    const avg = intervals.reduce((a,b)=>a+b,0)/intervals.length;
    const bpm = Math.round(60000/avg);
    const el = document.getElementById(inputId);
    if(el){ el.value = bpm; el.dispatchEvent(new Event('change')); }
  }
};

// ---- ハンドルでのドラッグ並べ替え（タッチ・マウス共通のポインター操作）----
let drag = null;
window.startDrag = (e, list) => {
  if(drag) return;
  const row = e.target.closest('.setlist-item');
  if(!row) return;
  e.preventDefault();
  const handle = e.currentTarget || e.target;
  try{ handle.setPointerCapture(e.pointerId); }catch(_){}
  drag = {list, row, handle, pointerId:e.pointerId, startPageY:e.clientY + window.scrollY, lastClientY:e.clientY, raf:0};
  row.classList.add('dragging');
  document.body.classList.add('is-dragging');
  document.addEventListener('pointermove', onDragMove, {passive:false});
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
  drag.raf = requestAnimationFrame(dragAutoScroll);
};
function dragRows(){ return [...document.querySelectorAll(`.setlist-item[data-drag-list="${drag.list}"]`)]; }
function onDragMove(e){
  if(!drag || e.pointerId!==drag.pointerId) return;
  if(e.cancelable) e.preventDefault();
  drag.lastClientY = e.clientY;
  updateDragPosition();
}
function updateDragPosition(){
  const row = drag.row;
  const dy = drag.lastClientY + window.scrollY - drag.startPageY;
  row.style.transform = `translateY(${dy}px)`;
  const rect = row.getBoundingClientRect();
  const center = rect.top + rect.height/2;
  const rows = dragRows();
  const idx = rows.indexOf(row);
  const prev = rows[idx-1], next = rows[idx+1];
  let moved = false;
  const before = row.offsetTop;
  if(prev){ const r = prev.getBoundingClientRect(); if(center < r.top + r.height/2){ row.parentNode.insertBefore(prev, row.nextSibling); moved = true; } }
  if(!moved && next){ const r = next.getBoundingClientRect(); if(center > r.top + r.height/2){ row.parentNode.insertBefore(next, row); moved = true; } }
  if(moved){
    // 並びが変わった分だけ起点をずらし、指の下にカードが残るようにする
    drag.startPageY += row.offsetTop - before;
    row.style.transform = `translateY(${drag.lastClientY + window.scrollY - drag.startPageY}px)`;
  }
}
// 画面の上下の端に近づいたら自動でスクロール
function dragAutoScroll(){
  if(!drag) return;
  const edge = 70, y = drag.lastClientY, h = window.innerHeight;
  let v = 0;
  if(y < edge) v = -Math.ceil((edge - y)/6);
  else if(y > h - edge) v = Math.ceil((y - (h - edge))/6);
  if(v){ window.scrollBy(0, v); updateDragPosition(); }
  drag.raf = requestAnimationFrame(dragAutoScroll);
}
function endDrag(e){
  if(!drag || (e && e.pointerId!==drag.pointerId)) return;
  const {list, row, handle} = drag;
  cancelAnimationFrame(drag.raf);
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', endDrag);
  document.removeEventListener('pointercancel', endDrag);
  row.style.transform = '';
  row.classList.remove('dragging');
  document.body.classList.remove('is-dragging');
  const keys = dragRows().map(r => r.dataset.key);
  drag = null;
  applyDragOrder(list, keys);
}
// 画面に見えている並びを保存する。見えていない項目（隠した曲以外）は元の位置のまま
function applyDragOrder(list, keys){
  if(list==='stock'){
    // 見えている曲だけを、元いた位置（スロット）に並べ直して入れる。非表示の曲は動かさない
    const byId = new Map(songs.map((s,i) => [s.id, i]));
    const idxs = keys.map(k => byId.get(k)).filter(i => i!==undefined);
    const slots = [...idxs].sort((a,b)=>a-b);
    const next = songs.slice();
    slots.forEach((slot, k) => { next[slot] = songs[idxs[k]]; });
    if(next.some((s,k)=>s!==songs[k])){ songs = next; saveSongs(); }
  } else {
    const live = lives.find(l=>l.id===liveEditId);
    if(!live) return;
    const idxs = keys.map(Number);
    const slots = [...idxs].sort((a,b)=>a-b);
    const moved = idxs.map(k => live.setlist[k]);
    const next = live.setlist.slice();
    slots.forEach((slot, k) => { next[slot] = moved[k]; });
    if(next.some((e,k)=>e!==live.setlist[k])){
      live.setlist = next;
      live.updatedAt = Date.now();
      entryExpandedIdx = null;
      saveLives();
    }
  }
  render();
}

// 拍の発音は Web Audio の時刻で先読みして予約する（setInterval だけより拍がぶれにくい）
let metro = {playing:false, timer:null, nextTime:0, beat:0};
let metroPanel = null;  // {source:'stock'|'live', songId, liveId, entry, name, bpm}
let metroTaps = [];
function scheduleClick(time, accent){
  const ctx = getCtx();
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.frequency.value = accent ? 1600 : 1000;
  gain.gain.setValueAtTime(0.0001, time);
  gain.gain.exponentialRampToValueAtTime(accent ? 0.6 : 0.4, time+0.002);
  gain.gain.exponentialRampToValueAtTime(0.0001, time+0.05);
  osc.connect(gain).connect(ctx.destination);
  osc.start(time); osc.stop(time+0.06);
}
function flashBeat(n, delaySec){
  setTimeout(() => {
    const dots = document.querySelectorAll('#metro-sheet .metro-beats span');
    dots.forEach((d,k) => d.classList.toggle('on', k===n));
  }, Math.max(0, delaySec*1000));
}
function metroTick(){
  if(!metro.playing || !metroPanel) return;
  const ctx = getCtx();
  while(metro.nextTime < ctx.currentTime + 0.12){
    scheduleClick(metro.nextTime, metro.beat%4===0);
    flashBeat(metro.beat%4, metro.nextTime - ctx.currentTime);
    metro.nextTime += 60 / metroPanel.bpm;
    metro.beat++;
  }
}
function startPlayback(){
  const ctx = getCtx();
  metro.playing = true; metro.beat = 0; metro.nextTime = ctx.currentTime + 0.06;
  clearInterval(metro.timer);
  metro.timer = setInterval(metroTick, 25);
  metroTick();
}
function stopPlayback(){
  clearInterval(metro.timer); metro.timer = null; metro.playing = false;
  document.querySelectorAll('#metro-sheet .metro-beats span').forEach(d => d.classList.remove('on'));
}
// パネルを閉じて止める（画面の移動時などに呼ばれる）
function stopMetro(){
  stopPlayback();

  if(el) el.remove();

function clampBpm(v){ v = Math.round(Number(v)||120); return Math.min(300, Math.max(30, v)); }
// 曲マスタの曲（songId）またはイベントの曲（liveId + entry）のメトロノームを開く
window.openMetro = (source, key) => {
  let panel = null;
  if(source==='stock'){
    const s = songs.find(x=>x.id===key); if(!s) return;
    panel = {source, songId:s.id, name:s.name, bpm:clampBpm(s.bpm||120)};
  } else {
    const live = lives.find(l=>l.id===liveEditId); if(!live) return;
    const entry = live.setlist[key]; if(!entry) return;
    const s = songs.find(x=>x.id===entry.songId);
    panel = {source, liveId:live.id, entry, name:s?s.name:'', bpm:clampBpm(effVal(entry, s, 'bpm') || 120)};
  }
  const same = metroPanel && metroPanel.source===panel.source && (panel.source==='stock' ? metroPanel.songId===panel.songId : metroPanel.entry===panel.entry);
  if(same) return;
  stopPlayback();
  metroPanel = panel; metroTaps = [];
  renderMetroSheet();
  render();
};

function stockOrderIds(){

}
function metroLive(){ return metroPanel && metroPanel.source==='live' ? lives.find(l=>l.id===metroPanel.liveId) : null; }
function metroSeq(){
  const p = metroPanel; if(!p) return [];
  if(p.source==='stock') return stockOrderIds();

  return live.setlist.map((e,i) => e.type==='other' ? null : i).filter(i => i!==null);
}
function metroCurKey(){
  const p = metroPanel; if(!p) return null;

}
function metroSongAt(k){
  if(!metroPanel) return null;
  if(metroPanel.source==='stock') return songs.find(x=>x.id===k) || null;
  const live = metroLive(); const e = live && live.setlist[k];

window.metroNav = d => {

// イベントのタイマーを動かした後は、パネルにも残り時間を出す（ライブ中に全体の経過を見ながらテンポを取れるように）
function metroTimerHtml(p){
  if(!p || p.source!=='live' || !timer.touched || timer.liveId!==p.liveId) return '';
  const rem = timer.running ? Math.round((timer.endAt-Date.now())/1000) : timer.remaining;
  return `<span class="metro-timer-label">残り</span><span class="metro-timer-val mono${rem<0?' over':''}" id="metro-timer-val">${fmtSignedDur(rem)}</span><span class="metro-timer-state">${timer.running?'計測中':'一時停止中'}</span>`;
}
// パネルは開いた時だけ組み立てる。以後は変わった部分だけ書き換える（ボタンを作り直さないので連打できる）
function renderMetroSheet(){
  const p = metroPanel; if(!p) return;
  const s = p.source==='stock' ? songs.find(x=>x.id===p.songId) : (metroLive() && metroLive().setlist.includes(p.entry) ? songs.find(x=>x.id===p.entry.songId) : null);
  if(!s){ stopMetro(); return; }
  const e = p.source==='live' ? p.entry : null;
  const key = e ? effVal(e, s, 'key') : songVal(s, 'key');
  const seq = metroSeq(); const pos = seq.indexOf(metroCurKey());
  const prevK = pos > 0 ? seq[pos-1] : undefined;
  const nextK = pos >= 0 && pos < seq.length-1 ? seq[pos+1] : undefined;
  const navName = k => { const x = k===undefined ? null : metroSongAt(k); return x ? esc(x.name) : '—'; };
  const parts = {
    'metro-title': `${METRO_ICON_SVG}<span>${esc(s.name||'メトロノーム')}</span>${pos>=0 ? `<span class="metro-pos mono">${pos+1}/${seq.length}</span>` : ''}`,

    'metro-nav': `<button type="button" onclick="metroNav(-1)" ${prevK===undefined?'disabled':''}>◀ 前の曲<small>${navName(prevK)}</small></button>

  };
  let el = document.getElementById('metro-sheet');
  if(el && el.querySelector('.metro-inner')){
    Object.keys(parts).forEach(id => { const n = document.getElementById(id); if(n && n.innerHTML !== parts[id]) n.innerHTML = parts[id]; });
    const val = document.getElementById('metro-bpm-val'); if(val && val.textContent !== String(p.bpm)) val.textContent = p.bpm;
    const sl = document.getElementById('metro-slider'); if(sl && document.activeElement !== sl && String(sl.value) !== String(p.bpm)) sl.value = p.bpm;
    const pb = document.getElementById('metro-play'); const lbl = metro.playing ? '■ 停止' : '▶ 再生'; if(pb && pb.textContent !== lbl) pb.textContent = lbl;
    const n = document.getElementById('metro-info'); if(n && el.dataset.song !== String(pos)+s.id){ n.scrollTop = 0; }

  if(!el){

      <button type="button" class="metro-close" onclick="closeMetro()" aria-label="閉じる">×</button>
    </div>
    <div class="metro-timer" id="metro-timer">${parts['metro-timer']}</div>
    <div class="metro-info" id="metro-info">${parts['metro-info']}</div>
    <div class="metro-beats" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <div class="metro-bpm-row">
      <button type="button" class="metro-step" onclick="stepMetroBpm(-1)" aria-label="テンポを1下げる">−</button>
      <div class="metro-bpm"><span id="metro-bpm-val" class="mono">${p.bpm}</span><small>BPM</small></div>
      <button type="button" class="metro-step" onclick="stepMetroBpm(1)" aria-label="テンポを1上げる">＋</button>
    </div>
    <input type="range" id="metro-slider" min="30" max="300" step="1" value="${p.bpm}" aria-label="テンポ"
      oninput="setMetroBpm(this.value, false)" onchange="setMetroBpm(this.value, true)">
    <div class="metro-actions">
      <button type="button" class="btn metro-tap" onclick="tapMetro()">TAP</button>
      <button type="button" class="btn btn-accent metro-play" id="metro-play" onclick="toggleMetroPlay()">${metro.playing?'■ 停止':'▶ 再生'}</button>
    </div>

}
window.closeMetro = () => { stopMetro(); render(); };
window.toggleMetroPlay = () => {
  if(!metroPanel) return;
  if(metro.playing) stopPlayback(); else startPlayback();
  const b = document.getElementById('metro-play'); if(b) b.textContent = metro.playing ? '■ 停止' : '▶ 再生';
  render();
};
// テンポを変える。save=true のときだけ曲のBPMとして保存する（スライダーを動かしている最中は保存しない）
window.setMetroBpm = (v, save) => {
  if(!metroPanel) return;
  metroPanel.bpm = clampBpm(v);
  const val = document.getElementById('metro-bpm-val'); if(val) val.textContent = metroPanel.bpm;
  const sl = document.getElementById('metro-slider'); if(sl && String(sl.value)!==String(metroPanel.bpm)) sl.value = metroPanel.bpm;
  if(save) saveMetroBpm();
};
window.stepMetroBpm = (d) => setMetroBpm(metroPanel.bpm + d, true);
window.tapMetro = () => {
  const now = Date.now();
  if(metroTaps.length && now - metroTaps[metroTaps.length-1] > 2000) metroTaps = [];
  metroTaps.push(now);
  if(metroTaps.length > 8) metroTaps.shift();
  if(metroTaps.length >= 2){
    const iv = []; for(let k=1;k<metroTaps.length;k++) iv.push(metroTaps[k]-metroTaps[k-1]);
    setMetroBpm(60000 / (iv.reduce((a,b)=>a+b,0)/iv.length), true);
  }
};
function saveMetroBpm(){
  const p = metroPanel; if(!p) return;
  const v = String(p.bpm);
  if(p.source==='stock'){
    const s = songs.find(x=>x.id===p.songId); if(!s) return;
    s.bpm = v; s.updatedAt = Date.now(); saveSongs();
  } else {
    const live = lives.find(l=>l.id===p.liveId); if(!live) return;
    const sp = songs.find(x=>x.id===p.entry.songId);
    if(String(v)===songVal(sp,'bpm')) delete p.entry.bpm; else p.entry.bpm = v;
    live.updatedAt = Date.now(); saveLives();
  }
  if(!drag) render();
}
// 一覧のBPM欄を直接書き換えたとき、開いているパネルにも反映する
function syncMetroFromRow(source, key, value){
  if(!metroPanel || metroPanel.source!==source) return;
  if(source==='stock' ? metroPanel.songId!==key : metroPanel.entry!==key) return;
  setMetroBpm(value, false);
}

// countdown timer (全体合計用)
function liveTotalSeconds(live){ return live.setlist.reduce((s,e)=>s+entryDuration(e),0); }
function fmtSignedDur(sec){ return (sec<0?'-':'') + fmtDur(Math.abs(sec)); }
let timer = {remaining:0, running:false, touched:false, endAt:0, intervalId:null, liveId:null};
function stopTimerInterval(){ if(timer.intervalId){ clearInterval(timer.intervalId); timer.intervalId=null; } }
function resetTimerState(){ stopTimerInterval(); timer = {remaining:0, running:false, touched:false, endAt:0, intervalId:null, liveId:null}; }
function tickTimer(){
  if(!timer.running) return;
  const rem = Math.round((timer.endAt-Date.now())/1000);
  const el = document.getElementById('timer-display');
  if(el){ el.textContent = fmtSignedDur(rem); el.classList.toggle('timer-over', rem<0); }
  const mt = document.getElementById('metro-timer-val');
  if(mt){ mt.textContent = fmtSignedDur(rem); mt.classList.toggle('over', rem<0); }
}
window.timerStart = () => {
  if(timer.running) return;
  timer.running = true;
  timer.touched = true;
  timer.endAt = Date.now() + timer.remaining*1000;
  stopTimerInterval();
  timer.intervalId = setInterval(tickTimer, 1000);
  render();
};
window.timerPause = () => {
  if(!timer.running) return;
  timer.remaining = Math.round((timer.endAt-Date.now())/1000);
  timer.running = false;
  stopTimerInterval();
  render();
};
window.timerReset = () => {
  const live = lives.find(l=>l.id===liveEditId);
  stopTimerInterval();
  timer.running = false;
  timer.touched = false;
  timer.remaining = live ? liveTotalSeconds(live) : 0;
  render();
};

// 公開ページのサンドボックスではネイティブの confirm()/alert() が動かないため、自前で用意する
function confirmAction(message, onOk, okLabel){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-box">
    <div class="modal-message">${esc(message)}</div>
    <div class="modal-actions">
      <button type="button" class="btn" id="modal-cancel">キャンセル</button>
      <button type="button" class="btn btn-accent" id="modal-ok">${esc(okLabel||'OK')}</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  const cleanup = () => overlay.remove();
  overlay.querySelector('#modal-cancel').onclick = cleanup;
  overlay.querySelector('#modal-ok').onclick = () => { cleanup(); onOk(); };
  overlay.addEventListener('click', e => { if(e.target===overlay) cleanup(); });
}
function showToast(message){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = message;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

function isLiveEmpty(l){
  return !!l && !l.venue && !l.place && !l.artist && !l.date && (!l.setlist || l.setlist.length===0);
}
// 開いているイベント情報フォームの入力内容を反映する（変更があれば true）
function applyLiveForm(){
  const live = lives.find(l=>l.id===liveEditId);
  const dateEl = document.getElementById('live-date');
  if(!live || !dateEl) return false;
  const next = {
    date: dateEl.value,
    venue: document.getElementById('live-venue').value.trim(),
    place: document.getElementById('live-place').value.trim(),
    artist: document.getElementById('live-artist').value.trim(),
    startTime: document.getElementById('live-start-time').value,
    endTime: document.getElementById('live-end-time').value,
    memo: document.getElementById('live-memo').value.trim()
  };
  const changed = Object.keys(next).some(k => (live[k]||'') !== next[k]);
  Object.assign(live, next);
  if(changed){ live.updatedAt = Date.now(); saveLives(); }
  return changed;
}
function cleanupEmptyLive(){
  if(!liveEditId) return;
  applyLiveForm();
  const idx = lives.findIndex(l=>l.id===liveEditId);
  if(idx<0) return;
  if(isLiveEmpty(lives[idx])){ lives.splice(idx,1); saveLives(); }
}

// ---- コードの移調・ディグリー表記（表示だけ。保存されたコードは書き換えない） ----
const NOTE_PC = {C:0, D:2, E:4, F:5, G:7, A:9, B:11};
const SHARP_N = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT_N  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const ROMAN   = ['I','♭II','II','♭III','III','IV','♭V','V','♭VI','VI','♭VII','VII'];
function accOf(a){ return /[#♯]/.test(a) ? 1 : /[b♭]/.test(a) ? -1 : 0; }
function parseKey(k){
  const m = /^([A-G])([#♯b♭]?)(m?)$/.exec(String(k || '').trim()); if(!m) return null;
  return {pc: (NOTE_PC[m[1]] + accOf(m[2]) + 12) % 12, minor: !!m[3]};
}
function keyName(pc, minor){ return SHARP_N[((pc % 12) + 12) % 12] + (minor ? 'm' : ''); }
function keyPrefersFlat(k){ if(!k) return null; return k.minor ? [2,7,0,5,10,3].includes(k.pc) : [5,10,3,8,1].includes(k.pc); }
function normShift(n){ n = ((n % 12) + 12) % 12; return n > 6 ? n - 12 : n; }
// コードらしい書き方だけを対象にする（C9, Fsus4, G/A, B♭, F♯5, Am7(♭5) など）。「Aメロ」「N.C.」「Dr.」などは触らない
const CHORD_RE = /(^|[^A-Za-z0-9#♯♭.])([A-G])([#♯b♭]?)((?:maj|min|dim|aug|sus|add|omit|alt|M|m|ø|°|\+|[0-9]|[#♯b♭](?=[0-9])|\((?=[^)]*\))|\))*)(?:\/([A-G])([#♯b♭]?))?(?![A-Za-z0-9])/g;
function stChordDisp(text){
  const c = stCC; if(!c || !text) return text || '';
  if(c.mode!=='degree' && !c.shift) return text;
  const uni = /[♭♯]/.test(text);
  const spell = (pc, origAcc) => {
    const flat = c.flat!==null ? c.flat : (origAcc < 0);
    let n = (flat ? FLAT_N : SHARP_N)[((pc % 12) + 12) % 12];
    if(uni) n = n.replace('b', '♭').replace('#', '♯');
    return n;
  };
  return text.replace(CHORD_RE, (all, pre, root, acc, qual, broot, bacc, off, str) => {
    const after = str.charAt(off + all.length);
    if(!qual && !broot && /[぀-ヿ一-鿿]/.test(after)) return all;  // 「Aメロ」など
    const pc = (NOTE_PC[root] + accOf(acc) + 12) % 12;
    const bpc = broot ? (NOTE_PC[broot] + accOf(bacc) + 12) % 12 : null;
    if(c.mode==='degree'){
      const d = p => ROMAN[((p - c.tonic) % 12 + 12) % 12];
      return pre + d(pc) + qual + (broot ? '/' + d(bpc) : '');
    }
    return pre + spell(pc + c.shift, accOf(acc)) + qual + (broot ? '/' + spell(bpc + c.shift, accOf(bacc)) : '');
  });
}
// 今の曲・イベントから、コード表示の設定を決める
function stChordCtx(s, e){
  const mk = parseKey(songVal(s, 'key'));
  const ek = parseKey(e ? effVal(e, s, 'key') : songVal(s, 'key'));
  let shift = stTrans, target = mk;
  if(e && mk && ek){ shift = normShift(ek.pc - mk.pc + stTrans); target = ek; }
  if(mk && stTrans && !(e && ek)) target = {pc: (mk.pc + stTrans + 12) % 12, minor: mk.minor};
  if(e && mk && ek && stTrans) target = {pc: (ek.pc + stTrans + 12) % 12, minor: ek.minor};
  const canDegree = !!mk;
  const mode = stChordMode==='degree' && canDegree ? 'degree' : 'chord';
  const tonic = mk ? (mk.minor && stDegreeMinor==='relative' ? (mk.pc + 3) % 12 : mk.pc) : 0;
  return {mode, shift: normShift(shift), flat: keyPrefersFlat(target), mk, ek, target, tonic, canDegree};
}
function stChordBarHtml(s, e, c){
  const seg = `<div class="pos-seg st-cmode"><button type="button" class="${c.mode==='chord'?'on':''}" onclick="setChordMode('chord')">コード</button><button type="button" class="${c.mode==='degree'?'on':''}" onclick="setChordMode('degree')" ${c.canDegree?'':'disabled title="キーが未設定のため使えません"'}>ディグリー</button></div>`;
  let tr = '';
  if(c.mode==='chord'){
    const lab = c.mk ? (c.shift ? `${keyName(c.mk.pc, c.mk.minor)} → ${keyName(c.target.pc, c.target.minor)}` : `${keyName(c.mk.pc, c.mk.minor)}（元のキー）`) : (c.shift ? `${c.shift>0?'+':''}${c.shift}（半音）` : '移調なし');
    tr = `<div class="st-trans"><span class="st-trans-lab">移調</span><button type="button" class="st-tbtn" onclick="stTranspose(-1)" aria-label="半音下げる">−</button><button type="button" class="st-tkey${c.shift?' on':''}" onclick="stTranspose(0)" title="元のキーに戻す">${esc(lab)}</button><button type="button" class="st-tbtn" onclick="stTranspose(1)" aria-label="半音上げる">＋</button></div>`;
  } else {
    tr = `<span class="st-trans-note">${esc(keyName(c.mk.pc, c.mk.minor))} を基準に表示${c.mk.minor ? (stDegreeMinor==='relative' ? '（同じ調号のメジャーから）' : '（マイナーの主音から）') : ''}</span>`;
  }
  return `<div class="st-chordbar">${seg}${tr}</div>`;
}
window.setChordMode = m => { stChordMode = m; store.set('setlist_chord_mode', m); render(); };
// −＋：イベントから開いていて曲マスタのキーがあるときは、このイベントのキーとして保存。それ以外は一時的な移調
window.stTranspose = d => {
  const s = stSong(), e = stEntry(); if(!s) return;
  const mk = parseKey(songVal(s, 'key'));
  if(e && mk){
    const live = stLive();
    if(d===0){ delete e.key; }
    else {
      const ek = parseKey(effVal(e, s, 'key')) || mk;
      const nk = keyName(ek.pc + d, ek.minor);
      if(nk===songVal(s, 'key')) delete e.key; else e.key = nk;
    }
    stTrans = 0;
    if(live){ live.updatedAt = Date.now(); saveLives(); }
  } else {
    stTrans = d===0 ? 0 : normShift(stTrans + d);
  }
  render();
};

// 構成表の取り込み（見出し行があれば列を自動で振り分け）
const ST_COLS = [['kimeBar',/キメ小節/],['kime',/キメ|ブレイク|kime/i],['times',/回数|times/i],['chord',/コード|chord/i],['vocal',/歌|vocal|lyric/i],['bars',/小節|バー|bars?|長さ/i],['name',/区間|セクション|section|パート|構成/i],['play',/演奏|play|note/i],['auto',/内容|メモ|備考|content/i]];
function stSplitRow(line){
  if(line.includes('|')) return line.split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, '|')).filter((c, i, a) => !(c==='' && (i===0 || i===a.length-1)));
  if(line.includes('\t')) return line.split('\t').map(c => c.trim());
  return (line.match(/^(.+?)\s+(\d+)\s*(?:小節|bars?)?\s*(.*)$/i) || []).slice(1);
}
const stCell = c => { const t = (c || '').replace(/<br\s*\/?>/gi, '\n').replace(/\*\*/g, '').trim(); return /^[—–\-ー−]+$/.test(t) ? '' : t; };
function stParseTable(text){
  const out = []; let map = null;
  for(const raw of String(text).split(/\r?\n/)){
    const line = raw.trim();
    if(!line || /^[|\s:\-–—]+$/.test(line)) continue;
    if(!line.includes('|') && !line.includes('\t') && (/^#{1,3}\s/.test(line) || /^[-*・]\s*[^:：]+[:：]/.test(line))) continue;  // 曲名・曲情報の行は読み飛ばす
    const cells = stSplitRow(line).map(stCell);
    if(cells.length < 2) continue;
    if(!cells.some(c => /\d/.test(c))){
      const m = cells.map(c => (ST_COLS.find(([, re]) => re.test(c)) || [null])[0]);
      if(m.filter(Boolean).length >= 2){ if(!m.includes('name')) m[0] = 'name'; map = m; continue; }
    }
    let name, barsCell, timesCell = '', kbCell = '';
    const f = {chord:'', vocal:'', play:'', kime:'', auto:''};
    if(map){
      const g = k => { const i = map.indexOf(k); return i>=0 ? cells[i] || '' : ''; };
      name = g('name'); barsCell = g('bars'); timesCell = g('times'); kbCell = g('kimeBar');
      for(const k in f) f[k] = map.map((m, i) => m===k ? cells[i] : '').filter(Boolean).join('\n');
    } else {
      const ni = cells.findIndex((c, i) => i>0 && /\d/.test(c));
      if(ni < 0) continue;
      name = cells[0]; barsCell = cells[ni];
      f.auto = cells.filter((_, i) => i!==0 && i!==ni).filter(Boolean).join(' / ');
    }
    if(!name) continue;
    const isRep = /[（(]\s*(繰り返し|repeat)\s*[）)]/i.test(name);
    const base = name.replace(/\s*[（(]\s*(繰り返し|repeat)\s*[）)]\s*/i, '').trim();
    const prev = out[out.length-1];
    if(isRep && prev && prev.name===base){ prev.times = stTimes(prev) + 1; continue; }
    const dm = (barsCell||'').match(/\d+/), tm = (timesCell||'').match(/\d+/), km = (kbCell||'').match(/\d+/);
    const sec = ST_SEC(base || name, dm ? +dm[0] : '', {times: tm ? +tm[0] : 1, kimeBar: km ? +km[0] : ''});
    sec.chord = f.chord; sec.vocal = f.vocal; sec.play = f.play; sec.kime = f.kime;
    if(f.auto){ if(/^[「『"“]/.test(f.auto)) sec.vocal = [sec.vocal, f.auto].filter(Boolean).join('\n'); else sec.play = [sec.play, f.auto].filter(Boolean).join('\n'); }
    if(barsCell && !/^\d+\s*(小節)?$/.test(barsCell)) sec.play = [sec.play, `小節数：${barsCell}`].filter(Boolean).join('\n');
    out.push(sec);
  }
  return out;
}
window.stDoPaste = () => {
  const s = stSong(); if(!s) return;
  const ta = document.getElementById('st-paste'), msg = document.getElementById('st-paste-msg');
  const secs = stParseTable(ta ? ta.value : '');
  if(!secs.length){ if(msg) msg.textContent = 'セクションが見つかりません。各行に「セクション名」と「小節数」が入っているか確認してください。'; return; }
  const apply = () => { stEnsure(s).sections = secs; stTouch(s); render(); showToast(`${secs.length}セクションを取り込みました`); };
  if(hasStruct(s)) confirmAction(`「${s.name}」の今の構成（${s.struct.sections.length}セクション）を、貼り付けた構成表で置き換えますか？`, apply, '置き換える');

function stToMarkdown(s, e){
  const cell = v => { const t = String(v ?? '').trim(); return t ? t.replace(/\|/g, '\\|').replace(/\r?\n/g, '<br>') : '—'; };
  const L = [`# ${s.name || '無題の曲'}`, ''];
  const val = f => stShow(e ? effVal(e, s, f) : songVal(s, f));
  const info = [['アーティスト', s.orig], ['キー', val('key')], ['BPM', val('bpm')], ['リズム', s.rhythm], ['はじめかた', val('start')], ['おわりかた', val('end')]].filter(([, v]) => v);
  if(info.length){ info.forEach(([k, v]) => L.push(`- ${k}: ${v}`)); L.push(''); }
  L.push('| 区間 | 小節数 | 回数 | キメ小節 | コード | 歌詞メモ | 演奏メモ | キメ |');
  L.push('|------|--------|------|----------|--------|----------|----------|------|');
  ((s.struct && s.struct.sections) || []).forEach(x => L.push(`| ${cell(x.name)} | ${cell(x.bars)} | ${cell(stTimes(x) > 1 ? stTimes(x) : '')} | ${cell(x.kimeBar)} | ${cell(x.chord)} | ${cell(x.vocal)} | ${cell(x.play)} | ${cell(x.kime)} |`));
  return L.join('\n') + '\n';
}
window.stExportMd = () => {

window.stSaveMd = async () => {
  const s = stSong(); if(!s) return;
  const name = String(s.name || '構成').replace(/[\\/:*?"<>|]/g, '_').slice(0, 60);
  try{ const d = await getDownloads(); await d.save({filename: `${name}_構成.md`, data: stToMarkdown(s, stEntry()), raw: true, type: 'text/markdown'}); }
  catch(e){ if(!e || e.code!=='declined') showToast('保存できませんでした。「書き出す」からコピーしてください。'); }
};

// ---- 構成画面のメトロノーム（曲のテンポで待機。−＋・TAPは一時的な変更で、曲には保存しない） ----
const stM = {bpm:120, on:false, sound:true, next:0, beat:0, timer:null, taps:[]};
function stSongBpm(){ const s = stSong(), e = stEntry(); const v = parseInt(s ? effVal(e, s, 'bpm') : '', 10); return v > 0 ? v : 120; }
function stSetBpm(v){
  stM.bpm = clampBpm(v);
  const box = document.getElementById('st-bpm'); if(!box) return;
  const sv = parseInt(stSong() ? effVal(stEntry(), stSong(), 'bpm') : '', 10);
  const changed = sv > 0 && sv !== stM.bpm;
  box.classList.toggle('changed', changed);
  box.querySelector('span').textContent = stM.bpm;
  box.querySelector('small').textContent = changed ? `↺ ${sv}` : (sv > 0 ? 'BPM' : 'BPM（仮）');
  box.setAttribute('aria-label', changed ? `曲のテンポ ${sv} に戻す` : 'テンポ');
}
function stTick(){
  if(!stM.on) return;
  const ctx = getCtx();
  while(stM.next < ctx.currentTime + 0.12){
    const b = stM.beat % 4;
    if(stM.sound) scheduleClick(stM.next, b===0);
    const delay = Math.max(0, (stM.next - ctx.currentTime) * 1000);
    setTimeout(() => { document.querySelectorAll('#st-dots i').forEach((d, k) => d.classList.toggle('on', stM.on && k<=b)); }, delay);
    stM.next += 60 / stM.bpm; stM.beat++;
  }
}
function stMetroStart(){
  const ctx = getCtx();
  // iPhone などは、タップの中で無音を一度鳴らしておくと音が出るようになる
  try{ const b = ctx.createBuffer(1, 1, 22050), src = ctx.createBufferSource(); src.buffer = b; src.connect(ctx.destination); src.start(0); }catch(e){}
  stM.on = true; stM.beat = 0;
  const go = () => {
    if(!stM.on) return;
    stM.next = ctx.currentTime + 0.06;
    clearInterval(stM.timer); stM.timer = setInterval(stTick, 25); stTick();
  };
  if(ctx.state!=='running' && ctx.resume){ ctx.resume().then(go, go); } else go();
  stGoBtn();
}
// −＋：1回押すと1ずつ、長押しで連続して変わる（押し続けると速く）
function stBindSteps(el){
  el.querySelectorAll('[data-step]').forEach(btn => {
    const d = +btn.dataset.step;
    let t1 = null, t2 = null, n = 0, fromPointer = false;
    const stop = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = null; };
    btn.addEventListener('pointerdown', ev => {
      ev.preventDefault(); fromPointer = true; stop(); n = 0;
      stSetBpm(stM.bpm + d);
      t1 = setTimeout(() => { t2 = setInterval(() => { n++; stSetBpm(stM.bpm + d * (n > 15 ? 5 : 1)); }, 90); }, 400);
    });
    ['pointerup','pointerleave','pointercancel'].forEach(k => btn.addEventListener(k, stop));
    btn.addEventListener('contextmenu', ev => ev.preventDefault());
    // キーボード操作用（タップでは pointerdown 側で処理済み）
    btn.addEventListener('click', () => { if(fromPointer){ fromPointer = false; return; } stSetBpm(stM.bpm + d); });
  });
}
function stMetroStop(){
  stM.on = false; clearInterval(stM.timer); stM.timer = null;
  document.querySelectorAll('#st-dots i').forEach(d => d.classList.remove('on'));
  stGoBtn();
}
function stGoBtn(){
  const b = document.getElementById('st-go'); if(!b) return;
  b.classList.toggle('run', stM.on);
  b.innerHTML = stM.on ? '<svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>';
  b.setAttribute('aria-label', stM.on ? 'メトロノームを止める' : 'メトロノームを開始');
}
// 下のバー：構成表の表示中だけ出す。作り直さず使い回す（連打できるように）
function stMetroBar(show){
  let el = document.getElementById('st-mbar');
  if(!show){ if(el) el.hidden = true; return; }
  if(!el){
    el = document.createElement('div');
    el.id = 'st-mbar'; el.className = 'st-mbar';
    el.innerHTML = `<div class="st-mbar-in">
      <button type="button" data-step="-1" aria-label="テンポを下げる（長押しで連続）">−</button>
      <button type="button" class="st-bpm" id="st-bpm" onclick="stSetBpm(stSongBpm())"><span>120</span><small>BPM</small></button>
      <button type="button" data-step="1" aria-label="テンポを上げる（長押しで連続）">＋</button>
      <div class="st-dots" id="st-dots" aria-hidden="true"><i class="acc"></i><i></i><i></i><i></i></div>
      <button type="button" onclick="stTap()">TAP</button>
      <button type="button" id="st-sound" aria-pressed="true" aria-label="クリック音" onclick="stToggleSound()">音</button>
      <button type="button" class="st-go" id="st-go" onclick="stM.on ? stMetroStop() : stMetroStart()"></button>
    </div>`;
    document.body.appendChild(el);
    stBindSteps(el);
  }
  el.hidden = false;
  stSetBpm(stM.bpm); stGoBtn();
  const snd = document.getElementById('st-sound'); if(snd) snd.setAttribute('aria-pressed', stM.sound);
}
window.stSetBpm = stSetBpm; window.stSongBpm = stSongBpm; window.stM = stM;
window.stMetroStart = stMetroStart; window.stMetroStop = stMetroStop;
window.stToggleSound = () => { stM.sound = !stM.sound; const b = document.getElementById('st-sound'); if(b) b.setAttribute('aria-pressed', stM.sound); };
window.stTap = () => {
  const now = Date.now();
  stM.taps = stM.taps.filter(t => now - t < 2500); stM.taps.push(now);
  if(stM.taps.length > 8) stM.taps.shift();
  if(stM.taps.length >= 2) stSetBpm(60000 / ((stM.taps[stM.taps.length-1] - stM.taps[0]) / (stM.taps.length - 1)));
};

function tplDuration(v){
  v = String(v||'').normalize('NFKC').trim();
  if(!v) return DEFAULT_SONG_DUR;
  const m3 = v.match(/^(\d{1,2}):(\d{2}):(\d{2})$/);
  if(m3) v = (+m3[1]===0) ? `${+m3[2]}:${m3[3]}` : `${+m3[1]}:${m3[2]}`;
  const sec = parseDur(v);
  return sec>0 ? fmtDur(sec) : DEFAULT_SONG_DUR;
}
function tplGenre(v){
  v = String(v||'').trim(); if(!v) return '';
  const g = GENRE_OPTS.find(o => normName(o.label)===normName(v) || normName(o.value)===normName(v));
  return g ? g.value : v;
}

function importTemplateRows(rows){

    const heads = Object.keys(rows[0]);

    if(!col.name){ showToast('「曲名」の列が見つかりません。フォーマットの見出しはそのままにしてください。'); return; }
    const val = (row, f) => col[f] ? String(row[col[f]]||'').trim() : '';
    const dupKey = (name, orig) => normName(name) + '|' + normName(orig);
    const have = new Set(songs.map(s => dupKey(s.name, s.orig)));
    const added = []; let skipped = 0;
    const now = Date.now();
    rows.forEach((row, k) => {
      const name = val(row, 'name');
      if(!name || /^例[:：]/.test(name)) return;
      const orig = val(row, 'orig');
      const key = dupKey(name, orig);
      if(have.has(key)){ skipped++; return; }
      have.add(key);
      added.push({id:uid(), name, bpm: val(row,'bpm') || '-', key: val(row,'key') || '-', duration: tplDuration(val(row,'duration')),
        start: val(row,'start'), end: val(row,'end'), url: val(row,'url'), notes: val(row,'notes'),
        genre: tplGenre(val(row,'genre')), rhythm: val(row,'rhythm'), orig, updatedAt: now + k});
    });

      if(stockAddPos==='start') songs = [...added, ...songs]; else songs.push(...added);
      saveSongs();
    }
    closeBulk(); render();
    if(!added.length && !skipped) showToast('登録できる行がありませんでした。曲名を記入してください。');
    else if(!added.length) showToast(`新しく登録する曲はありませんでした（${skipped}曲はすべて登録済み）。`);
    else showToast(`${added.length}曲を登録しました${skipped ? `（${skipped}曲は登録済みのため飛ばしました）` : ''}。`);
  }

// 1行ずつ読み取る。番号・記号を外し、時間とアーティストを切り分ける
// ミュージックアプリの検索結果のように「曲名」の次の行が「曲・アーティスト」になっている形も読む
const DUR_RE = /[（(]?[0-9０-９]{1,2}[:：][0-5０-５][0-9０-９][)）]?/g;
const META_SEP = '\\s*[・·•･‧∙]\\s*';
const SONG_META_RE = new RegExp('^(?:曲|シングル|song|single)' + META_SEP + '(.*)$', 'i');
const OTHER_META_RE = new RegExp('^(?:アルバム|ミュージックビデオ|ビデオ|プレイリスト|ステーション|ラジオ|アーティスト|album|music video|playlist|station|artist)(?:' + META_SEP + '.*)?$', 'i');
function cleanTitle(t){
  let cut = false;
  // 末尾の「...」「…」は画面で切れた印。切れて閉じていない括弧も落とす
  if(/(\.{2,}|…+)\s*$/.test(t)){
    cut = true;
    t = t.replace(/[\s.…]+$/,'');
    const open = Math.max(t.lastIndexOf('('), t.lastIndexOf('（'));
    const close = Math.max(t.lastIndexOf(')'), t.lastIndexOf('）'));
    if(open > close) t = t.slice(0, open);
  }
  // リマスター表記は外す（セットリストでは不要なため）
  t = t.replace(/\s*[（(\[［][^)）\]］]*remaster[^)）\]］]*[)）\]］]/ig,'').replace(/\s+-\s+[^-]*remaster.*$/i,'');
  return {title: t.trim(), cut};
}
function parseBulkText(text){
  const lines = String(text||'').split(/\r?\n/).map(l => l.replace(/\s+/g,' ').trim())
    .filter(l => /[\p{L}\p{N}]/u.test(l));   // 記号だけの行（●・••など）は捨てる
  const out = [];
  let appFormat = false;
  lines.forEach(line => {
    const norm = line.normalize('NFKC');
    const songMeta = norm.match(SONG_META_RE);
    if(songMeta){
      appFormat = true;
      const prev = out[out.length-1];
      if(prev && !prev.meta){ prev.meta = 'song'; if(!prev.artist) prev.artist = songMeta[1].trim(); }
      return;
    }
    if(OTHER_META_RE.test(norm)){
      appFormat = true;
      const prev = out[out.length-1];
      if(prev && !prev.meta) prev.meta = 'other';
      return;
    }
    let t = line, dur = '';
    const ds = norm.match(/[0-9]{1,2}:[0-5][0-9]/g);
    if(ds){ dur = ds[ds.length-1]; t = t.replace(DUR_RE,' ').replace(/\s+/g,' ').trim(); }
    // 時間だけの行は、直前の曲の時間として使う
    if(!t || !/[\p{L}\p{N}]/u.test(t)){ if(dur && out.length && !out[out.length-1].duration) out[out.length-1].duration = dur; return; }
    t = t.replace(/^(?:[0-9０-９]{1,3}[.)．、:：]?\s+|[0-9０-９]{1,3}[.)．、]|[①-⑳]\s*|[-・•*●◯○▶►✓✔]\s*)/,'').trim();
    let artist = '';
    const sp = t.split(/\s+[-–—\/／]\s+/);
    if(sp.length >= 2){ t = sp[0].trim(); artist = sp.slice(1).join(' - ').trim(); }
    const c = cleanTitle(t);
    if(!c.title) return;
    out.push({name:c.title, artist, duration:dur, cut:c.cut, meta:'', junk: BULK_JUNK.test(c.title.normalize('NFKC')) || /^\d+$/.test(c.title) || [...c.title].length===1});
  });
  // アルバムやプレイリストなど曲でない項目は外す。アプリの画面の形なら「曲・」の付かない行は曲ではなさそうとして扱う
  return out.filter(x => x.meta !== 'other').map(x => ({...x, junk: x.junk || (appFormat && x.meta !== 'song' && !x.duration)}));
}
window.parseBulk = () => {

  if(!live) return;
  const have = new Set(live.setlist.filter(e=>e.type!=='other').map(e=>e.songId));

const SWIPE_W = 88;
let swipeState = null;
let swipeSuppressClick = false;
function closeSwipes(except){
  document.querySelectorAll('.swipe-open').forEach(el => {
    if(el===except) return;

document.addEventListener('pointerdown', e => {

  if(e.pointerType !== 'touch') return;
  const item = e.target.closest('[data-swipe]');
  if(!item){ closeSwipes(); return; }
  if(e.target.closest('.drag-handle, input, select, textarea, .swipe-bg')) return;
  closeSwipes(item);
  const face = item.querySelector('.swipe-face');
  if(!face) return;
  swipeState = {item, face, id:e.pointerId, x0:e.clientX, y0:e.clientY, locked:null, dx:0, base: item.classList.contains('swipe-open') ? -SWIPE_W : 0};
});

  const dx = e.clientX - st.x0, dy = e.clientY - st.y0;
  if(st.locked === null){
    if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    st.locked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  }
  if(st.locked !== 'x') return;
  st.dx = Math.min(0, Math.max(-SWIPE_W, st.base + dx));
  st.face.style.transition = 'none';
  st.face.style.transform = `translateX(${st.dx}px)`;
});
function endSwipe(e){
  const st = swipeState; if(!st || e.pointerId !== st.id) return;
  swipeState = null;
  const open = st.locked === 'x' ? st.dx < -SWIPE_W/2 : (st.locked === 'y' ? st.base !== 0 : false);
  if(st.locked === 'x') swipeSuppressClick = true;
  st.face.style.transform = open ? `translateX(-${SWIPE_W}px)` : '';
  st.item.classList.toggle('swipe-open', open);
}

// セットリストを「画面に見えている番号 + 曲名」だけのテキストにする（LINE等に貼り付け用）
function buildSetlistText(live, numbered=true, o=null){
  let seq = 0;
  const lines = [];
  live.setlist.forEach(e => {
    if(e.type==='other'){
      const label = e.label || 'その他';
      if(!showOthers){ if(e.numbered) seq++; return; }
      if(e.numbered){ seq++; lines.push(numbered ? `${seq}. ${label}` : label); }
      else lines.push(`・${label}`);
    } else {
      seq++;
      const s = songs.find(x=>x.id===e.songId);
      if(s) lines.push((numbered ? `${seq}. ` : '') + s.name + songSuffix(s, e, o));
    }
  });
  return lines.join('\n');
}
async function copyTextToClipboard(text){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); return true; }
  }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed; left:-9999px; top:0; opacity:0;';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }catch(e){ return false; }
}

// 曲名の後ろに付ける「 (BPM 92 / Key Cm)」。未設定や「-」は付けない。e があればイベントの値
function songSuffix(s, e, o){
  if(!o || (!o.bpm && !o.key)) return '';
  const v = f => e ? effVal(e, s, f) : songVal(s, f);
  const b = v('bpm'), k = v('key'), parts = [];
  if(o.bpm && b && b!=='-') parts.push(`BPM ${b}`);
  if(o.key && k && k!=='-') parts.push(`Key ${k}`);
  return parts.length ? ` (${parts.join(' / ')})` : '';
}

// ファイル書き出し：Claude のアーティファクトではその機能を、ふつうのブラウザ（GitHub Pages など）では
// スマホは共有シート（ファイルに保存・LINE・AirDrop など）、PC はダウンロードで保存する
function browserDownloads(){
  return { save: async ({filename, data, raw, type: forcedType}) => {
    const type = forcedType || (raw ? 'application/json' : 'text/csv');
    const blob = new Blob([raw ? data : '\ufeff' + data], {type: type + ';charset=utf-8'});  // CSVは先頭のBOMで Excel でも文字化けしない
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
    if(isMobile && typeof File==='function' && navigator.canShare){
      const file = new File([blob], filename, {type});
      if(navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file], title:filename}); showToast('書き出しました。'); return; }
        catch(e){ if(e && e.name==='AbortError'){ const err = new Error('cancel'); err.code = 'declined'; throw err; } }
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    showToast(`「${filename}」をダウンロードしました。`);
  }};
}
async function getDownloads(){
  if(window.claude && window.claude.use){
    try{ const d = await window.claude.use('downloads'); return { save: ({raw, type, ...o}) => d.save({...o, data: raw ? o.data : '\ufeff' + o.data}) }; }catch(e){}
  }
  return browserDownloads();
}

// ---- 簡易CSV ----
function csvEscape(val){
  const s = (val===null||val===undefined) ? '' : String(val);
  if(/[",\r\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function toCSV(headers, rows){
  const lines = [headers.map(csvEscape).join(',')];
  rows.forEach(r => lines.push(headers.map(h => csvEscape(r[h])).join(',')));
  return lines.join('\r\n');
}
// CSVの文字コード：UTF-8 で読めなければ Shift_JIS（Windows の Excel の「CSV（コンマ区切り）」）として読む
function decodeCsvBuffer(buf){
  try{ return new TextDecoder('utf-8', {fatal:true}).decode(buf); }
  catch(e){ try{ return new TextDecoder('shift_jis').decode(buf); }catch(e2){ return new TextDecoder('utf-8').decode(buf); } }
}
function parseCSV(text){
  text = String(text||'').replace(/^\ufeff/, '');  // 先頭のBOMを外す（Excel・書き出しファイル）
  const rows = [];
  let i=0, field='', row=[], inQuotes=false;
  const pushField = () => { row.push(field); field=''; };
  const pushRow = () => { pushField(); rows.push(row); row=[]; };
  while(i<text.length){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i+=2; continue; } inQuotes=false; i++; continue; }
      field += c; i++; continue;
    } else {
      if(c==='"'){ inQuotes=true; i++; continue; }
      if(c===','){ pushField(); i++; continue; }
      if(c==='\r'){ i++; continue; }
      if(c==='\n'){ pushRow(); i++; continue; }
      field += c; i++; continue;
    }
  }
  if(field.length || row.length) pushRow();
  if(rows.length===0) return [];
  const headers = rows[0];
  return rows.slice(1).filter(r => r.length>1 || r[0]!=='').map(r => {
    const obj = {};
    headers.forEach((h,idx) => { obj[h] = r[idx]!==undefined ? r[idx] : ''; });
    return obj;
  });
}

function buildEventRows(liveList){
  const rows = [];
  liveList.forEach(l => {
    const base = {event_id:l.id, event_date:l.date||'', event_venue:l.venue||'', event_place:l.place||'', event_artist:l.artist||'', event_start_time:l.startTime||'', event_end_time:l.endTime||'', event_memo:l.memo||'', event_updated_at:l.updatedAt||''};
    if(!l.setlist || l.setlist.length===0){
      rows.push({...base, entry_type:'', entry_song_id:'', entry_label:'', entry_bpm:'', entry_key:'', entry_duration:'', entry_notes:'', entry_numbered:''});
    } else {
      l.setlist.forEach(e => {
        if(e.type==='other'){
          rows.push({...base, entry_type:'other', entry_song_id:'', entry_label:e.label||'', entry_bpm:'', entry_key:'', entry_duration:e.duration||'', entry_notes:e.notes||'', entry_numbered:e.numbered?'true':'false'});
        } else {
          const s = songs.find(x=>x.id===e.songId);
          rows.push({...base, entry_type:'song', entry_song_id:e.songId||'', entry_label:'', entry_bpm:e.bpm||'', entry_key:e.key||'', entry_duration:e.duration||'', entry_notes:e.notes||'', entry_numbered:'',
            entry_song_name: s?s.name:'', entry_song_duration: s?s.duration:'', entry_song_start: s?s.start:'', entry_song_end: s?s.end:'', entry_song_url: s?s.url:'', entry_song_notes: s?s.notes:'', entry_song_genre: s?s.genre:'', entry_song_rhythm: s?(s.rhythm||''):'', entry_song_orig: s?(s.orig||''):'', entry_start: e.start||'', entry_end: e.end||''});
        }
      });
    }
  });
  return rows;
}

// ---- CSV入力：ファイルの種類を見分けてから読み込む（曲とイベントの取り違えを防ぐ）----
function readCsvFile(file, done){
  const reader = new FileReader();
  reader.onload = () => {
    let rows;
    try{ rows = parseCSV(decodeCsvBuffer(reader.result)); }catch(e){ showToast('CSVの読み込みに失敗しました。ファイル形式を確認してください。'); return; }
    if(!Array.isArray(rows)){ showToast('CSVの形式が正しくありません。'); return; }
    done(rows);
  };
  reader.readAsArrayBuffer(file);
}
// 1行目の見出しから種類を判定：event=イベント一覧 / song=曲マスタのCSV出力 / template=一括登録のフォーマット / unknown
function csvKind(rows){
  if(!rows.length) return 'empty';
  const h = new Set(Object.keys(rows[0]).map(k => normName(k)));
  if(['event_id','event_date','event_venue','entry_type'].some(k => h.has(k))) return 'event';
  if(h.has('name')) return 'song';
  if(TPL_ALIASES.name.some(a => h.has(normName(a)))) return 'template';
  return 'unknown';
}
const CSV_WRONG_FILE = '曲マスタ・イベント一覧のCSVではないようです。1行目の見出しを確認してください。';
window.handleSongImport = (file) => readCsvFile(file, rows => {
  const kind = csvKind(rows);
  if(kind==='song') return importSongRows(rows);
  if(kind==='template') return importTemplateRows(rows);
  if(kind==='event') return confirmAction('このファイルはイベント一覧のCSVのようです。\nイベント一覧として読み込みますか？', () => importLiveRows(rows), 'イベントとして読み込む');
  showToast(kind==='empty' ? '読み込める行がありません。' : CSV_WRONG_FILE);
});
window.handleLiveImport = (file) => readCsvFile(file, rows => {
  const kind = csvKind(rows);
  if(kind==='event') return importLiveRows(rows);
  if(kind==='song' || kind==='template') return confirmAction('このファイルは曲のCSVのようです（イベントの情報がありません）。\n曲マスタに読み込みますか？', () => kind==='song' ? importSongRows(rows) : importTemplateRows(rows), '曲マスタに読み込む');
  showToast(kind==='empty' ? '読み込める行がありません。' : CSV_WRONG_FILE);
});
function importSongRows(rows){
  let count = 0;
  rows.forEach(row => {
    if(!String(row.name||'').trim()) return;
    const item = {
      id: row.id || uid(),
      name: row.name.trim(), bpm: row.bpm||'', key: row.key||'', duration: row.duration||'',
      start: row.start||'', end: row.end||'', url: row.url||'', notes: row.notes||'', genre: row.genre||'', rhythm: row.rhythm||'', orig: row.orig||'',
      updatedAt: Number(row.updatedAt) || Date.now()
    };
    if(row.hidden==='1' || row.hidden==='true') item.hidden = true;
    const idx = songs.findIndex(s=>s.id===item.id);
    if(idx>=0){ if(songs[idx].struct) item.struct = songs[idx].struct; songs[idx] = item; } else songs.push(item);
    count++;
  });
  if(!count){ showToast('曲名のある行がありませんでした。'); return; }
  saveSongs(); render();
  showToast(`${count}件の曲データを読み込みました。`);
}
function importLiveRows(rows){
  const order = [];
  const groups = {};
  let addedSongs = 0;
  rows.forEach(row => {
    const hasEvent = ['event_date','event_venue','event_place','event_artist','event_start_time','event_end_time','event_memo'].some(k => String(row[k]||'').trim());
    const hasEntry = row.entry_type==='song' || row.entry_type==='other';
    if(!row.event_id && !hasEvent && !hasEntry) return;  // 何も入っていない行は読まない
    // IDが無い（手で作った）行は、日付＋イベント名が同じものを1つのイベントにまとめる
    const id = row.event_id || ('csv:' + normName(row.event_date) + '|' + normName(row.event_venue));
    if(!groups[id]){ groups[id] = {row, entries: []}; order.push(id); }
    if(row.entry_type==='song'){
      let songId = row.entry_song_id;
      if(!songId && row.entry_song_name){ const hit = songs.find(s => normName(s.name)===normName(row.entry_song_name)); songId = hit ? hit.id : uid(); }
      // 参照先の曲が手元にない場合は、埋め込まれたデータから自動で曲を追加する（他の人が共有したイベントを読み込むケース用）
      if(songId && !songs.find(s=>s.id===songId) && row.entry_song_name){
        songs.push({id: songId, name: row.entry_song_name, bpm: row.entry_bpm||'', key: row.entry_key||'', duration: row.entry_song_duration||'', start: row.entry_song_start||'', end: row.entry_song_end||'', url: row.entry_song_url||'', notes: row.entry_song_notes||'', genre: row.entry_song_genre||'', rhythm: row.entry_song_rhythm||'', orig: row.entry_song_orig||'', updatedAt: Date.now()});
        addedSongs++;
      }
      if(!songId || !songs.find(s=>s.id===songId)) return;  // 曲が特定できない行は入れない
      const en = {type:'song', songId, bpm: row.entry_bpm||'', key: row.entry_key||'', duration: row.entry_duration||''};
      ['start','end','notes'].forEach(f => { const v = row['entry_'+f]; if(v) en[f] = v; });
      groups[id].entries.push(en);
    } else if(row.entry_type==='other'){
      groups[id].entries.push({type:'other', id: uid(), label: row.entry_label||'', duration: row.entry_duration||'', notes: row.entry_notes||'', numbered: row.entry_numbered==='true'});
    }
  });
  let count = 0;
  order.forEach(id => {
    const g = groups[id];
    if(!String(g.row.event_venue||'').trim() && !String(g.row.event_date||'').trim() && !g.entries.length) return;  // 空のイベントは作らない
    const realId = id.startsWith('csv:') ? uid() : id;
    const item = {
      id: realId,
      date: g.row.event_date||'', venue: g.row.event_venue||'', place: g.row.event_place||'', artist: g.row.event_artist||'',
      startTime: g.row.event_start_time||'', endTime: g.row.event_end_time||'', memo: g.row.event_memo||'',
      updatedAt: Number(g.row.event_updated_at) || Date.now(),
      setlist: g.entries
    };
    const idx = lives.findIndex(l=>l.id===realId);
    if(idx>=0) lives[idx] = item; else lives.push(item);
    count++;
  });
  if(addedSongs>0) saveSongs();
  if(!count){ showToast('イベントとして読み込める行がありませんでした。'); return; }
  saveLives(); render();
  showToast(`${count}件のイベントを読み込みました${addedSongs>0?`（曲を${addedSongs}件自動追加）`:''}。`);
}

// 定番曲の索引：曲マスタには展開せず、曲名の候補としてだけ使う
const PACK_INDEX = Object.values(SONG_PACKS).flatMap(pk => pk.songs.map(([name, who, dur]) => ({name, who, dur, genre:pk.genre, credit:pk.credit, pack:pk.label})));
function packSuggestions(nq, limit){
  const have = new Set(songs.map(x=>normName(x.name)));
  return PACK_INDEX
    .map((p,idx) => ({p, idx, n:normName(p.name), w:normName(p.who)}))
    .filter(x => !have.has(x.n) && (x.n.includes(nq) || x.w.includes(nq)))
    .sort((a,b) => (b.n.startsWith(nq)-a.n.startsWith(nq)) || a.n.localeCompare(b.n,'ja'))
    .slice(0, limit);
}

// 通信が許される環境（GitHub Pages や Safari で直接開いた場合など）で動く。
// Claude の公開ページのように通信が止められている環境では、検索ページへのリンクに切り替える
const itunesCache = new Map();
let netBlocked = false;
let netResults = [];      // 最後に表示したカタログの検索結果
let netSeq = 0;           // 入力が変わったら古い結果を捨てるための番号
let netTimer = null;
let quickNetPick = null;  // イベントの「曲を登録」で選んだカタログの曲
function mapItunesGenre(g){
  const t = String(g||'').toLowerCase();
  if(t.includes('歌謡')) return 'kayo';
  if(t.includes('rock') || t.includes('ロック')) return 'rock';
  if(t.includes('blues') || t.includes('ブルース')) return 'blues';
  if(t.includes('classical') || t.includes('クラシック')) return 'classic';
  if(t.includes('latin') || t.includes('ラテン')) return 'latin';
  if(t.includes('pop') || t.includes('ポップ')) return 'pops';
  return '';
}
function itunesSearch(term){
  const key = normName(term);
  if(itunesCache.has(key)) return Promise.resolve(itunesCache.get(key));
  const url = `https://itunes.apple.com/search?term=${encodeURIComponent(term)}&country=JP&lang=ja_jp&media=music&entity=song&limit=8`;
  const viaFetch = () => {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 6000);
    return fetch(url, {signal:ctl.signal}).then(r => { clearTimeout(t); if(!r.ok) throw new Error('http'); return r.json(); });
  };
  const viaJsonp = () => new Promise((resolve, reject) => {
    const cb = '__itunes_' + Math.random().toString(36).slice(2);
    const sc = document.createElement('script');
    const done = (ok, v) => { clearTimeout(t); try{ delete window[cb]; }catch(e){ window[cb] = undefined; } sc.remove(); ok ? resolve(v) : reject(new Error('jsonp')); };
    const t = setTimeout(() => done(false), 6000);
    window[cb] = d => done(true, d);
    sc.onerror = () => done(false);
    sc.src = url + '&callback=' + cb;
    document.head.appendChild(sc);
  });
  return viaFetch().catch(viaJsonp).then(d => {
    const seen = new Set();
    const list = ((d && d.results) || []).filter(r => r && r.trackName).map(r => ({
      name: r.trackName, artist: r.artistName || '', album: r.collectionName || '',
      art: (r.artworkUrl100 || '').replace('100x100bb', '200x200bb'),
      dur: r.trackTimeMillis ? fmtDur(Math.round(r.trackTimeMillis/1000)) : '',
      url: r.trackViewUrl || '', genre: mapItunesGenre(r.primaryGenreName)
    })).filter(x => { const k = normName(x.name)+'|'+normName(x.artist); if(seen.has(k)) return false; seen.add(k); return true; });
    itunesCache.set(key, list);
    return list;
  });
}

// Deezer（公開の検索API・JSONP）。アートワーク・アルバム・時間が返る
function deezerSearch(term){
  return new Promise((resolve, reject) => {
    const cb = '__deezer_' + Math.random().toString(36).slice(2);
    const sc = document.createElement('script');
    const done = (ok, v) => { clearTimeout(t); try{ delete window[cb]; }catch(e){ window[cb] = undefined; } sc.remove(); ok ? resolve(v) : reject(new Error('deezer')); };
    const t = setTimeout(() => done(false), 8000);
    window[cb] = d => done(true, d);
    sc.onerror = () => done(false);
    sc.src = `https://api.deezer.com/search?q=${encodeURIComponent(term)}&limit=10&output=jsonp&callback=${cb}`;
    document.head.appendChild(sc);
  }).then(d => ((d && d.data) || []).filter(r => r && r.title).map(r => ({
    name: r.title, artist: (r.artist && r.artist.name) || '', album: (r.album && r.album.title) || '',
    art: (r.album && (r.album.cover_medium || r.album.cover_small)) || '',
    dur: r.duration ? fmtDur(r.duration) : '', url: r.link || '', genre: ''
  })));
}
// 2つの検索元をまとめて検索する（片方が失敗しても、もう片方の結果を出す）
function catalogSearch(term){
  const key = normName(term);
  if(catalogCache.has(key)) return Promise.resolve(catalogCache.get(key));
  return Promise.allSettled([itunesSearch(term), deezerSearch(term)]).then(([a, b]) => {
    const srcs = [['Apple Music', a], ['Deezer', b]];
    const status = srcs.map(([n, r]) => r.status === 'fulfilled' ? `${n} ${r.value.length}件` : `${n} 接続できず`).join(' / ');
    const allFailed = a.status === 'rejected' && b.status === 'rejected';
    const seen = new Set(); const list = [];
    for(const [, r] of srcs){
      if(r.status !== 'fulfilled') continue;
      for(const x of r.value){
        const k = normName(x.name) + '|' + normName(x.artist);
        if(!seen.has(k)){ seen.add(k); list.push(x); }
      }
    }
    const out = {list, status, allFailed};
    if(!allFailed) catalogCache.set(key, out);
    return out;
  });
}

  const keys = [];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf('setlist_')===0 && k!==SEEN_VERSION_KEY) keys.push(k);
    }
  }catch(e){}
  return keys.sort();
}
function backupStamp(){
  const d = new Date(), z = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}`;
}
window.exportBackup = async () => {
  const data = {};
  backupKeys().forEach(k => { try{ data[k] = JSON.parse(localStorage.getItem(k)); }catch(e){} });
  data.setlist_songs = songs; data.setlist_lives = lives;  // 画面上の最新の内容
  const obj = {app:'players-setlist', schemaVersion: SCHEMA_VERSION, appVersion: APP_VERSION, createdAt: new Date().toISOString(), data};
  const dl = await getDownloads();
  if(!dl){ showToast('この環境ではファイル書き出しができません。'); return; }
  try{ await dl.save({filename:`setlist-backup-${backupStamp()}.json`, data: JSON.stringify(obj, null, 1), raw:true}); }
  catch(err){ if(!err || err.code!=='declined') showToast('書き出しに失敗しました: '+((err&&err.message)||'不明なエラー')); }
};
function parseBackup(text){
  let obj;
  try{ obj = JSON.parse(String(text).replace(/^\ufeff/, '')); }catch(e){ return {error:'バックアップファイルとして読み込めませんでした。「バックアップ」で保存した .json ファイルを選んでください。'}; }
  if(!obj || obj.app!=='players-setlist' || !obj.data || typeof obj.data!=='object'){
    return {error:'このアプリのバックアップファイルではありません。「バックアップ」で保存した setlist-backup-日付.json を選んでください。（CSVは「曲マスタ」「イベント一覧」のCSV入力から読み込めます）'};
  }
  if((obj.schemaVersion||1) > SCHEMA_VERSION) return {error:'新しいバージョンのアプリで作られたバックアップです。アプリを最新にしてから復元してください。'};
  const d = obj.data;
  if(!Array.isArray(d.setlist_songs) || !Array.isArray(d.setlist_lives)) return {error:'バックアップの中身が壊れているようです（曲マスタまたはイベント一覧がありません）。'};
  return {obj, songs: d.setlist_songs.length, lives: d.setlist_lives.length};
}
function handleBackupFile(file){
  if(/\.csv$/i.test(file.name||'')){ showToast('CSVは「曲マスタ」「イベント一覧」のCSV入力から読み込んでください。'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const plan = parseBackup(reader.result);
    if(plan.error){ showToast(plan.error); return; }
    const o = plan.obj;
    let when = '';
    try{ const t = new Date(o.createdAt); if(!isNaN(t)) when = `${t.getFullYear()}/${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`; }catch(e){}
    const msg = `このバックアップを復元しますか？\n作成日時：${when||'不明'}${o.appVersion?'（v'+o.appVersion+'）':''}\n内容：曲${plan.songs}曲・イベント${plan.lives}件\n\n今の曲マスタ（${songs.length}曲）とイベント一覧（${lives.length}件）、表示などの設定は、すべてこの内容に置き換わります。`;
    confirmAction(msg, () => applyBackup(o), '復元する');
  };
  reader.onerror = () => showToast('ファイルを読み込めませんでした。');
  reader.readAsText(file);
}
function applyBackup(obj){
  try{
    backupKeys().forEach(k => localStorage.removeItem(k));
    Object.keys(obj.data).forEach(k => { if(k.indexOf('setlist_')===0 && k!==SEEN_VERSION_KEY) localStorage.setItem(k, JSON.stringify(obj.data[k])); });
    localStorage.setItem(SEEN_VERSION_KEY, JSON.stringify(APP_VERSION));
    sessionStorage.setItem('setlist_restored', '1');
  }catch(e){ showToast('復元に失敗しました: ' + (e && e.message || '不明なエラー')); return; }
  location.reload();
}
try{ if(sessionStorage.getItem('setlist_restored')){ sessionStorage.removeItem('setlist_restored'); setTimeout(() => showToast('バックアップから復元しました。'), 300); } }catch(e){}

window.resetAllData = () => {
  confirmAction('曲マスタとイベント一覧のすべてのデータを削除します。よろしいですか？\nこの操作は取り消せません。', () => {
    songs = []; lives = [];
    saveSongs(); saveLives();
    stopMetro(); resetTimerState();
    liveEditId = null; songForm = null; songExpandedId = null; entryExpandedIdx = null;
    tab = 'songs';
    render();
    showToast('全データを初期化しました。');
  }, '初期化する');
};

render();
</script>
